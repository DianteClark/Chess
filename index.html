<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141a2e">
<meta name="description" content="Knight Club: play chess against bots, solve puzzles, learn to play, and challenge friends peer-to-peer.">
<title>Knight Club Chess</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>:root{
  --bg:#141a2e; --bg2:#1c2440; --card:#232d4f; --card2:#2b3760; --line:#34416e;
  --text:#f3f1ea; --muted:#a9b0c9; --accent:#ffb547; --accent2:#ff8a5c; --good:#4fd18b; --bad:#ff6b6b; --blue:#6fb3ff;
  --light:#f0e2c6; --dark:#b5875a; --r:16px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Nunito',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:16px;line-height:1.4}
body{min-height:100vh;padding-bottom:calc(76px + var(--safe-b))}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;cursor:pointer;background:none}
input{font-family:inherit;font-size:16px}
h1,h2,h3{margin:0;line-height:1.15}
.app{max-width:560px;margin:0 auto;padding:12px 14px 20px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 12px}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:22px;letter-spacing:.2px}
.logo img{width:30px;height:30px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);padding:6px 10px;border-radius:999px;font-weight:800;font-size:14px}
.chip small{color:var(--muted);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack>*+*{margin-top:12px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:14px;font-weight:800;background:var(--card2);border:1px solid var(--line);transition:transform .08s,filter .15s;min-height:46px}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,#ffc56b,#ff9f43);color:#3a2205;border:0;box-shadow:0 4px 0 #c96f1a}
.btn.primary:active{box-shadow:0 1px 0 #c96f1a;transform:translateY(3px)}
.btn.good{background:var(--good);color:#06301a;border:0}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.sm{padding:8px 10px;min-height:38px;font-size:14px;border-radius:12px}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px 6px;border-radius:10px;font-weight:800;color:var(--muted);font-size:14px}
.seg button.on{background:var(--card2);color:var(--text)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(20,26,46,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + var(--safe-b));z-index:20}
.tabs .inner{display:flex;max-width:560px;width:100%}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);font-size:12px;font-weight:800;border-radius:12px}
.tabs button .ic{font-size:22px;line-height:1}
.tabs button.on{color:var(--accent);background:rgba(255,181,71,.08)}
/* board */
.board-wrap{position:relative;width:100%;aspect-ratio:1;border-radius:10px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35),0 0 0 3px #3b2a1b;touch-action:none;user-select:none;-webkit-user-select:none}
.board{position:absolute;inset:0}
.sq{position:absolute;width:12.5%;height:12.5%}
.sq.l{background:var(--light)} .sq.d{background:var(--dark)}
.sq .co{position:absolute;font-size:10px;font-weight:900;opacity:.75;pointer-events:none}
.sq .co.f{right:3px;bottom:1px} .sq .co.r{left:3px;top:1px}
.sq.l .co{color:var(--dark)} .sq.d .co{color:var(--light)}
.sq.last::after{content:'';position:absolute;inset:0;background:rgba(255,213,0,.38)}
.sq.sel::after{content:'';position:absolute;inset:0;background:rgba(80,200,120,.5)}
.sq.hint::after{content:'';position:absolute;inset:0;background:rgba(111,179,255,.55);animation:pulse 1s infinite alternate}
.sq.mark::after{content:'';position:absolute;inset:0;background:rgba(111,179,255,.4)}
.sq.check::before{content:'';position:absolute;inset:0;background:radial-gradient(circle,rgba(255,40,40,.95) 0%,rgba(255,40,40,.5) 40%,rgba(255,40,40,0) 72%)}
.sq .dot{position:absolute;left:50%;top:50%;width:30%;height:30%;margin:-15% 0 0 -15%;border-radius:50%;background:rgba(20,30,20,.28);z-index:3;pointer-events:none}
.sq .ring{position:absolute;inset:4%;border-radius:50%;border:5px solid rgba(20,30,20,.28);z-index:3;pointer-events:none}
.sq .star{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(7vw,34px);z-index:4;pointer-events:none;animation:bob 1.2s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(-2px) scale(.95)}to{transform:translateY(2px) scale(1.05)}}
@keyframes pulse{from{opacity:.5}to{opacity:1}}
.pieces{position:absolute;inset:0;pointer-events:none}
.piece{position:absolute;width:12.5%;height:12.5%;background-size:100%;background-repeat:no-repeat;z-index:5;transition:left .18s ease,top .18s ease;will-change:left,top}
.piece.drag{transition:none;z-index:50;transform:scale(1.25);filter:drop-shadow(0 6px 6px rgba(0,0,0,.35))}
.piece.noanim{transition:none}
.fx{position:absolute;inset:0;pointer-events:none;z-index:60;display:flex;align-items:center;justify-content:center}
.fx .burst{font-size:64px;animation:pop .7s ease-out forwards}
@keyframes pop{0%{transform:scale(.2);opacity:0}40%{transform:scale(1.2);opacity:1}100%{transform:scale(1);opacity:0}}
/* players */
.pbar{display:flex;align-items:center;gap:10px;padding:8px 4px}
.avatar{width:38px;height:38px;border-radius:12px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.pname{font-weight:900;font-size:15px}
.prating{color:var(--muted);font-weight:700;font-size:13px}
.caps{display:flex;align-items:center;min-height:18px;flex-wrap:wrap}
.caps img{width:16px;height:16px;margin-right:-4px}
.caps b{margin-left:8px;font-size:12px;color:var(--muted)}
.thinking{font-size:12px;color:var(--accent);font-weight:800}
.turnmark{width:10px;height:10px;border-radius:50%;background:var(--good);box-shadow:0 0 8px var(--good)}
.moves{display:flex;gap:4px;overflow-x:auto;padding:8px 2px;scrollbar-width:none;font-size:14px;white-space:nowrap}
.moves::-webkit-scrollbar{display:none}
.moves .n{color:var(--muted);font-weight:700;padding:3px 0 3px 4px}
.moves .m{padding:3px 7px;border-radius:8px;font-weight:800}
.moves .m.cur{background:var(--card2);color:var(--accent)}
.controls{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.controls .btn{padding:8px 2px;flex-direction:column;gap:0;font-size:11px;min-height:54px}
.controls .btn .ic{font-size:20px}
.nav{display:flex;gap:6px;justify-content:center;margin:2px 0}
.nav .btn{flex:1;min-height:36px;padding:4px}
/* bot list */
.bots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bot{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px}
.bot.on{border-color:var(--accent);background:#2e3150}
.bot .av{font-size:30px}
.bot .nm{font-weight:900}
.bot .rt{font-weight:800;color:var(--accent);font-size:14px}
.bot .bl{font-size:12px;color:var(--muted)}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(5,8,18,.65);display:flex;align-items:flex-end;justify-content:center;z-index:100;padding:12px;animation:fade .15s}
@media(min-width:600px){.modal-bg{align-items:center}}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:22px;padding:20px;width:100%;max-width:440px;animation:up .2s ease-out;max-height:90vh;overflow:auto}
@keyframes fade{from{opacity:0}} @keyframes up{from{transform:translateY(30px);opacity:0}}
.modal h2{font-size:24px;margin-bottom:6px}
.big-emoji{font-size:54px;text-align:center}
.promo{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.promo button{background:var(--light);border-radius:14px;aspect-ratio:1;background-size:80%;background-position:center;background-repeat:no-repeat}
.delta{font-weight:900;font-size:20px}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)}
/* learn */
.lessons{display:grid;gap:10px}
.lgroup h3{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin:14px 2px 8px}
.lesson{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;text-align:left;width:100%}
.lesson .ic{width:44px;height:44px;border-radius:12px;background:var(--light);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none;background-size:80%;background-position:center;background-repeat:no-repeat}
.lesson .t{font-weight:900}
.lesson .d{font-size:13px;color:var(--muted)}
.lesson .ck{margin-left:auto;font-size:20px}
.bubble{display:flex;gap:10px;align-items:flex-start}
.bubble .who{font-size:40px;line-height:1}
.bubble .txt{background:#fff8ea;color:#2d2416;border-radius:18px;border-top-left-radius:4px;padding:12px 14px;font-size:17px;font-weight:700;flex:1}
.bubble .txt b{color:#c2410c}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)} .dots i.on{background:var(--accent)} .dots i.done{background:var(--good)}
.taskmsg{text-align:center;font-weight:900;min-height:24px}
.taskmsg.good{color:var(--good)} .taskmsg.bad{color:var(--bad)}
/* puzzles */
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.cats::-webkit-scrollbar{display:none}
.cats button{white-space:nowrap;padding:8px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:800;font-size:13px;color:var(--muted)}
.cats button.on{background:var(--accent);color:#3a2205;border-color:var(--accent)}
.banner{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:800}
.banner.good{background:rgba(79,209,139,.15);border-color:var(--good)}
.banner.bad{background:rgba(255,107,107,.13);border-color:var(--bad)}
.tomove{width:18px;height:18px;border-radius:50%;border:2px solid #888;flex:none}
/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat .v{font-size:30px;font-weight:900}
.stat .l{font-size:13px;color:var(--muted);font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td{padding:7px 4px;border-bottom:1px solid var(--line)}
.tbl td:last-child{text-align:right;font-weight:800}
.spark{width:100%;height:70px;display:block}
.code{font-size:38px;font-weight:900;letter-spacing:8px;text-align:center;color:var(--accent);background:var(--bg2);border-radius:14px;padding:10px;border:2px dashed var(--line)}
.input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--text);font-weight:800}
.code-input{text-transform:uppercase;letter-spacing:6px;text-align:center;font-size:26px}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-weight:800;z-index:200;animation:up .2s;box-shadow:0 8px 20px rgba(0,0,0,.3);max-width:92vw;text-align:center}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:800;background:var(--card2);color:var(--muted)}
.pill.live{background:rgba(79,209,139,.2);color:var(--good)}
.hidden{display:none!important}
.center{text-align:center}
a{color:var(--blue)}
/* ---- original icon system ---- */
.icn{display:inline-flex;align-items:center;justify-content:center;line-height:0;flex:none}
.icn svg{display:block}
.btn .icn{margin:0 -1px}
.controls .btn .icn{margin-bottom:3px}
.tabs button .icn{margin-bottom:1px}
.seg button{display:inline-flex;align-items:center;justify-content:center;gap:5px}
.chip .icn{color:var(--blue)}
.rt .icn{color:var(--accent);vertical-align:-2px}
.av-img{display:block;border-radius:50%}
.avatar{background:none;padding:0}
.avatar .av-img{border-radius:12px}
.bot .av .av-img{border-radius:14px}
.sq .star .icn{color:#ffc93c;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.sq .star .icn svg{width:min(8vw,40px);height:min(8vw,40px)}
.burst-ic{filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.burst-ic.star,.burst-ic.trophy,.burst-ic.crown{color:#ffc93c}
.badge{width:76px;height:76px;margin:0 auto 6px;border-radius:24px;display:flex;align-items:center;justify-content:center}
.badge.gold{background:linear-gradient(160deg,#ffd77a,#ff9f43);color:#4a2a05}
.badge.blue{background:linear-gradient(160deg,#9ccbff,#4f8fe8);color:#0c2547}
.badge.red{background:linear-gradient(160deg,#ffa3a3,#e86a6a);color:#4a0c0c}
.badge.green{background:linear-gradient(160deg,#8ff0bd,#3cbf7c);color:#063019}
.lesson .ic.dark{background:var(--card2);color:var(--accent)}
.lesson .ck{color:var(--muted)} .lesson .ck.done{color:var(--good)}
.bubble .who{flex:none}
.hoot{display:block}
.banner .icn{color:var(--accent)} .banner.good .icn{color:var(--good)}
.tbl td.res{font-weight:800;font-size:13px} .tbl td.res.w{color:var(--good)} .tbl td.res.l{color:var(--bad)} .tbl td.res.d{color:var(--blue)}
.stat .l .icn{vertical-align:-2px}
</style>
</head>

<div id="app" class="app"></div>
<script>// Chess rules engine + search. Written as one self-contained factory so it can run
// in the page, in a Web Worker (via Function.toString), and in Node for testing.
function ChessEngineFactory() {
  'use strict';
  const P = 1, N = 2, B = 3, R = 4, Q = 5, K = 6, BLACK = 8;
  const WHITE_SIDE = 0, BLACK_SIDE = 1;
  const F_CAP = 1, F_EP = 2, F_CASTLE = 4, F_DOUBLE = 8;
  const N_OFF = [33, 31, 18, 14, -33, -31, -18, -14];
  const K_OFF = [1, -1, 16, -16, 17, 15, -17, -15];
  const B_OFF = [17, 15, -17, -15];
  const R_OFF = [1, -1, 16, -16];
  const PIECE_CHARS = ' PNBRQK  pnbrqk';

  // ---------- zobrist ----------
  let seed = 0x2545F491;
  function rnd() { seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5; return seed >>> 0; }
  const Z1 = new Uint32Array(16 * 128), Z2 = new Uint32Array(16 * 128);
  for (let i = 0; i < Z1.length; i++) { Z1[i] = rnd(); Z2[i] = rnd(); }
  const ZC1 = new Uint32Array(16), ZC2 = new Uint32Array(16);
  for (let i = 0; i < 16; i++) { ZC1[i] = rnd(); ZC2[i] = rnd(); }
  const ZE1 = new Uint32Array(8), ZE2 = new Uint32Array(8);
  for (let i = 0; i < 8; i++) { ZE1[i] = rnd(); ZE2[i] = rnd(); }
  const ZS1 = rnd(), ZS2 = rnd();

  const CASTLE_MASK = new Uint8Array(128).fill(15);
  CASTLE_MASK[4] = 15 & ~3; CASTLE_MASK[7] = 15 & ~1; CASTLE_MASK[0] = 15 & ~2;
  CASTLE_MASK[116] = 15 & ~12; CASTLE_MASK[119] = 15 & ~4; CASTLE_MASK[112] = 15 & ~8;

  const sqName = s => 'abcdefgh'[s & 7] + ((s >> 4) + 1);
  const sqFromName = n => (n.charCodeAt(0) - 97) + (n.charCodeAt(1) - 49) * 16;
  const mFrom = m => m & 127, mTo = m => (m >> 7) & 127, mPromo = m => (m >> 14) & 15, mFlags = m => (m >> 18) & 15;
  const mk = (from, to, promo, flags) => from | (to << 7) | (promo << 14) | (flags << 18);
  const colorOf = p => (p & BLACK) ? 1 : 0;

  class Position {
    constructor(fen) {
      this.board = new Int8Array(128);
      this.load(fen || 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1');
    }
    load(fen) {
      const parts = fen.trim().split(/\s+/);
      this.board.fill(0);
      let rank = 7, file = 0;
      for (const c of parts[0]) {
        if (c === '/') { rank--; file = 0; continue; }
        if (c >= '1' && c <= '8') { file += +c; continue; }
        const idx = PIECE_CHARS.indexOf(c);
        if (idx < 0) throw new Error('bad fen');
        this.board[rank * 16 + file] = idx;
        file++;
      }
      this.turn = parts[1] === 'b' ? 1 : 0;
      this.castle = 0;
      const c = parts[2] || '-';
      if (c.includes('K')) this.castle |= 1; if (c.includes('Q')) this.castle |= 2;
      if (c.includes('k')) this.castle |= 4; if (c.includes('q')) this.castle |= 8;
      this.ep = (parts[3] && parts[3] !== '-') ? sqFromName(parts[3]) : -1;
      this.half = parts[4] ? +parts[4] : 0;
      this.full = parts[5] ? +parts[5] : 1;
      this.kings = [-1, -1];
      for (let s = 0; s < 128; s++) {
        if (s & 0x88) { s += 7; continue; }
        if (this.board[s] === K) this.kings[0] = s;
        if (this.board[s] === (K | BLACK)) this.kings[1] = s;
      }
      // sanitize castling rights against actual piece placement
      const b = this.board;
      if (!(b[4] === K && b[7] === R)) this.castle &= ~1;
      if (!(b[4] === K && b[0] === R)) this.castle &= ~2;
      if (!(b[116] === (K | BLACK) && b[119] === (R | BLACK))) this.castle &= ~4;
      if (!(b[116] === (K | BLACK) && b[112] === (R | BLACK))) this.castle &= ~8;
      if (this.ep >= 0 && !this.epCapturable(this.ep, this.turn)) this.ep = -1;
      this.stack = [];
      this.computeHash();
      this.hist1 = [this.h1]; this.hist2 = [this.h2];
    }
    epCapturable(epSq, side) {
      // is there a pawn of `side` that could capture onto epSq?
      const pawn = side === 0 ? P : (P | BLACK);
      const from1 = side === 0 ? epSq - 15 : epSq + 15, from2 = side === 0 ? epSq - 17 : epSq + 17;
      return (!(from1 & 0x88) && this.board[from1] === pawn) || (!(from2 & 0x88) && this.board[from2] === pawn);
    }
    computeHash() {
      let h1 = 0, h2 = 0;
      for (let s = 0; s < 128; s++) {
        if (s & 0x88) { s += 7; continue; }
        const p = this.board[s];
        if (p) { h1 ^= Z1[p * 128 + s]; h2 ^= Z2[p * 128 + s]; }
      }
      h1 ^= ZC1[this.castle]; h2 ^= ZC2[this.castle];
      if (this.ep >= 0) { h1 ^= ZE1[this.ep & 7]; h2 ^= ZE2[this.ep & 7]; }
      if (this.turn) { h1 ^= ZS1; h2 ^= ZS2; }
      this.h1 = h1 >>> 0; this.h2 = h2 >>> 0;
    }
    fen() {
      let out = '';
      for (let r = 7; r >= 0; r--) {
        let empty = 0;
        for (let f = 0; f < 8; f++) {
          const p = this.board[r * 16 + f];
          if (!p) { empty++; continue; }
          if (empty) { out += empty; empty = 0; }
          out += PIECE_CHARS[p];
        }
        if (empty) out += empty;
        if (r) out += '/';
      }
      let c = '';
      if (this.castle & 1) c += 'K'; if (this.castle & 2) c += 'Q';
      if (this.castle & 4) c += 'k'; if (this.castle & 8) c += 'q';
      return `${out} ${this.turn ? 'b' : 'w'} ${c || '-'} ${this.ep >= 0 ? sqName(this.ep) : '-'} ${this.half} ${this.full}`;
    }
    clone() { const p = new Position(this.fen()); return p; }

    attacked(sq, by) {
      const b = this.board;
      if (by === 0) {
        let s = sq - 15; if (!(s & 0x88) && b[s] === P) return true;
        s = sq - 17; if (!(s & 0x88) && b[s] === P) return true;
      } else {
        let s = sq + 15; if (!(s & 0x88) && b[s] === (P | BLACK)) return true;
        s = sq + 17; if (!(s & 0x88) && b[s] === (P | BLACK)) return true;
      }
      const cb = by ? BLACK : 0;

      for (let i = 0; i < moves.length; i++) {
        const m = moves[i];
        if (m === ttMove) { scores[i] = 10000000; continue; }
        const fl = mFlags(m);
        if (fl & F_CAP) {
          const victim = (fl & F_EP) ? P : (b[mTo(m)] & 7);
          scores[i] = 1000000 + MVV[victim] * 100 - MVV[b[mFrom(m)] & 7];
        } else if (mPromo(m)) scores[i] = 900000 + mPromo(m);
        else if (m === k[0]) scores[i] = 800000;
        else if (m === k[1]) scores[i] = 700000;
        else scores[i] = this.history[mFrom(m) * 128 + mTo(m)];
      }
      // insertion sort by score desc
      for (let i = 1; i < moves.length; i++) {
        const m = moves[i], s = scores[i]; let j = i - 1;
        while (j >= 0 && scores[j] < s) { moves[j + 1] = moves[j]; scores[j + 1] = scores[j]; j--; }
        moves[j + 1] = m; scores[j + 1] = s;
      }
      return moves;
    }
    hasNonPawn(side) {
      const b = this.pos.board, cb = side ? BLACK : 0;
      for (let s = 0; s < 128; s++) {
        if (s & 0x88) { s += 7; continue; }
        const p = b[s]; if (p && (p & BLACK) === cb) { const t = p & 7; if (t !== P && t !== K) return true; }
      }
      return false;
    }
    negamax(depth, alpha, beta, ply, wasNull) {
      const pos = this.pos;
      this.nodes++;
      if ((this.nodes & 255) === 0) this.checkStop();
      if (this.stop) return 0;
      if (ply > 0) {
        if (pos.half >= 100 || pos.insufficientMaterial()) return 0;
        // repetition: any repeat counts as draw inside the tree
        const n = pos.hist1.length - 1;
        for (let i = n - 2; i >= 0 && i >= n - pos.half; i -= 2)
          if (pos.hist1[i] === pos.h1 && pos.hist2[i] === pos.h2) return 0;
        // mate distance pruning
        alpha = Math.max(alpha, -MATE + ply); beta = Math.min(beta, MATE - ply - 1);
        if (alpha >= beta) return alpha;
      }
      const inCheck = pos.inCheck();
      if (inCheck) depth++;
      if (depth <= 0) return this.quiesce(alpha, beta, ply, 0);
      if (ply >= 100) return evaluate(pos, this.noise, this.salt);

      let ttMove = 0;
      const ti = this.ttProbe(pos);
      if (ti >= 0) {
        ttMove = this.ttMove[ti];
        if (ply > 0 && this.ttDepth[ti] >= depth) {
          let s = this.ttScore[ti];
          if (s > MATE - 500) s -= ply; else if (s < -MATE + 500) s += ply;
          const f = this.ttFlag[ti];
          if (f === 1) return s;
          if (f === 2 && s >= beta) return s;
          if (f === 3 && s <= alpha) return s;
        }
      }
      const pvNode = beta - alpha > 1;
      // null move pruning
      if (!pvNode && !inCheck && !wasNull && depth >= 3 && ply > 0 && this.hasNonPawn(pos.turn)) {
        const se = evaluate(pos, this.noise, this.salt);
        if (se >= beta) {
          pos.makeNull();
          const s = -this.negamax(depth - 3, -beta, -beta + 1, ply + 1, true);
          pos.unmakeNull();
          if (this.stop) return 0;
          if (s >= beta && s < MATE - 500) return beta;
        }
      }
      const moves = this.orderMoves(pos.genMoves(), ttMove, ply);
      let bestScore = -INF, bestMove = 0, legal = 0;
      const origAlpha = alpha;
      for (let i = 0; i < moves.length; i++) {
        const m = moves[i];
        if (!pos.tryMake(m)) continue;
        legal++;
        const quiet = !(mFlags(m) & F_CAP) && !mPromo(m);
        let score;
        if (legal === 1) score = -this.negamax(depth - 1, -beta, -alpha, ply + 1, false);
        else {
          let red = 0;
          if (depth >= 3 && legal > 4 && quiet && !inCheck && !pos.inCheck()) red = legal > 10 ? 2 : 1;
          score = -this.negamax(depth - 1 - red, -alpha - 1, -alpha, ply + 1, false);
          if (score > alpha && red) score = -this.negamax(depth - 1, -alpha - 1, -alpha, ply + 1, false);
          if (score > alpha && score < beta) score = -this.negamax(depth - 1, -beta, -alpha, ply + 1, false);
        }
        pos.unmake();
        if (this.stop) return 0;
        if (score > bestScore) {
          bestScore = score; bestMove = m;
          if (ply === 0) { this.rootBest = m; this.rootBestScore = score; }
          if (score > alpha) {
            alpha = score;
            if (alpha >= beta) {
              if (quiet) {
                const k = this.killers[ply];
                if (k && k[0] !== m) { k[1] = k[0]; k[0] = m; }
                this.history[mFrom(m) * 128 + mTo(m)] += depth * depth;
              }
              break;
            }
          }
        }
      }
      if (!legal) return inCheck ? -MATE + ply : 0;
      const flag = bestScore >= beta ? 2 : bestScore > origAlpha ? 1 : 3;
      this.ttStore(pos, depth, bestScore, flag, bestMove, ply);
      return bestScore;
    }
    quiesce(alpha, beta, ply, qd) {
      const pos = this.pos;
      this.nodes++;
      if ((this.nodes & 255) === 0) this.checkStop();
      if (this.stop) return 0;
      const stand = evaluate(pos, this.noise, this.salt);
      if (stand >= beta) return stand;
      if (stand > alpha) alpha = stand;
      if (qd > 8) return stand;
      const moves = this.orderMoves(pos.genMoves(true), 0, 127);
      const b = pos.board;
      let best = stand;
      for (const m of moves) {
        const fl = mFlags(m);
        const victim = (fl & F_EP) ? P : (b[mTo(m)] & 7);
        if (!mPromo(m) && stand + VAL[victim] + 200 < alpha) continue; // delta pruning
        if (!pos.tryMake(m)) continue;
        const s = -this.quiesce(-beta, -alpha, ply + 1, qd + 1);
        pos.unmake();
        if (this.stop) return 0;
        if (s > best) { best = s; if (s > alpha) { alpha = s; if (s >= beta) break; } }
      }
      return best;
    }
  }

  // =============== MATE SOLVER (for puzzles) ===============
  // returns true if side to move can force mate within n moves
  function canMateIn(pos, n) {
    if (n <= 0) return false;
    const moves = orderForMate(pos, pos.genMoves());
    for (const m of moves) {
      if (!pos.tryMake(m)) continue;
      const ok = defenderLoses(pos, n - 1);
      pos.unmake();
      if (ok) return true;
    }
    return false;
  }
  function defenderLoses(pos, n) {
    // side to move is defender; true if every reply leads to mate within n more attacker moves
    let any = false;
    const moves = pos.genMoves();
    for (const m of moves) {
      if (!pos.tryMake(m)) continue;
      any = true;
      const ok = n > 0 && canMateIn(pos, n);
      pos.unmake();
      if (!ok) return false;
    }
    if (!any) return pos.inCheck(); // checkmate yes, stalemate no
    return true;
  }
  function orderForMate(pos, moves) {
    // checks first, then captures
    const sc = moves.map(m => {
      let s = 0;
      if (mFlags(m) & F_CAP) s += 1;
      if (mPromo(m) === Q) s += 1;
      if (pos.tryMake(m)) { if (pos.inCheck()) s += 10; pos.unmake(); } else s = -100;
      return s;
    });
    return moves.map((m, i) => [m, sc[i]]).filter(x => x[1] > -100).sort((a, b) => b[1] - a[1]).map(x => x[0]);
  }
  // all attacker moves that force mate within n
  function matingMoves(pos, n) {
    const out = [];
    for (const m of pos.legalMoves()) {
      pos.make(m);
      if (defenderLoses(pos, n - 1)) out.push(m);
      pos.unmake();
    }
    return out;
  }
  // shortest mate length (in moves) for side to move up to maxN, or 0
  function mateLength(pos, maxN) { for (let n = 1; n <= maxN; n++) if (canMateIn(pos, n)) return n; return 0; }

  const api = { Position, Searcher, evaluate, canMateIn, matingMoves, mateLength, defenderLoses, sqName, sqFromName,
    mFrom, mTo, mPromo, mFlags, F_CAP, F_EP, F_CASTLE, F_DOUBLE, P, N, B, R, Q, K, BLACK, MATE, PIECE_CHARS };
  return api;
}

function botChooseMove(E, searcher, pos, level, rng, salt, plyIndex, bookLine) {
  const legal = pos.legalMoves();
  if (!legal.length) return null;
  if (bookLine && plyIndex < level.book && plyIndex < bookLine.length) {
    const m = pos.moveFromSan(bookLine[plyIndex]);
    if (m) return { uci: pos.uci(m), book: true };
  }
  if (level.blunder && rng() < level.blunder) {
    const m = legal[Math.floor(rng() * legal.length)];
    return { uci: pos.uci(m), blunder: true };
  }
  const r = searcher.search(pos, { maxDepth: level.depth, maxNodes: level.nodes, noise: level.noise, salt });
  return { uci: pos.uci(r.move || legal[0]), score: r.score, depth: r.depth };
}

    { type: 'goal', text: 'The black king is stuck behind its own pawns. Find <b>checkmate in one move</b>!', fen: '6k1/5ppp/8/8/8/8/8/R5K1 w - - 0 1', goal: 'mate', success: 'Checkmate! That is called a back-rank mate.' },
    { type: 'goal', text: 'Your king helps your queen. Find the <b>checkmate</b>!', fen: '4k3/8/4K3/8/8/8/8/7Q w - - 0 1', goal: 'mate', success: 'Checkmate! Teamwork!' },
    { type: 'goal', text: 'A famous trap! The square f7 is weak. Find <b>checkmate</b>!', fen: 'r1bqkb1r/pppp1ppp/2n2n2/4p2Q/2B1P3/8/PPPP1PPP/RNB1K1NR w KQkq - 4 4', goal: 'mate', success: "Checkmate! That's Scholar's Mate. Watch out for it in your own games!" },
  ] },
  { id: 'castling', group: 'Special Moves', icon: 'castle', title: 'Castling', desc: 'Tuck your king in safe', steps: [
    { type: 'text', text: '<b>Castling</b> is a special move that keeps your king safe. The king moves <b>two squares</b> toward a rook, and the rook <b>hops over</b> to the other side of the king.', board: '4k3/8/8/8/8/8/8/R3K2R', marks: ['e1', 'g1', 'f1', 'h1'] },
    { type: 'text', text: 'You can castle only if: the king and that rook <b>have not moved</b> yet, nothing is <b>between</b> them, and the king is <b>not in check</b> and won\'t pass through check.' },
    { type: 'goal', text: 'Castle! Tap your king, then tap the square <b>two steps to the right</b>.', fen: 'r3k2r/pppq1ppp/2npbn2/2b1p3/2B1P3/2NP1N2/PPP2PPP/R1BQK2R w KQkq - 0 1', goal: 'castle', success: 'Castled! Your king is tucked away safely.', fail: 'Not quite. Tap the king, then the square two steps toward the rook.' },
  ] },
  { id: 'promotion', group: 'Special Moves', icon: 'arrowUp', title: 'Promotion', desc: 'A pawn becomes a queen', steps: [
    { type: 'text', text: 'When a pawn reaches the <b>other side</b> of the board, it gets <b>promoted</b>! It turns into a queen, rook, bishop or knight. Usually a queen!', board: '8/4P3/8/8/8/8/8/8', marks: ['e8'] },
    { type: 'goal', text: 'Push your pawn to the end and <b>promote</b> it!', fen: 'k7/4P3/8/8/8/8/8/6K1 w - - 0 1', goal: 'promote', success: 'A brand new queen!' },
    { type: 'stars', text: 'Walk your pawn all the way up. It becomes a queen at the top! Then grab the last star.', pieces: { b2: 'P' }, stars: ['b4', 'b8', 'h2'], promote: true, par: 6 },
  ] },
  { id: 'enpassant', group: 'Special Moves', icon: 'ninja', title: 'En Passant', desc: 'The sneaky pawn capture', steps: [
    { type: 'text', text: '<b>En passant</b> (say "on pah-SAHN") is a sneaky pawn rule. If an enemy pawn jumps <b>two squares</b> and lands right <b>next to</b> your pawn, you can capture it as if it had moved only one square.' },
    { type: 'text', text: 'You must do it <b>right away</b>, on your very next move, or the chance is gone!', board: '4k3/8/8/3pP3/8/8/8/4K3', marks: ['d5', 'd6'] },
    { type: 'goal', text: 'Black just moved a pawn two squares to d5. Capture it <b>en passant</b>! (Move your pawn to d6.)', fen: '4k3/8/8/3pP3/8/8/8/4K3 w - d6 0 1', goal: 'move', moves: ['e5d6'], success: 'Sneaky! The black pawn is gone.', fail: 'Try moving your e5 pawn diagonally to d6.' },
  ] },
  { id: 'draws', group: 'Winning & Drawing', icon: 'half', title: 'Stalemate & Draws', desc: 'When nobody wins', steps: [
    { type: 'text', text: '<b>Stalemate</b>: it is your turn, you are <b>not</b> in check, but you have <b>no legal moves</b>. That is a <b>draw</b> (a tie), even if you have fewer pieces!', board: '7k/5Q2/6K1/8/8/8/8/8', marks: ['h8'] },
    { type: 'text', text: 'Other draws:<br>• Both players <b>agree</b> to a draw.<br>• The same position happens <b>3 times</b>.<br>• <b>Not enough pieces</b> to checkmate (like king vs king).<br>• <b>50 moves</b> by each player with no capture or pawn move.' },
    { type: 'goal', text: 'Careful! Some queen moves cause stalemate. Find the <b>checkmate</b> instead.', fen: '7k/4Q3/6K1/8/8/8/8/8 w - - 0 1', goal: 'mate', success: 'Checkmate, not stalemate. Well done!' },
  ] },
  { id: 'tips', group: 'Winning & Drawing', icon: 'bulb', title: 'Winning Tips', desc: 'Play like a champion', steps: [
    { type: 'text', text: '<b>Start strong:</b><br>1. Move a center pawn (e or d pawn).<br>2. Bring out your <b>knights and bishops</b>.<br>3. <b>Castle</b> early to keep your king safe.<br>4. Don\'t bring your queen out too early.' },
    { type: 'text', text: 'Before <b>every</b> move, ask yourself:<br>1. What is my opponent attacking?<br>2. Can I capture something for free?<br>3. Is my piece safe on its new square?' },
    { type: 'text', text: 'You are ready! Go to the <b>Play</b> tab and challenge <b>Pip</b> the chick. Then try the <b>Puzzles</b> to get even better.' },
  ] },
];

const START_FEN = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
class Game {
  constructor(fen = START_FEN, moves = []) { this.startFen = fen; this.moves = []; this.sans = []; this.pos = new E.Position(fen); this.lastFromTo = null; for (const u of moves) this.play(u); }
  legal() { return this.pos.legalMoves(); }
  play(uci) {
    const legal = this.legal(), m = this.pos.moveFromUci(uci, legal);
    if (!m) return null;
    const san = this.pos.san(m, legal);
    const cap = !!(E.mFlags(m) & E.F_CAP);
    this.pos.make(m); this.moves.push(uci); this.sans.push(san);
    this.lastFromTo = [E.mFrom(m), E.mTo(m)];
    return { san, cap, check: this.pos.inCheck(), m };
  }
  undo() { if (!this.moves.length) return; const mv = this.moves.slice(0, -1); const g = new Game(this.startFen, mv); Object.assign(this, g); }
  status() { return this.pos.status(); }
  turn() { return this.pos.turn === 0 ? 'w' : 'b'; }
  targetsFrom(sq) {
    const p = this.pos.board[sq];
    if (!p || ((p & 8) ? 1 : 0) !== this.pos.turn) return null;
    return [...new Set(this.legal().filter(m => E.mFrom(m) === sq).map(m => E.mTo(m)))];
  }
  needsPromo(from, to) { return this.legal().some(m => E.mFrom(m) === from && E.mTo(m) === to && E.mPromo(m)); }
  boardAt(ply) {
    const g = new Game(this.startFen, this.moves.slice(0, ply));
    return { board: g.pos.board, last: g.lastFromTo, check: g.pos.inCheck() ? g.pos.kings[g.pos.turn] : -1 };
  }
  viewState() { return { board: this.pos.board, last: this.lastFromTo, check: this.pos.inCheck() ? this.pos.kings[this.pos.turn] : -1 }; }
  pgnMoves() { let s = ''; this.sans.forEach((x, i) => { if (i % 2 === 0) s += (i / 2 + 1) + '. '; s += x + ' '; }); return s.trim(); }
}
function captured(board) {
  const start = { 1: 8, 2: 2, 3: 2, 4: 2, 5: 1 }, cnt = [{}, {}];
  for (let s = 0; s < 128; s++) { if (s & 0x88) { s += 7; continue; } const p = board[s]; if (!p) continue; const c = (p & 8) ? 1 : 0, t = p & 7; cnt[c][t] = (cnt[c][t] || 0) + 1; }
  const val = { 1: 1, 2: 3, 3: 3, 4: 5, 5: 9 };
  const lost = [[], []]; let mat = [0, 0];
  for (const c of [0, 1]) for (const t of [5, 4, 3, 2, 1]) { const n = Math.max(0, start[t] - (cnt[c][t] || 0)); for (let i = 0; i < n; i++) lost[c].push(t | (c ? 8 : 0)); mat[c] += (cnt[c][t] || 0) * val[t]; }

}

let worker = null, workerReqs = {}, workerId = 0;
function initWorker() {
  try {
    const src = `${ChessEngineFactory.toString()}\n${mulberry.toString()}\n${botChooseMove.toString()}\n
      const E = ChessEngineFactory(); const S = new E.Searcher();
      self.onmessage = e => { const d = e.data; let r;
        try { const pos = new E.Position(d.fen); for (const u of d.moves) pos.make(pos.moveFromUci(u));
          if (d.kind === 'bot') r = botChooseMove(E, S, pos, d.level, mulberry(d.seed), d.salt, d.ply, d.book);
          else { const s = S.search(pos, { maxNodes: d.nodes || 150000, maxDepth: d.depth || 64 }); r = { uci: s.move ? pos.uci(s.move) : null, score: s.score }; }
        } catch (err) { r = { error: String(err) }; }
        self.postMessage(Object.assign({ id: d.id }, r)); };`;
    worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
    worker.onmessage = e => { const cb = workerReqs[e.data.id]; delete workerReqs[e.data.id]; if (cb) cb(e.data); };
    worker.onerror = () => { worker = null; };
  } catch (e) { worker = null; }
}
const mainSearcher = new E.Searcher();
function engineRequest(req) {
  return new Promise(res => {
    req.id = ++workerId;
    if (worker) { workerReqs[req.id] = res; worker.postMessage(req); return; }
    setTimeout(() => {
      const pos = new E.Position(req.fen); for (const u of req.moves) pos.make(pos.moveFromUci(u));
      if (req.kind === 'bot') res(botChooseMove(E, mainSearcher, pos, req.level, mulberry(req.seed), req.salt, req.ply, req.book));
      else { const s = mainSearcher.search(pos, { maxNodes: req.nodes || 100000 }); res({ uci: s.move ? pos.uci(s.move) : null, score: s.score }); }
    }, 30);
  });
}

// ======================= RATINGS (Glicko-2) =======================
function glicko2(pl, games) {
  const S = 173.7178, tau = 0.5;
  let mu = (pl.r - 1500) / S, phi = pl.rd / S; const sigma = pl.vol;
  const g = ph => 1 / Math.sqrt(1 + 3 * ph * ph / (Math.PI * Math.PI));
  let vInv = 0, dSum = 0;
  for (const gm of games) {
    const muj = (gm.r - 1500) / S, phj = gm.rd / S, gj = g(phj), Ej = 1 / (1 + Math.exp(-gj * (mu - muj)));
    vInv += gj * gj * Ej * (1 - Ej); dSum += gj * (gm.s - Ej);
  }
  const v = 1 / vInv, delta = v * dSum;
  const a = Math.log(sigma * sigma), eps = 1e-6;
  const f = x => { const ex = Math.exp(x); return ex * (delta * delta - phi * phi - v - ex) / (2 * Math.pow(phi * phi + v + ex, 2)) - (x - a) / (tau * tau); };
  let A = a, B;
  if (delta * delta > phi * phi + v) B = Math.log(delta * delta - phi * phi - v);
  else { let k = 1; while (f(a - k * tau) < 0) k++; B = a - k * tau; }
  let fA = f(A), fB = f(B);
  for (let i = 0; i < 60 && Math.abs(B - A) > eps; i++) {
    const C = A + (A - B) * fA / (fB - fA), fC = f(C);
    if (fC * fB <= 0) { A = B; fA = fB; } else fA /= 2;
    B = C; fB = fC;
  }
  const sig2 = Math.exp(A / 2);
  const phiStar = Math.sqrt(phi * phi + sig2 * sig2);
  const phiNew = 1 / Math.sqrt(1 / (phiStar * phiStar) + 1 / v);
  const muNew = mu + phiNew * phiNew * dSum;
  return { r: Math.max(100, Math.round((muNew * S + 1500) * 10) / 10), rd: Math.max(45, Math.min(350, phiNew * S)), vol: sig2 };
}
// ---- Bot League ladder: Elo with small K so no game moves you more than 40 (placement) / 20 points ----
const LEAGUES = [[0, 'Pawn League', 'p'], [600, 'Knight League', 'n'], [900, 'Bishop League', 'b'], [1200, 'Rook League', 'r'], [1500, 'Queen League', 'q'], [1800, 'King League', 'k']];
const PLACEMENT_GAMES = 10;
function leagueOf(r) {
  let i = 0; LEAGUES.forEach((L, j) => { if (r >= L[0]) i = j; });
  const L = LEAGUES[i], next = LEAGUES[i + 1];
  return { i, name: L[1], piece: L[2], min: L[0], next: next ? next[0] : null, nextName: next ? next[1] : null, pct: next ? Math.max(0, Math.min(1, (r - L[0]) / (next[0] - L[0]))) : 1 };
}

function eloDelta(r, opp, score, K) { const e = 1 / (1 + Math.pow(10, (opp - r) / 400)); return Math.round(K * (score - e)); }

// Glicko-2 with a hard cap on how far one result can move you
function cappedGlicko(cur, opp, score, capProv, capEst) {
  const nr = glicko2(cur, [{ r: opp.r, rd: opp.rd, s: score }]);
  const cap = cur.rd > 110 ? capProv : capEst;

}

    sparkline(profile.rHist, '#ffb547'), h('div', { class: 'small muted', style: { textAlign: 'right' } }, `${w}W · ${l}L · ${d}D`)));
  main.append(h('div', { class: 'stats' },
    h('div', { class: 'card stat' }, h('div', { class: 'l' }, icon('globe', 15), ' Online rating'), h('div', { class: 'v' }, fmtR(hu)), h('div', { class: 'l' }, (hu.games || 0) ? `${hu.games} games` + (hu.rd > 110 ? ' · provisional' : '') : 'Play online to start')),
    h('div', { class: 'card stat' }, h('div', { class: 'l' }, icon('puzzle', 15), ' Puzzle rating'), h('div', { class: 'v' }, fmtR(pr)), h('div', { class: 'l' }, `Best streak ${profile.best}`))));
  if ((hu.games || 0) > 0) main.append(h('div', { class: 'card' }, h('div', { class: 'small' }, h('b', null, 'Online rating history')), sparkline(profile.hHist, '#4fd18b')));
  main.append(h('div', { class: 'card' }, h('div', { class: 'small' }, h('b', null, 'Puzzle rating history')), sparkline(profile.pHist, '#6fb3ff')));
  if (profile.games.length) main.append(h('div', { class: 'card' }, h('b', null, 'Recent games'), h('table', { class: 'tbl' }, profile.games.slice(0, 8).map(g => h('tr', null, h('td', { class: 'res ' + (g.score === 1 ? 'w' : g.score === 0.5 ? 'd' : 'l') }, g.score === 1 ? 'Win' : g.score === 0.5 ? 'Draw' : 'Loss'), h('td', null, 'vs ' + g.opp, h('div', { class: 'small muted' }, g.reason)), h('td', null, g.rated ? (g.after - g.before >= 0 ? '+' : '') + (g.after - g.before) : 'casual'))))));
  main.append(h('div', { class: 'card stack' },
    h('h3', null, 'How ratings work'),
    h('p', { class: 'small muted', style: { margin: 0 } }, h('b', null, 'You have three separate ratings. '), 'Bots, people and puzzles are different skills, so each one is tracked on its own.'),
    h('p', { class: 'small muted', style: { margin: 0 } }, h('b', null, 'Bot League: '), `climb from the Pawn League to the King League by beating bots. It uses the Elo system with strict limits: one game moves you at most ${40} points during your first ${PLACEMENT_GAMES} placement games, then at most 20. Beating a bot far below your level earns almost nothing, so climbing takes real wins against strong bots.`),
    h('table', { class: 'tbl' }, LEAGUES.map((x, i) => h('tr', null, h('td', null, h('img', { src: PIECE_URL['w' + x[2]], style: { width: '18px', verticalAlign: '-3px' } }), ' ' + x[1]), h('td', null, i < LEAGUES.length - 1 ? `${x[0]}–${LEAGUES[i + 1][0] - 1}` : `${x[0]}+`)))),
    h('p', { class: 'small muted', style: { margin: 0 } }, `The bots' ratings were measured, not guessed: they played ${CALIB.games} games against each other, and their ratings were fitted from the results. These numbers compare fairly inside Knight Club, but they're estimates, not official FIDE or chess.com ratings.`),
    h('table', { class: 'tbl' }, BOTS.map(bt => h('tr', null, h('td', null, bt.avatar + ' ' + bt.name), h('td', null, bt.rating)))),
    h('p', { class: 'small muted', style: { margin: 0 } }, h('b', null, 'Online rating: '), 'for games against real people. It uses Glicko-2, a system many chess sites use, and moves at most 50 points per game while it is provisional ("?"), then at most 30. Games shorter than 4 moves are not rated.'),
    h('p', { class: 'small muted', style: { margin: 0 } }, h('b', null, 'Puzzle rating: '), "also Glicko-2, moving at most 30 points per puzzle while provisional, then 15. Only your first try at each puzzle counts. Each puzzle's difficulty is estimated from how long the engine has to search to find the answer and how many tempting wrong moves there are.")));
  main.append(h('div', { class: 'card row' }, h('div', { class: 'grow' }, h('b', null, 'Sound effects')), h('button', { class: 'btn sm', onclick: () => { soundOn = !soundOn; profile.sound = soundOn; saveProfile(); render(); } }, icon(soundOn ? 'soundOn' : 'soundOff', 18), soundOn ? 'On' : 'Off')));
  main.append(h('button', { class: 'btn ghost block small', onclick: () => confirmBox('Reset everything?', 'This erases your ratings, games, puzzles and lessons.', 'Reset', () => { profile = DEFAULT_PROFILE(); saveProfile(); render(); }) }, 'Reset progress'));
  main.append(h('p', { class: 'small muted center' }, 'Your progress is saved in this browser on this device.'));
}

// older saves had one Glicko "rating" for bots; move it onto the new ladder
function migrate(p) {
  if (!p.v || p.v < 2) {
    if (p.rating) p.ladder = { r: Math.max(100, Math.min(3000, Math.round(p.rating.r))), games: p.games.filter(g => g.rated).length, peak: Math.round(p.rating.r) };
    delete p.rating;
    p.puzzle.rd = Math.min(p.puzzle.rd, 200); p.puzzle.games = p.puzzle.games || 0;
    p.v = 2;
  }
  p.human = p.human || { r: 800, rd: 250, vol: 0.06, games: 0 }; p.hHist = p.hHist || [800]; p.rated = p.rated || {};
  return p;
}

// ======================= BOOT =======================
function boot() {
  const saved = loadLocal();
  if (saved) { const wasOld = !saved.v; profile = Object.assign(DEFAULT_PROFILE(), saved); if (wasOld) profile.v = 1; profile = migrate(profile); }
  soundOn = profile.sound !== false;
  buildTabs();
  const hr = (location.hash || '').slice(1); if (ROUTES[hr]) route = hr;
  window.addEventListener('hashchange', () => { const hs = location.hash; const jm = hs.match(/^#join=(.+)$/); if (jm) { pendingJoin = jm[1]; friendView = 'online'; leaveOnline(); go('friend'); return; } const r = hs.slice(1); if (ROUTES[r] && r !== route) go(r); });
  initWorker();
  const jm = (location.hash || '').match(/^#join=(.+)$/);
  if (jm) { pendingJoin = jm[1]; route = 'friend'; friendView = 'online'; try { history.replaceState(null, '', '#friend'); } catch (e) { } }
  render();
}

;
// Start the app after every module has loaded.
boot();
</script>
