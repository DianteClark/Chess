.me-name-btn .nm{font-family:var(--display);font-size:27px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.me-name-btn .nm.ph{color:var(--muted);font-size:22px}
.me-name-btn .icn{color:var(--brass-light);opacity:.75}
.me-name-inp{width:100%;font-family:var(--display);font-size:22px;color:var(--ivory);background:rgba(0,0,0,.3);border:2px solid var(--brass);border-radius:12px;padding:2px 10px;outline:none;min-height:36px}
.me-title-row{display:flex;align-items:center;gap:8px;min-width:0}
.me-title{position:relative;flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--display);font-size:14px;letter-spacing:.3px;color:#fff1d6;
  padding:3px 13px 4px;background:linear-gradient(180deg,#c4533a,#8f2f1f);clip-path:polygon(0 0,100% 0,calc(100% - 7px) 50%,100% 100%,0 100%,7px 50%);text-shadow:0 1px 0 rgba(0,0,0,.3)}
.me-show{display:flex;gap:3px;flex:none;padding:2px}
.me-mini{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.me-mini.t1{background:radial-gradient(circle at 35% 30%,#f6cfa8,#b8743f 60%,#8a5228);color:#3a1d07}
.me-mini.t2{background:radial-gradient(circle at 35% 30%,#fff,#b8c3d2 60%,#8592a6);color:#26303f}
.me-mini.t3{background:radial-gradient(circle at 35% 30%,#fff1c2,var(--brass) 55%,#c88c26);color:#3e2a00}
.me-lvl{display:flex;align-items:center;gap:8px}
.me-lvl-badge{flex:none;width:34px;height:36px;display:grid;place-items:center;color:#3a2408;
  background:radial-gradient(circle at 35% 25%,#fff1c2,var(--brass) 55%,#c88c26);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);filter:drop-shadow(0 2px 0 var(--brass-dark))}
.me-lvl-badge b{font-family:var(--display);font-weight:400;font-size:18px;line-height:1}
.me-xpbar{height:10px;border-radius:6px;background:rgba(0,0,0,.35);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.me-xpbar div{height:100%;border-radius:6px;background:linear-gradient(180deg,var(--brass-light),var(--brass) 60%,#d99b2b);transition:width .8s cubic-bezier(.3,.9,.3,1)}
.me-xptxt{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* rating tiles */
.me-rts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:12px}
.me-rt{position:relative;display:flex;flex-direction:column;align-items:stretch;text-align:left;padding:8px 9px 0;border-radius:15px;overflow:hidden;min-height:96px;
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(0,0,0,.12)),rgba(0,0,0,.22);box-shadow:inset 0 0 0 1px var(--felt-line),0 3px 0 rgba(0,0,0,.25);transition:transform .1s}
.me-rt:active{transform:translateY(2px)}
.me-rt-h{display:flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--muted);white-space:nowrap;min-width:0}
.me-rt-h span{overflow:hidden;text-overflow:ellipsis}
.me-rt-h img{width:16px;height:16px;flex:none}
.me-rt.rb .me-rt-h .icn,.me-rt.rb .me-rt-h{color:#ffd68f}
.me-rt.ro .me-rt-h{color:#b8ecb9} .me-rt.rp .me-rt-h{color:#bfe0ff}
.me-rt-v{display:flex;align-items:baseline;gap:4px;margin-top:2px;min-width:0}
.me-rt-v b{font-family:var(--display);font-weight:400;font-size:25px;line-height:1.05;letter-spacing:.3px}
.me-delta{font-size:11px;font-weight:700;white-space:nowrap}
.me-delta.up{color:var(--good)} .me-delta.dn{color:var(--bad)}
.me-rt small{font-size:11.5px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-spark{position:relative;height:26px;margin:4px -9px 0}
.me-spark svg{display:block;width:100%;height:100%}
.me-spark i{position:absolute;width:7px;height:7px;margin:-3.5px 0 0 -5px;border-radius:50%;box-shadow:0 0 0 2px rgba(0,0,0,.25),0 0 8px currentColor}

/* ---------- section tabs ---------- */
.me-tabs{position:sticky;top:var(--top,0px);z-index:12;display:grid;grid-template-columns:repeat(4,1fr);padding:4px;border-radius:18px;
  background:rgba(13,36,27,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px var(--felt-line),0 6px 14px -6px rgba(0,0,0,.5)}
.me-tabs button{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:50px;padding:4px 2px;border-radius:14px;
  color:var(--muted);font-size:12px;font-weight:700;transition:color .2s}
.me-tabs button span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-tabs button .icn{transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.me-tabs button.on{color:var(--ink)}
.me-tabs button.on .icn{transform:scale(1.12)}
.me-tabs button:active .icn{transform:scale(.88)}
.me-tab-ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px) / 4);border-radius:14px;transform:translateX(calc(var(--i,0) * 100%));
  background:linear-gradient(180deg,#fff6de,var(--ivory) 50%,#ecd9b0);box-shadow:0 3px 0 #b99a5e,0 0 16px rgba(255,214,120,.25);transition:transform .38s cubic-bezier(.3,1.25,.5,1)}
html[dir=rtl] .me-tab-ind{left:auto;right:4px;transform:translateX(calc(var(--i,0) * -100%))}
.me-panel{min-height:200px}
.me-panel.in-r{animation:meInR .3s cubic-bezier(.2,.8,.3,1)}
.me-panel.in-l{animation:meInL .3s cubic-bezier(.2,.8,.3,1)}
@keyframes meInR{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes meInL{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
@keyframes mePop{0%{transform:scale(1)}35%{transform:scale(1.14)}65%{transform:scale(.96)}100%{transform:scale(1)}}
.me-panel>*+*{margin-top:10px}

/* ---------- trophy cabinet ---------- */
.tc>*+*{margin-top:9px}
.tc-sum{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:18px;background:rgba(0,0,0,.2);box-shadow:inset 0 0 0 1px var(--felt-line)}
.tc-count{display:flex;align-items:baseline;gap:3px;flex:none}
.tc-count b{font-family:var(--display);font-weight:400;font-size:34px;line-height:1;color:var(--brass-light);text-shadow:0 2px 0 rgba(0,0,0,.3)}
.tc-count span{color:var(--muted);font-weight:700;font-size:15px}
.tc-lbl{font-size:12.5px;font-weight:700;color:var(--muted)}
.tc-tiers{display:flex;flex-direction:column;gap:2px;flex:none}
.tc-coin{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;line-height:1.1}
.tc-coin i{width:11px;height:11px;border-radius:50%}
.tc-coin.t3 i{background:radial-gradient(circle at 35% 30%,#fff1c2,var(--brass) 55%,#c88c26)}
.tc-coin.t2 i{background:radial-gradient(circle at 35% 30%,#fff,#b8c3d2 60%,#8592a6)}
.tc-coin.t1 i{background:radial-gradient(circle at 35% 30%,#f6cfa8,#b8743f 60%,#8a5228)}
.tc-next{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;border-radius:16px;text-align:left;
  background:linear-gradient(90deg,rgba(239,187,79,.2),rgba(239,187,79,.05));box-shadow:inset 0 0 0 1px rgba(239,187,79,.35),0 3px 0 rgba(0,0,0,.2);transition:transform .1s}
.tc-next:active{transform:translateY(2px)}
.tc-next .tc-medal{transform:scale(.8);margin:-6px -4px}
.tc-next small{display:block;font-size:11.5px;font-weight:700;color:var(--brass-light);text-transform:uppercase;letter-spacing:.6px}
.tc-next b{display:block;font-size:15px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-nnum{font-family:var(--display);font-size:16px;color:var(--ivory);flex:none}
.tc-cab{position:relative;padding:10px 9px 9px;border-radius:22px;
  background:var(--grain),linear-gradient(180deg,#8c5733,var(--wood) 40%,#5e3720);box-shadow:inset 0 2px 0 rgba(255,220,160,.35),0 4px 0 #3a2010,0 12px 24px rgba(0,0,0,.35)}
.tc-shelves{position:relative;margin:0;gap:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));grid-auto-rows:86px;padding:0 6px;border-radius:13px;overflow:hidden;
  background:repeating-linear-gradient(180deg,transparent 0 72px,#c48a55 72px 74px,#8a5532 74px 80px,#4a2a16 80px 82px,rgba(0,0,0,.35) 82px 86px),
    radial-gradient(130% 70% at 50% 0%,#1d4a39,#0d261c 70%);box-shadow:inset 0 8px 16px rgba(0,0,0,.55),inset 0 0 0 2px #3a2010}
.tc-shelves::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.07) 0 18%,transparent 18% 30%,rgba(255,255,255,.04) 30% 36%,transparent 36%)}
.tc-slot{display:flex;align-items:flex-end;justify-content:center;padding:0 0 13px;border-radius:12px;transition:transform .12s}
.tc-slot:active{transform:scale(.9)}
.tc-medal{position:relative;display:flex;flex-direction:column;align-items:center;width:46px;filter:drop-shadow(0 4px 3px rgba(0,0,0,.5))}
.tc-rib{display:block;width:20px;height:17px;margin-bottom:-5px;clip-path:polygon(0 0,100% 0,100% 100%,50% 72%,0 100%);background:#2c4a3d}
.tc-medal.t1.got .tc-rib{background:linear-gradient(90deg,#b8452f 0 38%,#f0d39a 38% 62%,#b8452f 62%)}
.tc-medal.t2.got .tc-rib{background:linear-gradient(90deg,#3d6fb3 0 38%,#eef3fb 38% 62%,#3d6fb3 62%)}
.tc-medal.t3.got .tc-rib{background:linear-gradient(90deg,#8a1f2e 0 30%,#ffd76a 30% 70%,#8a1f2e 70%)}
.tc-disc{position:relative;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;overflow:hidden;
  background:#1a382c;color:rgba(247,239,221,.24);box-shadow:inset 0 2px 5px rgba(0,0,0,.55),0 0 0 1px rgba(247,239,221,.06)}
.tc-medal.prog .tc-disc{background:radial-gradient(closest-side,#1a382c 79%,transparent 81% 100%),conic-gradient(var(--brass) calc(var(--p,0) * 1%),rgba(0,0,0,.4) 0)}
.tc-medal.got .tc-disc{color:#3a1d07;box-shadow:inset 0 0 0 3px rgba(255,255,255,.3),inset 0 -3px 0 rgba(0,0,0,.18),0 2px 0 rgba(0,0,0,.35)}
.tc-medal.t1.got .tc-disc{background:radial-gradient(circle at 35% 30%,#f9dcbc,#c07d45 58%,#8a5228)}
.tc-medal.t2.got .tc-disc{background:radial-gradient(circle at 35% 30%,#ffffff,#bcc6d4 58%,#8592a6);color:#26303f}
.tc-medal.t3.got .tc-disc{background:radial-gradient(circle at 35% 30%,#fff4cc,var(--brass) 55%,#c88c26);color:#3e2a00}
.tc-medal.got .tc-disc::after{content:'';position:absolute;inset:-30%;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.85) 50%,transparent 58%);transform:translateX(-110%);animation:tcGlint 1s ease-out var(--d,0s) 1 both}
@keyframes tcGlint{to{transform:translateX(110%)}}
.tc-medal.big{width:110px;filter:drop-shadow(0 8px 6px rgba(0,0,0,.45))}
.tc-medal.big .tc-rib{width:46px;height:40px;margin-bottom:-12px}
.tc-medal.big .tc-disc{width:100px;height:100px;box-shadow:inset 0 0 0 6px rgba(255,255,255,.3),inset 0 -6px 0 rgba(0,0,0,.18),0 4px 0 rgba(0,0,0,.35)}
.tc-medal.big:not(.got) .tc-disc{box-shadow:inset 0 3px 8px rgba(0,0,0,.55)}
.tc-medal.big.prog .tc-disc{background:radial-gradient(closest-side,#1a382c 86%,transparent 88% 100%),conic-gradient(var(--brass) calc(var(--p,0) * 1%),rgba(0,0,0,.4) 0)}
.tc-sheet{position:relative;display:grid;place-items:center;height:150px;margin-top:4px}
.tc-sheet .tc-medal{animation:badgeIn .55s cubic-bezier(.2,1.5,.4,1)}
.tc-rays{position:absolute;width:220px;height:220px;border-radius:50%;opacity:0;
  background:repeating-conic-gradient(rgba(255,226,140,.28) 0 10deg,transparent 10deg 24deg);-webkit-mask:radial-gradient(closest-side,#000 30%,transparent);mask:radial-gradient(closest-side,#000 30%,transparent)}
.tc-sheet.got .tc-rays{opacity:1;animation:tcSpin 14s linear infinite}
@keyframes tcSpin{to{transform:rotate(360deg)}}
.tc-tier{display:inline-block;padding:3px 12px;border-radius:999px;font-size:12.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.tc-tier.t1{background:rgba(192,125,69,.25);color:#f6cfa8} .tc-tier.t2{background:rgba(188,198,212,.2);color:#e6ecf5} .tc-tier.t3{background:rgba(239,187,79,.22);color:var(--brass-light)}
.tc-earned{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--good);font-weight:700}
.tc-progress{max-width:260px;margin:0 auto}
.tc-progress .qbar{height:10px;border-radius:6px}
.tc-progress .small{margin-top:5px;font-weight:700}
.tc-unlocks{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.tc-unl{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:14px;background:rgba(0,0,0,.2)}
.tc-unl small{display:block;color:var(--muted);font-size:12px;font-weight:700}
.tc-unl .swatch,.tc-unl .pset{flex:none;width:44px;height:44px}
.tc-unl .pset img{width:22px;height:22px}

/* ---------- Style ---------- */
.sty-stage{display:flex;align-items:center;gap:14px;padding:12px;border-radius:20px;background:rgba(0,0,0,.2);box-shadow:inset 0 0 0 1px var(--felt-line)}
.sty-board{flex:0 0 min(54%,230px)}
.sty-board .board-wrap{width:calc(100% - 14px);margin:7px;pointer-events:none}
.sty-board .board-wrap::before{inset:-7px}
.sty-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;align-self:stretch;justify-content:center}
.sty-info .grow{display:flex;flex-direction:column;gap:2px}
.sty-ii{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--ivory);color:var(--ink);box-shadow:0 2px 0 #b99a5e}
.sty-info.ok .sty-ii{background:var(--good);color:#0f3315;box-shadow:0 2px 0 #4c9152;animation:mePop .45s cubic-bezier(.2,1.6,.4,1)}
.sty-info.locked .sty-ii{background:rgba(0,0,0,.35);color:var(--brass-light);box-shadow:none}
.sty-info small{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.sty-info b{font-family:var(--display);font-weight:400;font-size:19px;line-height:1.15;display:flex;flex-direction:column}
.sty-look{display:flex;flex-direction:column;gap:5px;margin:0;padding:0;list-style:none}
.sty-look li{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;min-width:0}
.sty-look li .icn{color:var(--brass-light);flex:none}
.sty-look li span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sty-req{font-size:13px;color:var(--muted);line-height:1.3;display:flex;flex-wrap:wrap;gap:0 6px}
.sty-req span{color:var(--brass-light);font-weight:700}
.sty-info .qbar{height:8px}
.sty-sec{margin-top:12px}
.sty-head{display:flex;align-items:center;justify-content:space-between;margin:0 2px 6px}
.sty-head h3{font-size:18px;color:var(--brass-light)}
.sty-row{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;scroll-padding:0 16px;margin:-5px -16px 0;padding:9px 16px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.sty-row::-webkit-scrollbar{display:none}
.sty-item{position:relative;flex:0 0 92px;width:92px;min-width:0;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 5px 8px;border-radius:16px;text-align:center;
  background:var(--felt-3);border:2px solid var(--felt-line);box-shadow:0 3px 0 rgba(0,0,0,.25);transition:transform .1s,border-color .2s}
.sty-item:active{transform:translateY(2px) scale(.97)}
.sty-art{position:relative;width:58px;height:58px;display:grid;place-items:center}
.sty-art .swatch{width:54px;height:54px;border-radius:11px}
.sty-art .pset{height:54px;padding:0 2px}
.sty-art .pset img{width:27px;height:27px}
.sty-art .av-img{border-radius:50%;box-shadow:0 0 0 2px rgba(0,0,0,.3)}
.sty-snd svg{width:50px;height:50px;display:block}
.sty-item b{font-size:12.5px;line-height:1.2;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sty-item small{font-size:10.5px;color:var(--muted);font-weight:700;line-height:1.2;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sty-item small:empty{display:none}
.sty-item .qbar{width:80%;height:5px;margin-top:2px}
.sty-item.locked .sty-art>:first-child{filter:grayscale(.55) brightness(.62)}
.sty-item.locked b{color:var(--muted)}
.sty-art .lock{position:absolute;right:-4px;bottom:-3px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#16362a;color:var(--brass-light);box-shadow:0 0 0 2px var(--felt-3)}
.sty-on{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--brass);color:var(--ink);box-shadow:0 2px 0 var(--brass-dark);transform:scale(0);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.sty-item.on{border-color:var(--brass);background:linear-gradient(180deg,rgba(239,187,79,.16),rgba(239,187,79,.04)),var(--felt-3);box-shadow:0 3px 0 rgba(0,0,0,.25),0 0 0 3px rgba(239,187,79,.22)}
.sty-item.on .sty-on{transform:scale(1)}
.sty-item.peek{border-color:var(--brass-light);border-style:dashed}
.sty-item.pop{animation:mePop .45s cubic-bezier(.2,1.6,.4,1)}

/* ---------- avatar + rating sheets ---------- */
.me-avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.me-avc{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 8px;border-radius:16px;background:rgba(0,0,0,.2);border:2px solid transparent;transition:transform .1s}
.me-avc:active{transform:scale(.95)}
.me-avc.on{border-color:var(--brass);background:rgba(239,187,79,.12)}
.me-avc b{font-size:13px}
.me-avc small{font-size:11px;color:var(--muted);font-weight:700;line-height:1.15;text-align:center}
.me-avc.locked img{filter:grayscale(.7) brightness(.55)}
.me-avc .lock{position:absolute;top:8px;right:12px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#16362a;color:var(--brass-light)}
.me-sh-head{display:flex;align-items:center;gap:12px;margin-top:6px}
.me-sh-head small{color:var(--muted);font-weight:700;font-size:13px}
.me-sh-head h2{font-size:24px;margin:0}
.me-sh-piece{width:58px;height:58px;padding:5px;border-radius:16px;background:var(--light);box-shadow:0 3px 0 #b9935f;flex:none}
.me-sh-ic{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;flex:none;background:rgba(147,220,152,.2);color:var(--good)}
.me-sh-ic.puz{background:rgba(156,207,255,.18);color:var(--blue)}
.me-sh-r{font-family:var(--display);font-weight:400;font-size:36px;line-height:1}
.me-sh-bar{height:10px;border-radius:6px;margin-top:12px}
.me-sh-graph{margin:10px 0 4px;padding:8px 6px 4px;border-radius:14px;background:rgba(0,0,0,.2)}
.me-sh-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(60px,1fr));gap:6px;margin-top:10px}
.me-sh-stats>div{display:flex;flex-direction:column;align-items:center;padding:8px 4px;border-radius:12px;background:rgba(0,0,0,.2)}
.me-sh-stats b{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.1}
.me-sh-stats small{font-size:11.5px;color:var(--muted);font-weight:700}
.me-leagues{display:flex;justify-content:space-between;gap:4px;margin:0 0 14px;padding:8px;border-radius:14px;background:rgba(0,0,0,.2)}
.me-lg{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;opacity:.4}
.me-lg img{width:30px;height:30px}
.me-lg small{font-size:11px;font-weight:700;color:var(--muted)}
.me-lg.past{opacity:.75}
.me-lg.on{opacity:1}
.me-lg.on img{background:var(--light);border-radius:10px;box-shadow:0 0 0 2px var(--brass),0 0 12px rgba(255,214,120,.5)}
.me-help p{margin:0}

/* ---------- settings ---------- */
.me-group h3{font-size:16px;color:var(--brass-light);margin:4px 4px 6px}
.me-group+.me-group{margin-top:14px}
.me-group-box{border-radius:18px;overflow:hidden;background:var(--felt-3);box-shadow:inset 0 0 0 1px var(--felt-line),0 4px 10px rgba(0,0,0,.15)}
.me-set{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:9px 14px;text-align:left;color:var(--text)}
.me-set+.me-set{border-top:1px solid var(--felt-line)}
button.me-set:active{background:rgba(0,0,0,.12)}
.me-set b{display:block;font-size:15px;line-height:1.2}
.me-set small{display:block;font-size:12.5px;color:var(--muted);line-height:1.25}
.me-set-ic{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:rgba(0,0,0,.24);color:var(--brass-light)}
.me-set.danger b,.me-set.danger .me-set-ic{color:var(--bad)}
.me-set.slide .grow{flex:0 1 auto;min-width:72px}
.me-set.slide .me-range{flex:1;min-width:0}
.me-set.slide.off{opacity:.5}
.me-set.sub{min-height:50px;padding-left:60px;border-top:0}
.me-set.sub .seg button{min-height:40px}
.me-sw{position:relative;flex:none;width:52px;height:32px;border-radius:999px;background:rgba(0,0,0,.4);box-shadow:inset 0 2px 4px rgba(0,0,0,.4);transition:background .2s}
.me-sw i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#d9cfb8;box-shadow:0 2px 0 rgba(0,0,0,.3);transition:transform .25s cubic-bezier(.3,1.5,.5,1),background .2s}
.me-sw.on{background:linear-gradient(180deg,#a7e6a9,var(--good))}
.me-sw.on i{transform:translateX(20px);background:#fff}
html[dir=rtl] .me-sw.on i{transform:translateX(-20px)}
html[dir=rtl] .me-sw i{left:auto;right:3px}
.me-range{-webkit-appearance:none;appearance:none;height:8px;border-radius:5px;outline:none;background:linear-gradient(90deg,var(--brass) var(--v,50%),rgba(0,0,0,.4) var(--v,50%));margin:0}
.me-range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:26px;height:26px;border-radius:50%;background:var(--ivory);border:0;box-shadow:0 2px 0 #b99a5e,0 3px 8px rgba(0,0,0,.35)}
.me-range::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--ivory);border:0;box-shadow:0 2px 0 #b99a5e}
.me-range:disabled{opacity:.5}
.me-lang{flex:0 1 150px;min-width:0}
.me-lang select{width:100%;padding:9px 10px}
.me-chev{color:var(--muted);flex:none}
.me-inst{pointer-events:none;flex:none}
.me-foot{margin:16px 0 0;line-height:1.6}

/* ---------- Stats ---------- */
.ins-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.ins-kpi{display:flex;flex-direction:column;align-items:center;gap:1px;padding:9px 4px 8px;border-radius:15px;background:rgba(0,0,0,.2);box-shadow:inset 0 0 0 1px var(--felt-line)}
.ins-kpi-ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(247,239,221,.12);color:var(--ivory);margin-bottom:2px}
.ins-kpi.gold .ins-kpi-ic{background:rgba(239,187,79,.22);color:var(--brass-light)}
.ins-kpi.green .ins-kpi-ic{background:rgba(147,220,152,.2);color:var(--good)}
.ins-kpi.blue .ins-kpi-ic{background:rgba(156,207,255,.18);color:var(--blue)}
.ins-kpi b{font-family:var(--display);font-weight:400;font-size:21px;line-height:1.1}
.ins-kpi small{font-size:11.5px;color:var(--muted);font-weight:700;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ins-empty{display:flex;gap:12px;align-items:center}
.ins-empty p{margin:2px 0 0}
.ins-card{padding:12px 13px}
.ins-card>*+*{margin-top:8px}
.ins-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ins-h>b{font-size:15.5px}
.ins-h .pill{font-size:12px}
.ins-q{gap:6px}
.ins-q .q{padding:7px 4px}
.ins-sides{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ins-side{display:flex;flex-direction:column;gap:3px;padding:10px;border-radius:14px;background:rgba(0,0,0,.2)}
.ins-side-h{display:flex;align-items:center;gap:6px}
.ins-side-h small{font-weight:700;color:var(--muted);font-size:13px}
.ins-king{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--light)}
.ins-side.b .ins-king{background:var(--dark)}
.ins-side>b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1}
.ins-wdl{display:flex;gap:2px;height:8px;border-radius:5px;overflow:hidden}
.ins-wdl i{flex-basis:0;height:100%}
.ins-wdl i.w{background:var(--good)} .ins-wdl i.d{background:#c9c2b0} .ins-wdl i.l{background:var(--bad)} .ins-wdl i.none{flex-grow:1;background:rgba(0,0,0,.3)}
.ins-wdl-t{font-size:12px;color:var(--muted);font-weight:700}
.ins-games{margin:4px -6px 0}
.ins-g{display:flex;align-items:center;gap:9px;width:100%;min-height:52px;padding:7px 6px;text-align:left;border-radius:12px;color:var(--text)}
.ins-g+.ins-g{border-top:1px solid var(--felt-line)}
.ins-g.tap:active{background:rgba(0,0,0,.15)}
.ins-res{flex:none;min-width:46px;padding:5px 6px;border-radius:9px;text-align:center;font-size:12px;font-weight:700;letter-spacing:.3px}
.ins-res.w{background:rgba(147,220,152,.2);color:var(--good)} .ins-res.l{background:rgba(255,138,120,.18);color:var(--bad)} .ins-res.d{background:rgba(201,194,176,.18);color:#e3dccb}
.ins-opp{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.ins-opp .av-img{flex:none;border-radius:50%}
.ins-oic{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.25);color:var(--muted)}
.ins-opp b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ins-opp small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ins-acc{flex:none;font-size:11.5px;font-weight:700;padding:3px 7px;border-radius:999px;background:rgba(147,220,152,.14);color:var(--good)}
.ins-dr{flex:none;font-family:var(--display);font-size:15px;min-width:34px;text-align:right;color:var(--muted)}
.ins-dr:not(.up):not(.dn){font-family:var(--body);font-size:12px;font-weight:700}
.ins-dr.up{color:var(--good)} .ins-dr.dn{color:var(--bad)}
.ins-go{flex:none;color:var(--muted);margin-left:-4px}

@media (max-width:370px){
  .me-av{width:74px;height:74px;padding:3px}
  .me-av img{width:68px;height:68px}
  .me-name-btn .nm{font-size:24px}
  .me-rt{padding:7px 7px 0}
  .me-rt-h,.me-rt small{font-size:10.5px}
  .me-rt-h{gap:3px}
  .me-rt-v b{font-size:22px}
  .me-spark{margin:4px -7px 0}
  .sty-board{flex-basis:52%}
  .ins-kpi b{font-size:19px}
}
@media (prefers-reduced-motion:reduce){
  .tc-sheet.got .tc-rays{animation:none}
  .tc-medal.got .tc-disc::after{display:none}
  .me-tab-ind{transition:none}
}
.no-anim .tc-medal.got .tc-disc::after,.no-anim .tc-sheet.got .tc-rays{animation:none;display:none}

/* 60-home.css */
/* ---------- Clubhouse (home screen): src/home.js, src/daily.js, room art in src/art.js ---------- */
.home{display:flex;flex-direction:column;gap:10px;margin-top:-2px}
.home button{font:inherit;color:inherit;text-align:left}

/* plaque */
.hm-plaque{display:flex;align-items:center;gap:11px;width:100%;padding:7px 12px 7px 8px;border-radius:20px;min-height:72px;
  background:var(--grain,none),linear-gradient(180deg,#8a5532,#6a3d22);box-shadow:0 3px 0 #3a2010,0 1px 0 rgba(255,220,160,.35) inset,0 8px 16px rgba(0,0,0,.22);transition:transform .1s}
.hm-plaque:active{transform:translateY(2px)}
.hm-ring{position:relative;width:58px;height:58px;flex:none;color:var(--brass-light)}
.hm-ring>span:first-child{position:absolute;inset:0}
.hm-ring svg{display:block}
.hm-ring img{position:absolute;inset:7px;width:44px;height:44px;border-radius:50%;background:#2d5a47}
.hm-lv{position:absolute;right:-5px;bottom:-3px;min-width:23px;height:23px;padding:0 5px;border-radius:12px;display:grid;place-items:center;box-sizing:border-box;
  background:linear-gradient(180deg,#ffe39a,var(--brass));color:#3a2408;font-family:var(--display);font-size:14px;line-height:1;box-shadow:0 2px 0 #7a4f12,0 0 0 2px #6a3d22}
.hm-who{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.hm-who>b{font-family:var(--display);font-weight:400;font-size:21px;line-height:1.05;color:var(--ivory);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hm-who>small{font-size:12.5px;font-weight:700;color:#f3dcc0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hm-xp{position:relative;height:15px;border-radius:8px;background:rgba(0,0,0,.35);overflow:hidden;margin-top:3px}
.hm-xp i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:linear-gradient(90deg,var(--brass),var(--brass-light))}
.hm-xp span{position:relative;display:block;text-align:center;font-size:10.5px;font-weight:700;line-height:15px;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.6)}
.hm-league{flex:none;display:flex;align-items:center;gap:4px;padding:5px 8px 5px 5px;border-radius:14px;background:rgba(0,0,0,.24);box-shadow:0 1px 0 rgba(255,220,160,.2)}
.hm-league img{width:30px;height:30px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.hm-league div{display:flex;flex-direction:column;align-items:center}
.hm-league b{font-family:var(--display);font-weight:400;font-size:18px;line-height:1;color:var(--ivory)}
.hm-league small{font-size:10.5px;font-weight:700;color:#f3dcc0}

/* hero: continue */
.hm-hero{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;width:100%;min-height:96px;padding:10px 12px 10px 10px;border-radius:22px;
  background:radial-gradient(120% 140% at 0% 0%,rgba(255,255,255,.16),transparent 55%),linear-gradient(135deg,#b23a4c,#6c1f33);
  box-shadow:0 5px 0 #43121f,inset 0 0 0 2px rgba(239,187,79,.6),0 12px 20px rgba(0,0,0,.28);transition:transform .1s,box-shadow .1s}
.hm-hero.lesson{background:radial-gradient(120% 140% at 0% 0%,rgba(255,255,255,.16),transparent 55%),linear-gradient(135deg,#4a3b8c,#271d57);box-shadow:0 5px 0 #160f36,inset 0 0 0 2px rgba(239,187,79,.6),0 12px 20px rgba(0,0,0,.28)}
.hm-hero.resume{background:radial-gradient(120% 140% at 0% 0%,rgba(255,255,255,.16),transparent 55%),linear-gradient(135deg,#2f8a66,#165040);box-shadow:0 5px 0 #0b2e24,inset 0 0 0 2px rgba(239,187,79,.7),0 12px 20px rgba(0,0,0,.28)}
.hm-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.14) 50%,transparent 60%);transform:translateX(-100%);animation:hmSheen 6s ease-in-out 1.2s infinite;pointer-events:none}
.hm-hero:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.4),inset 0 0 0 2px rgba(239,187,79,.6)}
.hm-hero-art{flex:none;width:72px;height:72px;display:grid;place-items:center}
.hm-av{position:relative;border-radius:50%;padding:3px;background:conic-gradient(from 200deg,#ffe39a,#b88021,#ffe39a,#b88021,#ffe39a);box-shadow:0 4px 0 rgba(0,0,0,.3)}
.hm-av .av-img,.hm-av .avatar{border-radius:50%;display:block}
.hm-live{position:absolute;right:2px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px #165040;animation:hmLive 1.4s ease-in-out infinite alternate}
.hm-lesson-art{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,rgba(255,231,166,.35),rgba(255,231,166,0) 70%)}
.hm-hero-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.hm-hero-txt small{font-size:11.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--brass-light);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hm-hero-txt b{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.05;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hm-hero-txt span{font-size:13px;font-weight:700;color:rgba(255,255,255,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hm-go{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;width:62px;height:62px;border-radius:50%;
  background:linear-gradient(180deg,#ffe08e,var(--brass) 55%,#e2a43a);color:#3a2408;box-shadow:0 4px 0 var(--brass-dark),0 2px 0 rgba(255,255,255,.55) inset,0 8px 14px rgba(0,0,0,.3);animation:hmBreathe 2.4s ease-in-out infinite}
.hm-go span{font-family:var(--display);font-size:12px;line-height:1;letter-spacing:.3px}
.hm-go svg{margin-left:2px}

/* daily row */
.hm-daily{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hm-tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1px;min-height:98px;padding:8px 4px 7px;border-radius:18px;text-align:center!important;
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,0) 45%),var(--felt-3);border:1px solid var(--felt-line,rgba(247,239,221,.12));box-shadow:0 4px 0 rgba(0,0,0,.28);transition:transform .1s,box-shadow .1s}
.hm-tile:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.hm-tile>b{font-family:var(--display);font-weight:400;font-size:15.5px;line-height:1.1;margin-top:3px;white-space:nowrap}
.hm-tile>small{font-size:11.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.hm-tart{position:relative;width:48px;height:46px;display:grid;place-items:center}
.hm-cal{width:42px;height:44px;border-radius:9px;overflow:hidden;background:var(--paper);box-shadow:0 3px 0 #b9a47c;display:flex;flex-direction:column;color:var(--ink)}
.hm-cal small{display:block;background:#c4485a;color:#fff;font-size:10px;font-weight:700;line-height:14px;text-transform:uppercase}
.hm-cal b{font-family:var(--display);font-weight:400;font-size:22px;line-height:28px}
.hm-tick{position:absolute;right:-2px;bottom:-2px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--good);color:#0f3315;box-shadow:0 0 0 2px var(--felt-3)}
.hm-tile.puz.ready>small{color:var(--brass-light)}
.hm-tile.puz.ready::before,.hm-chest.ready::before{content:'';position:absolute;top:7px;right:8px;width:9px;height:9px;border-radius:50%;background:#ff6b5e;box-shadow:0 0 0 2px var(--felt-3);animation:hmLive 1.2s ease-in-out infinite alternate}
.hm-tile.puz.done>small{color:var(--good)}
.hm-qbig{color:var(--brass)}
.hm-tile.quests.done .hm-qbig{color:var(--good)}
.hm-qbig>span{position:absolute;inset:0;display:grid;place-items:center}
.hm-qbig em{position:relative;font-style:normal;font-family:var(--display);font-size:15px;color:var(--ivory)}
.hm-tile.quests::after{content:'';position:absolute;right:10px;top:12px;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s}
.hm-tile.quests[aria-expanded="true"]::after{transform:translateY(3px) rotate(-135deg)}
.hm-chest.ready{background:radial-gradient(90% 70% at 50% 30%,rgba(255,217,119,.32),transparent 70%),linear-gradient(180deg,#7a4a2b,#5a3219);border-color:rgba(239,187,79,.55);box-shadow:0 4px 0 #2e180b,0 0 18px rgba(255,210,110,.25)}
.hm-chest.ready>b{color:var(--brass-light)}
.hm-chest.ready .hm-tart{animation:hmWiggle 3.2s ease-in-out infinite}
.hm-chest .hm-tart{width:54px}
.hm-pips{display:flex;gap:3px;margin-top:4px}
.hm-pips i{width:7px;height:7px;border-radius:50%;background:rgba(0,0,0,.35)}
.hm-pips i.on{background:var(--brass)}
.hm-pips i.now{background:var(--ivory);box-shadow:0 0 0 2px rgba(239,187,79,.6)}

/* quests list */
.hm-quests{display:flex;flex-direction:column;gap:0;padding:4px 10px 8px;border-radius:18px;background:rgba(0,0,0,.18);border:1px solid rgba(247,239,221,.08);
  overflow:hidden;max-height:260px;transition:max-height .3s ease,opacity .25s,padding .3s,margin .3s}
.hm-quests.shut{max-height:0;opacity:0;padding-top:0;padding-bottom:0;margin-top:-10px;border-width:0}
.hm-q{display:flex;align-items:center;gap:9px;min-height:42px}
.hm-qring{position:relative;width:34px;height:34px;flex:none;display:grid;place-items:center;color:var(--brass)}
.hm-qring>span{position:absolute;inset:0}
.hm-qring>svg:last-child,.hm-qring>.ico{position:relative;color:var(--ivory)}
.hm-q.done .hm-qring{color:var(--good)}
.hm-q.done .hm-qring>svg:last-child{color:var(--good)}
.hm-qt{flex:1;min-width:0;font-size:14px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hm-qn{flex:none;font-size:12px;font-weight:700;color:var(--muted)}
.hm-q.done .hm-qt{color:var(--muted);text-decoration:line-through}
.hm-q.done .hm-qn{color:var(--good)}
.hm-qx{flex:none;min-width:44px;text-align:center;font-family:var(--display);font-size:14px;color:var(--brass-light);background:rgba(0,0,0,.25);padding:3px 8px;border-radius:10px}
.hm-q.done .hm-qx{color:var(--muted)}
.hm-qbonus{display:flex;align-items:center;gap:8px;margin-top:4px;padding:6px 10px;border-radius:12px;background:linear-gradient(90deg,rgba(239,187,79,.22),rgba(239,187,79,.06));color:var(--brass-light);font-size:13px;font-weight:700}
.hm-qbonus b{font-family:var(--display);font-weight:400;font-size:15px}
.hm-qbonus.got{background:rgba(147,220,152,.14);color:var(--good)}

/* rooms: compact, varied grid */
.hm-rooms{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:52px;grid-auto-flow:row dense;gap:10px;margin-top:2px}
.hm-room{min-height:0;border-radius:20px}
.hm-room.r-arena,.hm-room.r-atlas{grid-column:span 2;grid-row:span 2}
.hm-room.r-den{grid-row:span 3}
.hm-room.r-lib,.hm-room.r-hall,.hm-room.r-court{grid-row:span 2}
.hm-room .lab{padding:18px 12px 9px}
.hm-room .lab b{font-size:19px;line-height:1.05}
.hm-room .lab small{font-size:12px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hm-room .tag{top:8px;right:8px;font-size:11px;padding:2px 8px}
.hm-room.r-arena .tag{right:auto;left:10px}
.hm-room .room-bot{right:14px;top:50%;transform:translateY(-58%);animation:none}
.hm-room .room-hoot{right:4px;bottom:34px}
.hm-room.slim{flex-direction:row;align-items:center;justify-content:flex-start}
.hm-room.slim .lab{display:flex;align-items:baseline;gap:8px;padding:0 12px;height:100%;align-items:center;background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(0,0,0,.15) 70%,transparent)}
.hm-room.slim .lab b{font-size:17px}
.hm-room.slim .lab small{font-size:12px}
.hm-rbar{height:5px;border-radius:3px;background:rgba(0,0,0,.4);margin-top:4px;overflow:hidden;width:70%}
.hm-rbar i{display:block;height:100%;background:var(--good);border-radius:3px}

/* idle life in the room art: cheap transforms and opacity only */
.home .kc-tw{animation:kcTw 2.4s ease-in-out infinite alternate}
.home .kc-fl{animation:kcFl 3.4s steps(1,end) infinite}
.home .kc-spot{animation:kcSpot 7s ease-in-out infinite alternate}
.home .kc-sway{animation:kcSway 3.6s ease-in-out infinite alternate}
.home .kc-sway2{animation:kcSway2 5s ease-in-out infinite alternate}
.home .kc-bob{animation:kcBob 2.8s ease-in-out infinite alternate}
.home .kc-bob2{animation:kcTw 3s ease-in-out infinite alternate}
.home .kc-dust{animation:kcDust 6s ease-in-out infinite}
.home .kc-drift{animation:kcDrift 20s ease-in-out infinite alternate}
.home .kc-spin{animation:kcSpin 6s ease-in-out infinite alternate}
.home .kc-glow{transform-box:fill-box;transform-origin:center;animation:kcGlow 1.6s ease-in-out infinite alternate}
@keyframes kcTw{from{opacity:.25}to{opacity:1}}
@keyframes kcFl{0%{opacity:1}22%{opacity:.82}25%{opacity:1}61%{opacity:.9}64%{opacity:.72}67%{opacity:1}}
@keyframes kcSpot{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
@keyframes kcSway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
@keyframes kcSway2{from{transform:translateY(-1px) rotate(-1deg)}to{transform:translateY(2px) rotate(1deg)}}
@keyframes kcBob{from{transform:translateY(-2px)}to{transform:translateY(3px)}}
@keyframes kcDust{0%{transform:translateY(0);opacity:0}30%{opacity:.9}100%{transform:translateY(-18px);opacity:0}}
@keyframes kcDrift{from{transform:translateX(-12px)}to{transform:translateX(16px)}}
@keyframes kcSpin{from{transform:scaleX(1)}to{transform:scaleX(.25)}}
@keyframes kcGlow{from{transform:scale(.9);opacity:.2}to{transform:scale(1.08);opacity:.5}}
@keyframes hmSheen{0%,70%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
@keyframes hmBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

<script>// Chess rules engine + search. Written as one self-contained factory so it can run
// in the page, in a Web Worker (via Function.toString), and in Node for testing.
function ChessEngineFactory() {
  'use strict';
  const P = 1, N = 2, B = 3, R = 4, Q = 5, K = 6, BLACK = 8;
  const WHITE_SIDE = 0, BLACK_SIDE = 1;
  const F_CAP = 1, F_EP = 2, F_CASTLE = 4, F_DOUBLE = 8;
  const N_OFF = [33, 31, 18, 14, -33, -31, -18, -14];
  const K_OFF = [1, -1, 16, -16, 17, 15, -17, -15];
  const B_OFF = [17, 15, -17, -15];
  const R_OFF = [1, -1, 16, -16];
  const PIECE_CHARS = ' PNBRQK  pnbrqk';

  // ---------- zobrist ----------
  let seed = 0x2545F491;
  function rnd() { seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5; return seed >>> 0; }
  const Z1 = new Uint32Array(16 * 128), Z2 = new Uint32Array(16 * 128);

    6: [-30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -20,-30,-30,-40,-40,-30,-30,-20, -10,-20,-20,-20,-20,-20,-20,-10, 20,20,0,0,0,0,20,20, 20,30,10,0,0,10,30,20],

  const PASSED = [0, 5, 10, 20, 35, 60, 100, 0];

  function evaluate(pos, noiseAmp, noiseSalt) {
    const b = pos.board;

  }

  // =============== SEARCH ===============

        } else if (mPromo(m)) scores[i] = 900000 + mPromo(m);

          if (this.stop) return 0;

        const m = moves[i];
        if (!pos.tryMake(m)) continue;

        if (legal === 1) score = -this.negamax(depth - 1, -beta, -alpha, ply + 1, false);

          let red = 0;

  }

  // =============== MATE SOLVER (for puzzles) ===============
  // returns true if side to move can force mate within n moves
  function canMateIn(pos, n) {

    for (const m of moves) {

  function defenderLoses(pos, n) {

      if (!pos.tryMake(m)) continue;

  }

  const api = { chess960Fen, Position, Searcher, evaluate, canMateIn, matingMoves, mateLength, defenderLoses, sqName, sqFromName,
    mFrom, mTo, mPromo, mFlags, F_CAP, F_EP, F_CASTLE, F_DOUBLE, P, N, B, R, Q, K, BLACK, MATE, PIECE_CHARS };

}

// pick a bot move. rng: () => [0,1). salt: per-game number. Returns uci string.
function botChooseMove(E, searcher, pos, level, rng, salt, plyIndex, bookLine) {
  const legal = pos.legalMoves();
  if (!legal.length) return null;
  if (bookLine && plyIndex < level.book && plyIndex < bookLine.length) {
    const m = pos.moveFromSan(bookLine[plyIndex]);
    if (m) return { uci: pos.uci(m), book: true };
  }
  if (level.blunder && rng() < level.blunder) {
    const m = legal[Math.floor(rng() * legal.length)];
    return { uci: pos.uci(m), blunder: true };
  }
  const r = searcher.search(pos, { maxDepth: level.depth, maxNodes: level.nodes, noise: level.noise, salt });
  return { uci: pos.uci(r.move || legal[0]), score: r.score, depth: r.depth };
}

      { type: 'text', text: '<b>Developing</b> means moving your knights and bishops off the back row toward the center. Pieces at home do not help in the fight.', board: 'r1bqk1nr/pppp1ppp/2n5/2b1p3/2B1P3/5N2/PPPP1PPP/RNBQK2R', marks: ['f3', 'c4', 'c6', 'c5'] },
      { type: 'text', text: 'Three golden rules:<br>1. Bring out <b>knights and bishops</b> early.<br>2. Try not to move the <b>same piece twice</b> in the opening.<br>3. Do not bring the <b>queen</b> out too early. Enemy pieces will chase her and win time.' },
      { type: 'text', text: 'Here Black brought the queen out on move 2. White attacks her with the knight on c3: the knight <b>develops</b> and the queen must <b>run away</b>. White gains a free move!', board: 'rnb1kbnr/ppp1pppp/8/3q4/8/2N5/PPPP1PPP/R1BQKBNR', marks: ['c3', 'd5'] },
      { type: 'line', text: 'Play the White side. After 1.e4 d5 2.exd5 Qxd5, develop <b>with tempo</b>: hit the queen with <b>Nc3</b>, then take the center with <b>d4</b> and develop the other knight to <b>f3</b>.', fen: CRS_START_FEN, side: 'w', moves: ['e2e4', 'd7d5', 'e4d5', 'd8d5', 'b1c3', 'd5a5', 'd2d4', 'g8f6', 'g1f3'], book: true, success: 'White has two knights out and a strong pawn on d4. Black spent three moves on the queen.', fail: 'Follow the plan: e4, take on d5, Nc3, d4, Nf3.' },
    ] },
    { id: 'op-king', title: 'King Safety', desc: 'Castle early and guard f7', steps: [
      { type: 'text', text: '<b>Castle early</b>, usually in the first ten moves. Your king hides behind a wall of pawns, and your rook comes toward the center.', board: 'r1bq1rk1/pppp1ppp/2n2n2/2b1p3/2B1P3/2NP1N2/PPP2PPP/R1BQ1RK1', marks: ['g1', 'g8'] },
      { type: 'text', text: 'Before you castle, <b>f7</b> is Black\'s weakest square (f2 for White). At the start, only the king defends it. Many quick attacks aim right there.', board: CRS_START_BOARD, marks: ['f7', 'f2'] },
      { type: 'line', text: 'Play Black. White goes for <b>Scholar\'s Mate</b> with the queen and bishop aiming at f7. Answer 1.e4 with <b>e5</b>, 2.Qh5 with <b>Nc6</b>, 3.Bc4 with <b>g6</b> (blocking the queen), and 4.Qf3 with <b>Nf6</b>.', fen: CRS_START_FEN, side: 'b', moves: ['e2e4', 'e7e5', 'd1h5', 'b8c6', 'f1c4', 'g7g6', 'h5f3', 'g8f6'], alt: { 5: ['d8e7'] }, book: true, success: 'Mate stopped! The knight on f6 blocks the queen\'s path to f7 and develops a piece at the same time. White\'s queen has already moved twice.', fail: 'Careful: watch the f7 square. Follow the plan: e5, Nc6, g6, Nf6.' },
      { type: 'text', text: 'Remember: an early queen attack is easy to stop if you look at what she attacks. Then <b>develop with threats</b> and her adventure becomes a waste of time.' },
    ] },
    { id: 'op-traps', title: 'Opening Traps', desc: 'The Fried Liver and Legal\'s Mate', steps: [
      { type: 'text', text: 'In this position White\'s knight jumped to <b>g5</b>. Now the knight and the bishop on c4 both attack <b>f7</b>. Black has to react!', board: 'r1bqkb1r/pppp1ppp/2n2n2/4p1N1/2B1P3/8/PPPP1PPP/RNBQK2R', marks: ['g5', 'c4', 'f7'] },
      { type: 'line', text: 'Play Black. Block the bishop\'s line to f7 with a pawn move that also attacks: <b>d5</b>!', fen: 'r1bqkb1r/pppp1ppp/2n2n2/4p1N1/2B1P3/8/PPPP1PPP/RNBQK2R b KQkq - 5 4', side: 'b', moves: ['d7d5'], book: true, success: 'Right! After 5.exd5 the best move is <b>5...Na5</b>, chasing the bishop. Taking back with 5...Nxd5? is risky: White can play 6.Nxf7!, the <b>Fried Liver Attack</b>.', fail: 'Look for a pawn move that blocks the bishop on c4.' },
      { type: 'text', text: 'This is the Fried Liver: White gave up a knight on f7 to drag the black king into the open. After 7.Qf3+ the king has no safe home. Lesson: keep your king safe, and do not let both attackers hit f7.', board: 'r1bq1b1r/ppp2kpp/2n5/3np3/2B5/5Q2/PPPP1PPP/RNB1K2R', marks: ['f7', 'f3', 'd5'] },
      { type: 'line', text: '<b>Legal\'s Mate</b>, a trap over 250 years old. Black pinned your knight with Bg4. Play <b>Nc3</b>. If Black plays ...g6, take on e5 with the "pinned" knight: <b>Nxe5</b>! If Black grabs your queen, finish with <b>Bxf7+</b> and <b>Nd5#</b>.', fen: 'rn1qkbnr/ppp2ppp/3p4/4p3/2B1P1b1/5N2/PPPP1PPP/RNBQK2R w KQkq - 2 4', side: 'w', trap: true, moves: ['b1c3', 'g7g6', 'f3e5', 'g4d1', 'c4f7', 'e8e7', 'c3d5'], success: 'Checkmate with three minor pieces! The pin was not real: taking the queen cost Black the game. (If Black had played 5...dxe5, then 6.Qxg4 wins a pawn.)', fail: 'Follow the trap: Nc3, Nxe5, Bxf7+, Nd5#.' },
    ] },
    { id: 'op-e4e5', title: 'Italian Game and Ruy Lopez', desc: 'Classic openings after 1.e4 e5', steps: [
      { type: 'text', text: 'After <b>1.e4 e5 2.Nf3 Nc6</b>, White\'s bishop has two famous homes. On <b>c4</b> it aims at f7: that is the <b>Italian Game</b>. On <b>b5</b> it pressures the knight that defends e5: that is the <b>Ruy Lopez</b> (or Spanish Game).', board: 'r1bqkbnr/pppp1ppp/2n5/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R', marks: ['c4', 'b5', 'f7', 'c6'] },
      { type: 'line', text: '<b>Italian Game.</b> Play White: <b>e4</b>, <b>Nf3</b> (attacks e5), <b>Bc4</b> (aims at f7), then <b>c3</b> to prepare <b>d4</b> and build a big center.', fen: CRS_START_FEN, side: 'w', moves: ['e2e4', 'e7e5', 'g1f3', 'b8c6', 'f1c4', 'f8c5', 'c2c3', 'g8f6', 'd2d4'], book: true, success: 'That is the main line of the Italian Game. The pawn on c3 supports d4, so White can build a big pawn center.', fail: 'Follow the plan: e4, Nf3, Bc4, c3, d4.' },
      { type: 'line', text: '<b>Ruy Lopez.</b> Play White: <b>e4</b>, <b>Nf3</b>, <b>Bb5</b>. When Black asks the bishop with ...a6, keep it with <b>Ba4</b>. Then <b>castle</b> and put the rook on <b>e1</b> to guard e4.', fen: CRS_START_FEN, side: 'w', moves: ['e2e4', 'e7e5', 'g1f3', 'b8c6', 'f1b5', 'a7a6', 'b5a4', 'g8f6', 'e1g1', 'f8e7', 'f1e1'], book: true, success: 'The Ruy Lopez main line! White castled quickly and keeps steady pressure on the center for a long game.', fail: 'Follow the plan: e4, Nf3, Bb5, Ba4, castle, Re1.' },
      { type: 'text', text: 'Why castle before defending e4 in the Ruy Lopez? If Black takes on e4, White can win the pawn back (with d4 or Re1) while the black king is still in the center. Development and king safety come first!' },
    ] },
    { id: 'op-d4', title: 'Queen\'s Gambit and London', desc: 'Solid openings after 1.d4', steps: [
      { type: 'text', text: 'In the <b>Queen\'s Gambit</b>, White offers the c-pawn with <b>1.d4 d5 2.c4</b>. If Black takes it, White gets a big center and wins the pawn back later. It is not a real sacrifice!', board: 'rnbqkbnr/ppp1pppp/8/3p4/2PP4/8/PP2PPPP/RNBQKBNR', marks: ['c4', 'd5'] },
      { type: 'line', text: 'Play White in the <b>Queen\'s Gambit Declined</b>: <b>d4</b>, <b>c4</b>, <b>Nc3</b> (more pressure on d5), <b>Bg5</b> (pins the f6 knight), <b>e3</b>, and <b>Nf3</b>.', fen: CRS_START_FEN, side: 'w', moves: ['d2d4', 'd7d5', 'c2c4', 'e7e6', 'b1c3', 'g8f6', 'c1g5', 'f8e7', 'e2e3', 'e8g8', 'g1f3'], book: true, success: 'A classical setup that world champions have played for over 100 years. Every white move develops or adds pressure on d5.', fail: 'Follow the plan: d4, c4, Nc3, Bg5, e3, Nf3.' },
      { type: 'text', text: 'The <b>London System</b> is a setup you can play against almost anything: pawns on <b>d4, e3, c3</b>, bishop on <b>f4</b>, knights on <b>f3 and d2</b>. Get the bishop out <b>before</b> e3, or it gets locked in.', board: 'r1bqkb1r/pp3ppp/2n1pn2/2pp4/3P1B2/2P1PN2/PP1N1PPP/R2QKB1R', marks: ['f4', 'e3', 'c3', 'd2'] },
      { type: 'line', text: 'Play the <b>London</b>: <b>d4</b>, <b>Bf4</b>, <b>e3</b>, <b>Nf3</b>, <b>c3</b> (supports d4), <b>Nbd2</b>. When Black offers to trade bishops with ...Bd6, step back to <b>Bg3</b> to keep your good bishop.', fen: CRS_START_FEN, side: 'w', moves: ['d2d4', 'd7d5', 'c1f4', 'g8f6', 'e2e3', 'e7e6', 'g1f3', 'c7c5', 'c2c3', 'b8c6', 'b1d2', 'f8d6', 'f4g3'], book: true, success: 'A rock-solid London System. Next White usually plays Bd3 and castles.', fail: 'Follow the setup: d4, Bf4, e3, Nf3, c3, Nbd2, Bg3.' },
    ] },
    { id: 'op-sicilian', title: 'Sicilian Defense', desc: 'Fight back as Black with 1...c5', steps: [
      { type: 'text', text: 'Against <b>1.e4</b>, the <b>Sicilian Defense 1...c5</b> is the most popular answer at top level. Black fights for d4 from the side and makes the game unbalanced.', board: 'rnbqkbnr/pp1ppppp/8/2p5/4P3/8/PPPP1PPP/RNBQKBNR', marks: ['c5', 'd4'] },
      { type: 'text', text: 'When White opens the center with d4, Black trades the <b>c-pawn for White\'s d-pawn</b>. Black keeps two center pawns (d and e) against one, and the half-open c-file for a rook.' },
      { type: 'line', text: 'Play Black in the <b>Najdorf</b>: <b>c5</b>, <b>d6</b>, take on d4 with <b>cxd4</b>, develop with <b>Nf6</b> (it hits e4), then the famous little move <b>a6</b>.', fen: CRS_START_FEN, side: 'b', moves: ['e2e4', 'c7c5', 'g1f3', 'd7d6', 'd2d4', 'c5d4', 'f3d4', 'g8f6', 'b1c3', 'a7a6'], book: true, success: 'The Najdorf! ...a6 keeps White\'s pieces off b5 and prepares ...e5 or ...b5. A favorite of many world champions.', fail: 'Follow the plan: c5, d6, cxd4, Nf6, a6.' },
    ] },
    { id: 'op-french-caro', title: 'French and Caro-Kann', desc: 'Solid defenses for Black', steps: [
      { type: 'text', text: 'The <b>French (1...e6)</b> and the <b>Caro-Kann (1...c6)</b> work the same way: first a small pawn step, then <b>...d5</b> to challenge White\'s e4 pawn with two pawns.', board: 'rnbqkbnr/ppp2ppp/4p3/3p4/3PP3/8/PPP2PPP/RNBQKBNR', marks: ['e6', 'd5', 'e4'] },
      { type: 'line', text: 'Play Black in the <b>French</b>: <b>e6</b>, <b>d5</b>, develop with <b>Nf6</b> (attacks e4 again), and break the pin with <b>Be7</b>.', fen: CRS_START_FEN, side: 'b', moves: ['e2e4', 'e7e6', 'd2d4', 'd7d5', 'b1c3', 'g8f6', 'c1g5', 'f8e7'], book: true, success: 'The Classical French. Black is solid and will castle next. The one drawback: the light-squared bishop on c8 is stuck behind the e6 pawn.', fail: 'Follow the plan: e6, d5, Nf6, Be7.' },
      { type: 'text', text: 'The Caro-Kann fixes that problem. The pawn goes to c6 instead of e6, so the light-squared bishop can come out to <b>f5</b> before Black plays ...e6.' },
      { type: 'line', text: 'Play Black in the <b>Caro-Kann</b>: <b>c6</b>, <b>d5</b>, trade with <b>dxe4</b>, develop the bishop with tempo by <b>Bf5</b>, and when it is attacked, retreat to <b>Bg6</b>.', fen: CRS_START_FEN, side: 'b', moves: ['e2e4', 'c7c6', 'd2d4', 'd7d5', 'b1c3', 'd5e4', 'c3e4', 'c8f5', 'e4g3', 'f5g6'], book: true, success: 'The Classical Caro-Kann. Your bishop is outside the pawn chain, and your position is very solid.', fail: 'Follow the plan: c6, d5, dxe4, Bf5, Bg6.' },
    ] },
  ] },

  // =====================================================================
  { id: 'tactics', title: 'Tactics Toolkit', desc: 'Forks, pins, skewers and more ways to win material', icon: 'bolt', level: 'intermediate', lessons: [
    { id: 'tx-fork', title: 'Forks', desc: 'One piece, two targets', steps: [
      { type: 'text', text: 'A <b>fork</b> is one piece attacking <b>two or more</b> enemy pieces at once. The opponent can only save one! Knights are the best forkers because their jumps are hard to see.', board: 'r3k3/2N5/8/8/8/8/8/4K3', marks: ['c7', 'a8', 'e8'] },
      { type: 'goal', text: 'Your knight is under attack, but it can strike first. Find the <b>knight fork</b>!', fen: '6k1/5ppp/2q5/3N4/8/8/5PPP/6K1 w - - 0 1', goal: 'move', moves: ['d5e7'], success: 'Ne7+ forks the king and queen. After the king moves, you take the queen.', fail: 'Look for a knight jump that gives check AND attacks the queen.' },
      { type: 'goal', text: 'Pawns can fork too! Attack <b>both knights</b> with one pawn move.', fen: '6k1/pp3ppp/3n1n2/8/4P3/8/PP3PPP/4R1K1 w - - 0 1', goal: 'move', moves: ['e4e5'], success: 'e5 forks both knights. One of them will be lost, and your rook protects the pawn.', fail: 'Which pawn move attacks d6 and f6 at the same time?' },
      { type: 'goal', text: 'The queen is a great forker. Find a <b>check that also attacks the rook</b>.', fen: 'r7/5ppk/7p/8/8/8/4QPPP/6K1 w - - 0 1', goal: 'move', moves: ['e2e4'], success: 'Qe4+ hits the king on h7 and the rook on a8. The rook falls next move.', fail: 'Find a diagonal that reaches both h7 and a8.' },
    ] },
    { id: 'tx-pin', title: 'Pins', desc: 'Freeze a piece in place', steps: [
      { type: 'text', text: 'A <b>pin</b> attacks a piece that cannot move without exposing something more valuable behind it. Here the bishop pins the knight to the king. That is an <b>absolute pin</b>: moving the knight would be illegal.', board: 'r1bqkbnr/pppp1ppp/2n5/1B2p3/4P3/5N2/PPPP1PPP/RNBQK2R', marks: ['b5', 'c6', 'e8'] },
      { type: 'text', text: 'Here the bishop pins the knight to the <b>queen</b>. That is a <b>relative pin</b>: the knight may move, but then the queen is lost. Pinned pieces are great targets: attack them again!', board: '3qk3/8/5n2/6B1/8/8/8/4K3', marks: ['g5', 'f6', 'd8'] },
      { type: 'goal', text: 'Pin the black queen to her king. She will be lost for just a bishop!', fen: '6k1/6pp/8/3q4/8/1P6/5PPP/5BK1 w - - 0 1', goal: 'move', moves: ['f1c4'], success: 'Bc4 pins the queen. She cannot step off the line, and if she takes the bishop, bxc4 wins her.', fail: 'Find a bishop square on the same diagonal as the queen and the king. Make sure it is protected!', },
      { type: 'goal', text: 'Your rook pins the knight to the black queen. <b>Attack the pinned piece</b> with a pawn!', fen: '3q2k1/pp3ppp/8/3n4/8/5N2/PPP2PPP/3R2K1 w - - 0 1', goal: 'move', moves: ['c2c4'], success: 'c4 attacks the pinned knight. If it moves, Rxd8+ wins the queen. Black loses a piece.', fail: 'Which pawn can attack the knight on d5?' },
    ] },
    { id: 'tx-skewer', title: 'Skewers', desc: 'A pin in reverse', steps: [
      { type: 'text', text: 'A <b>skewer</b> is like a pin in reverse: you attack a <b>valuable</b> piece, it moves away, and you capture the piece <b>behind</b> it. Checks make the best skewers, because the king must move.', board: '3q4/8/8/8/3k4/8/8/3R3K', marks: ['d1', 'd4', 'd8'] },
      { type: 'goal', text: 'The black king and queen stand on the same file. <b>Skewer</b> them with your rook!', fen: '3q4/8/8/8/3k4/8/8/R6K w - - 0 1', goal: 'move', moves: ['a1d1'], success: 'Rd1+! The king must step aside, and the rook takes the queen.', fail: 'Put your rook on the d-file with check.' },
      { type: 'goal', text: 'Find a <b>bishop check</b> that skewers the king and the rook.', fen: '7r/8/8/4k3/8/8/5PPP/2B3K1 w - - 0 1', goal: 'move', moves: ['c1b2'], success: 'Bb2+ hits the king on e5 and the rook on h8 along the same diagonal. The rook is yours.', fail: 'The king on e5 and the rook on h8 share a long diagonal.' },
    ] },
    { id: 'tx-discovered', title: 'Discovered Attacks', desc: 'Move one piece, attack with another', steps: [
      { type: 'text', text: 'In a <b>discovered attack</b>, one piece moves out of the way and <b>uncovers</b> an attack by the piece behind it. The moving piece can make its own threat, so you get two attacks in one move!', board: '3q2k1/8/8/8/3N4/8/8/3R2K1', marks: ['d1', 'd4', 'd8'] },
      { type: 'goal', text: 'Move the bishop with <b>check</b>, and your rook will be attacking the queen.', fen: '5rk1/3q1ppp/8/8/8/3B4/5PPP/3R2K1 w - - 0 1', goal: 'move', moves: ['d3h7'], success: 'Bxh7+! Black must deal with the check, and then Rxd7 wins the queen.', fail: 'The bishop must move with check, so Black has no time to save the queen.' },
      { type: 'text', text: 'A <b>discovered check</b> is the strongest kind: the uncovered piece gives check, so the moving piece can go anywhere and attack anything.' },
      { type: 'goal', text: 'Your bishop on b2 is aimed at the black king. Move the knight to <b>uncover check</b> and attack the queen at the same time.', fen: '3q3k/5p1p/6p1/8/3N4/8/1B3PPP/6K1 w - - 0 1', goal: 'move', moves: ['d4c6', 'd4e6'], success: 'Discovered check! Black must answer the bishop, and your knight takes the queen.', fail: 'Find a knight jump that attacks d8 while uncovering the bishop.' },
    ] },
    { id: 'tx-double', title: 'Double Check', desc: 'Two checks at once', steps: [
      { type: 'text', text: 'A <b>double check</b> happens when a moving piece gives check AND uncovers a second check. You cannot block two lines or capture two pieces at once, so the <b>king must move</b>. If it cannot, it is mate!', board: 'rnbqkb1r/pppp1ppp/5N2/8/8/8/PPPP1PPP/4R1K1', marks: ['f6', 'e1', 'e8'] },
      { type: 'goal', text: 'The black king is boxed in by its own pieces. Give a <b>double check</b> that is also <b>checkmate</b>!', fen: 'rnbqkb1r/pppp1ppp/8/8/4N3/8/PPPP1PPP/4R1K1 w kq - 0 1', goal: 'mate', success: 'Double check and mate! Capturing the knight does not help, because the rook still gives check.' },
      { type: 'line', text: 'A famous game, Reti vs Tartakower, 1910. Sacrifice your queen with <b>Qd8+</b>! After Kxd8, give a double check with <b>Bg5+</b>, and finish with <b>Bd8#</b>.', fen: 'rnb1kb1r/pp3ppp/2p5/4q3/4n3/3Q4/PPPB1PPP/2KR1BNR w kq - 0 9', side: 'w', moves: ['d3d8', 'e8d8', 'd2g5', 'd8c7', 'g5d8'], success: 'Brilliant! One of the most famous double checks ever played. (If 10...Ke8, then 11.Rd8 is mate.)', fail: 'Follow the combination: Qd8+, Bg5+, Bd8#.' },
    ] },
    { id: 'tx-defender', title: 'Removing the Defender', desc: 'Capture or lure away the guard', steps: [
      { type: 'text', text: 'Sometimes one enemy piece holds everything together. <b>Capture it</b> or <b>lure it away</b> (a <b>deflection</b>), and the position falls apart. Here the knight on f6 is the only guard of h7.', board: 'r1bq1rk1/ppp2ppp/5n2/7Q/4N3/3B4/PPP2PPP/R4RK1', marks: ['f6', 'h7'] },
      { type: 'goal', text: 'Your queen and bishop both aim at h7, but the knight on f6 guards it. <b>Remove the defender</b>!', fen: 'r1bq1rk1/ppp2ppp/5n2/7Q/4N3/3B4/PPP2PPP/R4RK1 w - - 0 1', goal: 'move', moves: ['e4f6'], success: 'Nxf6+! Whatever Black does, Qxh7 is checkmate next.', fail: 'Get rid of the knight on f6 first, with check if you can.' },
      { type: 'goal', text: 'The black rook on d8 has two jobs: guarding the queen and guarding the back rank. <b>Overload it</b>!', fen: '3r2k1/5ppp/8/3q4/8/7P/Q4PP1/4R1K1 w - - 0 1', goal: 'move', moves: ['a2d5'], success: 'Qxd5! If the rook takes back, Re8 is checkmate. So Black simply loses the queen.', fail: 'The rook cannot guard d5 and e8 at the same time. Make it choose!' },
    ] },
    { id: 'tx-backrank', title: 'Back-Rank Weakness', desc: 'When your own pawns trap the king', steps: [
      { type: 'text', text: 'A king behind three unmoved pawns has <b>no escape square</b>. A rook or queen landing on the back rank can give checkmate. This is the <b>back-rank mate</b>.', board: '4R1k1/5ppp/8/8/8/8/5PPP/6K1', marks: ['e8', 'f7', 'g7', 'h7'] },
      { type: 'text', text: 'The cure is <b>luft</b> (German for "air"): a little pawn move like h3 or h6 gives your king a square to breathe. Make one when you have a quiet moment.', board: '6k1/5pp1/7p/8/8/7P/5PP1/6K1', marks: ['h7', 'h2'] },
      { type: 'goal', text: 'The black queen on d8 guards the back rank. Give her up to deflect the rook: find the <b>queen sacrifice</b>!', fen: 'r2q2k1/pp3ppp/8/8/3Q4/8/5PPP/3R2K1 w - - 0 1', goal: 'move', moves: ['d4d8'], success: 'Qxd8+! After Rxd8, Rxd8 is checkmate. The back rank was too weak.', fail: 'A capture with check on d8 starts the combination.' },
      { type: 'goal', text: 'Your pawn is one step from queening, but the rook blocks it. Use the <b>back rank</b> to clear the way!', fen: '3r3k/3P2pp/8/8/8/8/5PPP/4R1K1 w - - 0 1', goal: 'move', moves: ['e1e8'], success: 'Re8+! Black must take with the rook, and dxe8=Q is checkmate.', fail: 'A rook check on the back rank forces Black\'s hand.' },
    ] },
  ] },

  // =====================================================================
  { id: 'endgames', title: 'Endgame Essentials', desc: 'Checkmate techniques and the key pawn and rook endings', icon: 'crown', level: 'advanced', lessons: [
    { id: 'eg-kq', title: 'King and Queen vs King', desc: 'The box, and the stalemate trap', steps: [
      { type: 'text', text: 'With a queen you can mate a lone king. Put the queen a <b>knight\'s jump away</b> from the enemy king. The king is now stuck in a <b>box</b>. Keep shrinking it.', board: '8/8/8/3k4/8/2Q5/8/4K3', marks: ['d5', 'c3'] },
      { type: 'text', text: 'The queen cannot mate alone. Once the king is on the edge, walk <b>your king</b> up to help. Watch out: if the enemy king has <b>no moves</b> but is not in check, it is <b>stalemate</b>, a draw! Here any White king move stalemates.', board: 'k7/2Q5/8/1K6/8/8/8/8', marks: ['a8'] },
      { type: 'goal', text: 'Your king guards b7 and a7. Find the <b>checkmate</b>, not a stalemate!', fen: 'k7/8/1K6/8/8/8/8/2Q5 w - - 0 1', goal: 'mate', success: 'Checkmate on the back rank. Qc7 would have been stalemate!' },
      { type: 'goal', text: 'Same idea in the other corner. <b>Checkmate</b>, and do not stalemate!', fen: '7k/8/6K1/8/8/8/8/5Q2 w - - 0 1', goal: 'mate', success: 'Checkmate! Qf7 would have left the king with no moves: stalemate.' },
      { type: 'line', text: 'Now the full finish. Lock the king on the edge with <b>Qg7</b>, bring your king up with <b>Kb6</b>, then deliver mate with <b>Qc7#</b>.', fen: 'k7/8/8/K7/8/6Q1/8/8 w - - 0 1', side: 'w', moves: ['g3g7', 'a8b8', 'a5b6', 'b8c8', 'g7c7'], success: 'Box, approach, mate. That is the whole method!', fail: 'Follow the plan: Qg7, Kb6, Qc7#.' },
    ] },
    { id: 'eg-kr', title: 'King and Rook vs King', desc: 'The box method', steps: [
      { type: 'text', text: 'A rook can mate too, but it needs more help from the king. The rook <b>cuts off</b> the enemy king: here it cannot cross the d-file. Your job is to make that box smaller.', board: '8/8/5k2/8/8/8/8/3RK3', marks: ['d1', 'f6'] },
      { type: 'text', text: 'The method: 1. <b>Cut off</b> the king with the rook. 2. Bring your king up so the kings <b>face each other</b>. 3. Check with the rook to push the king back one row. 4. Repeat until it is on the edge, then mate.' },
      { type: 'goal', text: 'The kings face each other. Now the rook gives <b>checkmate</b>.', fen: '6k1/8/6K1/8/8/8/8/R7 w - - 0 1', goal: 'mate', success: 'Checkmate! Your king covers the escape squares, and the rook covers the whole back rank.' },
      { type: 'line', text: 'Bring your king to face the black king with <b>Kc6</b>. Black has to step to c8. Then mate with <b>Re8#</b>.', fen: '3k4/8/8/1K6/8/8/8/4R3 w - - 0 1', side: 'w', moves: ['b5c6', 'd8c8', 'e1e8'], success: 'Exactly! The rook already cut off the e-file, so the king was trapped.', fail: 'First walk your king to c6.' },
      { type: 'line', text: 'A harder one. Walk in with <b>Ke6</b>. When the king goes to f8, cut it off with the rook on the g-file (<b>Rg1</b>). It must come back to e8, and <b>Rg8</b> is mate.', fen: '4k3/8/8/3K4/8/8/8/R7 w - - 0 1', side: 'w', moves: ['d5e6', 'e8f8', 'a1g1', 'f8e8', 'g1g8'], success: 'Mate in three! A quiet rook move to take away squares is often the key.', fail: 'Follow the plan: Ke6, Rg1, Rg8#.' },
    ] },
    { id: 'eg-square', title: 'The Rule of the Square', desc: 'Can the king catch the pawn?', steps: [
      { type: 'text', text: 'Can a king catch a runaway pawn? Draw a <b>square</b> from the pawn to its promotion row. If the king can step <b>into the square</b>, it catches the pawn. If not, the pawn promotes.', board: '8/8/8/8/1p6/8/8/8', marks: ['b4', 'c4', 'd4', 'e4', 'b3', 'c3', 'd3', 'e3', 'b2', 'c2', 'd2', 'e2', 'b1', 'c1', 'd1', 'e1'] },
      { type: 'goal', text: 'Black\'s pawn is running to b1. Step <b>into the square</b> to catch it!', fen: '7k/8/8/8/1p3K2/8/8/8 w - - 0 1', goal: 'move', moves: ['f4e4', 'f4e3'], success: 'You are inside the square, so the pawn can never escape your king. It is a draw.', fail: 'Too slow! Your king needs to enter the square b4-e4-e1-b1.' },
      { type: 'goal', text: 'Now it is your pawn racing. Is the black king inside the square? Make the move that <b>wins</b>.', fen: '8/8/8/5k2/P7/8/8/7K w - - 0 1', goal: 'move', moves: ['a4a5'], success: 'Run, pawn, run! After a5 the square shrinks to a5-d5-d8-a8, and the black king is one step too far.', fail: 'Your king is too far away to help. What about the pawn?' },
    ] },
    { id: 'eg-opposition', title: 'Opposition and Key Squares', desc: 'How a king escorts a pawn', steps: [
      { type: 'text', text: 'When two kings stand face to face with <b>one square between them</b>, they are in <b>opposition</b>. The side that does NOT have to move "has the opposition": the other king must step aside.', board: '8/4k3/8/4K3/8/8/8/8', marks: ['e5', 'e7'] },
      { type: 'goal', text: 'Take the <b>opposition</b>! Put your king face to face with the black king, so Black has to give way.', fen: '8/4k3/8/8/4PK2/8/8/8 w - - 0 1', goal: 'move', moves: ['f4e5'], success: 'Ke5! Black must step aside, and your king marches forward. This wins.', fail: 'That lets Black take the opposition. Face the king with one square between.' },
      { type: 'text', text: 'Every pawn has <b>key squares</b>. For a pawn on e4 they are <b>d6, e6 and f6</b>, two rows ahead. If your king reaches a key square, the pawn will promote no matter who is to move.', board: '8/8/8/8/4P3/8/8/8', marks: ['d6', 'e6', 'f6'] },
      { type: 'goal', text: 'Reach a <b>key square</b> with your king!', fen: '8/5k2/8/3K4/4P3/8/8/8 w - - 0 1', goal: 'move', moves: ['d5d6'], success: 'Kd6 is on a key square. The pawn will promote.', fail: 'Find the key square the black king cannot keep you out of.' },
    ] },
    { id: 'eg-rookpawn', title: 'Rook Pawns', desc: 'Why the a-pawn and h-pawn often draw', steps: [
      { type: 'text', text: 'A pawn on the a-file or h-file is called a <b>rook pawn</b>. It is special: if the defending king reaches the corner in front of it, White can never win. The best try ends in stalemate.', board: 'k7/P7/1K6/8/8/8/8/8', marks: ['a8'] },
      { type: 'goal', text: 'You are Black. Save the game by heading for the <b>corner</b>!', fen: '8/3k4/1K6/P7/8/8/8/8 b - - 0 1', goal: 'move', moves: ['d7c8'], success: 'Kc8! Next you reach b8 or a8, and White cannot drive you out. It is a draw.', fail: 'That loses: White\'s king shuts you out of the corner. Get closer to a8!' },
      { type: 'text', text: 'The lesson: with a rook pawn, the defender runs to the corner. With any other pawn, the opposition and key squares usually decide.' },
    ] },
    { id: 'eg-lucena', title: 'The Lucena Position', desc: 'Win by building a bridge', steps: [
      { type: 'text', text: 'Rook and pawn vs rook. White\'s pawn is on the 7th rank, the king is in front of it, and the black king is <b>cut off</b> on the g-file. White wants to step out, but then Black gives checks from the side.', board: '3K4/3P2k1/8/8/8/8/2r5/5R2', marks: ['d8', 'd7', 'f1'] },
      { type: 'text', text: 'The trick is called <b>building a bridge</b>: put the rook on the <b>4th rank</b>. Then walk the king out. When the checks come, the rook blocks them and the pawn promotes.' },
      { type: 'line', text: 'Start the bridge with <b>Rf4</b>, then walk out: <b>Ke7</b> and <b>Kd6</b>.', fen: '3K4/3P2k1/8/8/8/8/2r5/5R2 w - - 0 1', side: 'w', moves: ['f1f4', 'c2c1', 'd8e7', 'c1e1', 'e7d6'], success: 'Good. The king is out and the rook waits on f4. The checks will run out soon.', fail: 'Follow the plan: Rf4, Ke7, Kd6.' },
      { type: 'goal', text: 'A few checks later Black checks again from d1. <b>Complete the bridge</b>!', fen: '8/3P2k1/8/3K4/5R2/8/8/3r4 w - - 0 1', goal: 'move', moves: ['f4d4'], success: 'Rd4! The bridge is built. No more checks, and the pawn will queen.', fail: 'Block the check with your rook.' },
    ] },
    { id: 'eg-philidor', title: 'The Philidor Defense', desc: 'Draw by guarding the third rank', steps: [
      { type: 'text', text: 'Now you defend. In the <b>Philidor position</b>, Black\'s king is in front of the pawn. The rook holds the <b>third rank</b> from Black\'s side (the 6th rank) so the white king cannot come closer.', board: '4k3/1R6/r7/3KP3/8/8/8/8', marks: ['a6', 'e8'] },
      { type: 'text', text: 'The rule: wait on the 6th rank. When the pawn steps to e6, it no longer shelters its king, so go to the 1st rank and <b>check from behind</b>. The white king has nowhere to hide.', board: '4k3/1R6/4P3/3K4/8/8/8/r7', marks: ['a1', 'e6'] },
      { type: 'line', text: 'You are Black. Put your rook on the <b>6th rank</b> with <b>Ra6</b>. When White pushes e6, drop back with <b>Ra1</b>.', fen: '4k3/1R6/8/3KP3/8/8/8/r7 b - - 0 1', side: 'b', moves: ['a1a6', 'e5e6', 'a6a1'], success: 'That is the Philidor Defense. Now check from behind forever: it is a draw.', fail: 'Follow the plan: Ra6, then Ra1 once the pawn reaches e6.' },
    ] },
  ] },
];
