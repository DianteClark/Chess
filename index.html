.sp-av{position:relative;flex:none;border-radius:50%;padding:4px;background:conic-gradient(from 200deg,#ffe39a,#b88021,#ffe39a,#b88021,#ffe39a);box-shadow:0 6px 0 rgba(0,0,0,.35)}
.sp-av .av-img{width:96px;height:96px;display:block}
.sp-beaten{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:3px;font-size:11px;font-weight:700;background:var(--good);color:var(--ink);padding:2px 8px;border-radius:10px;white-space:nowrap}
.sp-info{flex:1;min-width:0}
.sp-lvl{font-size:12px;font-weight:700;color:var(--brass-light);letter-spacing:.3px}
.sp-name{display:block;font-family:var(--display);font-weight:400;font-size:30px;line-height:1.05}
.sp-rt{display:inline-flex;align-items:center;gap:3px;font-weight:700;color:var(--brass-light)}
.sp-info p{margin:4px 0 6px;font-size:14px;line-height:1.3;color:rgba(255,236,220,.85)}
.sp-rec{display:flex;gap:10px;font-size:12px;font-weight:700}
.sp-rec .w{color:var(--good)} .sp-rec .l{color:var(--bad)}
.bot-strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:4px 2px 6px;margin:-4px -2px 0;scroll-snap-type:x proximity}
.bot-strip::-webkit-scrollbar{display:none}
.bs{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 6px 4px;border-radius:16px;background:var(--card);border:2px solid transparent;scroll-snap-align:center;transition:transform .12s,border-color .12s}
.bs small{font-size:11px;font-weight:700;color:var(--muted)}
.bs.on{border-color:var(--brass);background:var(--card2);transform:translateY(-2px)}
.bs.beat .av-img{box-shadow:0 0 0 2px var(--good)}
.setup2{display:flex;flex-direction:column;gap:10px;padding:12px}
.setup2 .srow{display:flex;align-items:center;gap:10px}
.setup2 .srow.col{flex-direction:column;align-items:stretch}
.setup2 .lbl{min-width:58px;margin:0;font-size:13px;font-weight:700;color:var(--muted)}
.setup2 .seg{flex:1}
.setup2 .seg button img{width:22px;height:22px}
.setup2 .tcs{display:flex;overflow-x:auto;gap:6px;scrollbar-width:none}
.setup2 .tcs::-webkit-scrollbar{display:none}
.setup2 .tcs button{flex:none;min-width:64px}
.play-dock{position:sticky;bottom:calc(114px + var(--safe-b));z-index:5;display:flex;flex-direction:column;gap:6px;padding:8px 8px 10px;margin:0 -8px;border-radius:22px;background:rgba(17,46,35,.96);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 -8px 20px -8px rgba(0,0,0,.5)}
.play-big{display:flex;align-items:center;justify-content:center;gap:10px;min-height:60px;border-radius:20px;font-family:var(--display);font-size:24px;color:var(--ink);
  background:linear-gradient(180deg,#ffe08a,var(--brass) 55%,#d99b2b);box-shadow:0 5px 0 var(--brass-dark),0 10px 20px -6px rgba(0,0,0,.6);transition:transform .1s}
.play-big:active{transform:translateY(4px);box-shadow:0 1px 0 var(--brass-dark)}
.stakes{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.stakes .st{font-size:12px;font-weight:700;padding:3px 9px;border-radius:10px;background:rgba(0,0,0,.3);color:var(--muted)}
.stakes .st.win{color:var(--good)} .stakes .st.loss{color:var(--bad)}
/* ---------- The Library ---------- */
.learn-tabs{margin-top:-2px}
.lpath{position:relative;display:flex;flex-direction:column;align-items:center;gap:16px;padding:4px 0 18px}
.lp-hoot{display:flex;align-items:flex-end;gap:8px;align-self:stretch}
.lp-say{flex:1;background:var(--paper);color:var(--ink);border-radius:16px;border-bottom-left-radius:6px;padding:9px 12px;font-size:15px;box-shadow:0 3px 0 #d8c7a2}
.lp-chapter{align-self:stretch;display:flex;align-items:center;justify-content:space-between;margin:12px 0 4px;padding:8px 14px;border-radius:14px;
  background:linear-gradient(90deg,var(--wood),#5d3820);box-shadow:inset 0 1px 0 rgba(255,220,170,.25),0 3px 0 rgba(0,0,0,.3)}
.lp-chapter b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--brass-light)}
.lp-chapter small{font-weight:700;color:rgba(255,236,200,.8)}
.lp-node{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;transform:translateX(var(--x));padding:4px 0}
.lp-trail{position:absolute;left:0;top:0;pointer-events:none;z-index:0}
.lp-trail path{fill:none;stroke:rgba(247,239,221,.28);stroke-width:7;stroke-linecap:round;stroke-dasharray:1 14}
.lp-node,.lp-chapter,.lp-hoot{position:relative;z-index:1}
.lp-disc{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,#3a7a62,#25594a);color:var(--ivory);
  box-shadow:0 6px 0 #173c30,inset 0 2px 0 rgba(255,255,255,.18);transition:transform .12s}
.lp-disc img{width:46px;height:46px}
.lp-node:active .lp-disc{transform:translateY(4px);box-shadow:0 2px 0 #173c30}
.lp-node.done .lp-disc{background:linear-gradient(180deg,#ffe08a,var(--brass) 60%,#d99b2b);color:var(--ink);box-shadow:0 6px 0 var(--brass-dark),inset 0 2px 0 rgba(255,255,255,.5)}
.lp-node.next .lp-disc{background:linear-gradient(180deg,#fff4cf,#ffd76a);color:var(--ink);box-shadow:0 6px 0 var(--brass-dark),0 0 0 6px rgba(239,187,79,.25),0 0 26px rgba(255,210,110,.55);animation:pulseGo 1.8s ease-in-out infinite}
.lp-lab{display:flex;flex-direction:column;align-items:center;gap:1px}
.lp-lab b{font-size:14px;max-width:150px;text-align:center;line-height:1.15}
.lstars{display:flex;gap:1px}
.lstars i{color:rgba(0,0,0,.35);display:flex}
.lstars i.on{color:var(--brass)}
.course-cards{display:flex;flex-direction:column;gap:10px}
.course-card{display:flex;gap:12px;align-items:center;text-align:left;padding:14px;border-radius:var(--r);box-shadow:var(--press);transition:transform .1s}
.course-card:active{transform:translateY(3px)}
.course-card b{display:block;font-family:var(--display);font-weight:400;font-size:21px}
.course-card small{display:block;color:rgba(255,255,255,.75);font-size:13px;line-height:1.3}
.course-card .cc-meta{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:12px;font-weight:700;color:rgba(255,255,255,.8)}
.course-card .cc-ic .ic{width:54px;height:54px}
.course-card.c0{background:linear-gradient(150deg,#2f6b55,#1d4b3b)}
.course-card.c1{background:linear-gradient(150deg,#3c3466,#24204a)}
.course-card.c2{background:linear-gradient(150deg,#6b2a22,#3f1712)}
.course-card.world{background:linear-gradient(150deg,#8a5530,#5a3219)}
.course-card.world .cc-ic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:rgba(0,0,0,.25);color:var(--brass-light)}
@media (prefers-reduced-motion:reduce){.lp-node.next .lp-disc,.puz-hero .ph-go{animation:none}}
.lp-num{font-family:var(--display);font-weight:400;font-size:30px}
.course-head{display:flex;align-items:center;gap:12px}
.course-head h2{font-size:26px}
.course-head small{color:var(--muted)}
.course-intro p{margin:0 0 10px}
.wstats{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:13px;font-weight:700;color:#6b5a44}
.wstats span{display:inline-flex;align-items:center;gap:4px}
.whead .wstrip{margin-bottom:6px}
/* World Games hall */
.wtiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wtiles.small{grid-template-columns:1fr 1fr 1fr}
.wtile{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 10px 12px;border-radius:var(--r);text-align:center;box-shadow:var(--press);transition:transform .1s;
  background:linear-gradient(170deg,#2f6b55,#1d4b3b)}
.wtile:active{transform:translateY(3px)}
.wtile .wface{width:64px;height:64px;margin-bottom:4px;filter:drop-shadow(0 4px 3px rgba(0,0,0,.35))}
.wtile b{font-family:var(--display);font-weight:400;font-size:20px}
.wtile small{color:var(--muted);font-size:12px;min-height:1.2em}
.wtile .wt-prog{display:flex;align-items:center;gap:6px;width:100%;margin-top:6px;font-size:12px;font-weight:700;color:var(--brass-light)}
.wtile .wt-prog .qbar{flex:1}
.wtiles.small .wtile{padding:10px 6px}
.wtiles.small .wface{width:40px;height:40px}
.wtiles.small b{font-size:15px}
.wt-xiangqi{background:linear-gradient(170deg,#8a2f22,#5a1a12)}
.wt-shogi{background:linear-gradient(170deg,#7a5a2a,#4e3616)}
.wt-janggi{background:linear-gradient(170deg,#2a4f7a,#173352)}
.wt-makruk{background:linear-gradient(170deg,#6a3a7a,#41204e)}
.wt-sittuyin{background:linear-gradient(170deg,#2f6b55,#1a4537)}
.wt-shatranj{background:linear-gradient(170deg,#7a6a2a,#4e4216)}
.p2p-steps{display:flex;flex-direction:column;gap:6px;padding:4px 4px}
.p2p-step{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.p2p-step b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.25);color:var(--brass-light);font-family:var(--display);font-weight:400;flex:none}

/* 30-fx.css */
/* ---------- FX kit (src/fx.js): Hoot, particles, stars, chest, results, juice. Everything is kx- prefixed. ---------- */

/* ===== Professor Hoot ===== */
.kx-hoot{display:inline-block;position:relative;line-height:0;vertical-align:middle;flex:none}
.kx-hoot>svg{width:100%;height:100%;overflow:visible;display:block}
.kx-hoot svg *{transform-box:fill-box}
.kx-hoot.kx-boing{animation:kx-boing .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes kx-boing{0%{scale:.86}55%{scale:1.07}100%{scale:1}}
.kx-h-all,.kx-h-body{transform-origin:50% 100%}
.kx-h-shadow{transform-origin:50% 50%}
.kx-h-head{transform-origin:50% 85%;transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.kx-h-wl{transform-origin:82% 4%;transition:transform .42s cubic-bezier(.3,1.5,.5,1)}
.kx-h-wr{transform-origin:18% 4%;transition:transform .42s cubic-bezier(.3,1.5,.5,1)}
.kx-h-tl{transform-origin:100% 100%;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.kx-h-tr{transform-origin:0 100%;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.kx-h-eye{transform-origin:50% 50%;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.kx-h-pup{transform-origin:50% 50%;transition:transform .32s cubic-bezier(.3,1.3,.5,1)}
.kx-h-lid{transform-origin:50% 0;transform:scaleY(0);transition:transform .14s ease-out}
.kx-hoot.kx-blink .kx-h-lid{transform:scaleY(1);transition-duration:.06s}
.kx-h-brl,.kx-h-brr{transform-origin:50% 50%;transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.kx-h-eyes{transition:opacity .1s}
.kx-h-happy{opacity:0;transition:opacity .1s}
.kx-h-cheek{opacity:0;transition:opacity .3s}
.kx-h-jaw{transform-origin:50% 0;transition:transform .2s}
.kx-h-mouth{opacity:0;transform-origin:50% 0;transform:scale(.5);transition:opacity .15s,transform .2s}
.kx-h-tassel{transform-origin:50% 0}
.kx-h-tear{opacity:0;transform-origin:50% 0}
.kx-h-sp{opacity:0;transform-origin:50% 50%;transform:scale(.3);transition:opacity .2s,transform .3s cubic-bezier(.3,1.6,.5,1)}
.kx-h-dots circle{opacity:0;transform-origin:50% 50%}
.kx-h-wowl{opacity:0;transform-origin:50% 50%}

/* idle: breathing, glancing, a slow tassel sway (the default motion for every mood) */
.kx-h-body{animation:kx-breathe 3.4s ease-in-out infinite}
@keyframes kx-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.018,1.028)}}
.m-idle .kx-h-pup{animation:kx-glance 9s ease-in-out infinite}
@keyframes kx-glance{0%,38%,100%{transform:translate(0,0)}42%,54%{transform:translate(-2.6px,.6px)}58%,70%{transform:translate(2.6px,-.4px)}74%{transform:translate(0,0)}}
.m-idle .kx-h-tassel,.m-talk .kx-h-tassel,.m-wave .kx-h-tassel{animation:kx-tassel 3.6s ease-in-out infinite}
@keyframes kx-tassel{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}
.m-idle .kx-h-head{animation:kx-tilt 7s ease-in-out infinite}
@keyframes kx-tilt{0%,30%,100%{transform:rotate(0)}40%,60%{transform:rotate(-3deg)}70%{transform:rotate(1.5deg)}}

/* talk */
.m-talk .kx-h-head{animation:kx-bob .44s ease-in-out infinite alternate}
@keyframes kx-bob{from{transform:translateY(0) rotate(-1.6deg)}to{transform:translateY(-1.6px) rotate(1.6deg)}}
.m-talk .kx-h-jaw{animation:kx-jaw .22s ease-in-out infinite alternate}
.m-talk .kx-h-mouth{opacity:1;animation:kx-mouth .22s ease-in-out infinite alternate}
@keyframes kx-jaw{from{transform:translateY(0)}to{transform:translateY(3.2px)}}
@keyframes kx-mouth{from{transform:scale(.45)}to{transform:scale(.8)}}
.m-talk .kx-h-wr{transform:rotate(-14deg)}

/* happy: curved eyes, rosy cheeks, a small hop */
.m-happy .kx-h-eyes,.m-cheer .kx-h-eyes{opacity:0}
.m-happy .kx-h-happy,.m-cheer .kx-h-happy{opacity:1}
.m-happy .kx-h-cheek,.m-cheer .kx-h-cheek{opacity:.55}
.m-happy .kx-h-brl,.m-happy .kx-h-brr,.m-cheer .kx-h-brl,.m-cheer .kx-h-brr{transform:translateY(-2.5px)}
.m-happy .kx-h-jaw{transform:translateY(1.6px)}
.m-happy .kx-h-mouth{opacity:1;transform:scale(.62)}
.m-happy .kx-h-wl{transform:rotate(20deg)} .m-happy .kx-h-wr{transform:rotate(-20deg)}
.m-happy .kx-h-all{animation:kx-hop 1.25s infinite}
.m-happy .kx-h-body{animation:kx-hopsq 1.25s ease-in-out infinite}
.m-happy .kx-h-shadow{animation:kx-hopsh 1.25s infinite}
@keyframes kx-hop{0%,38%{transform:translateY(0);animation-timing-function:cubic-bezier(.2,.7,.4,1)}57%{transform:translateY(-9px);animation-timing-function:cubic-bezier(.6,0,.85,.45)}74%,100%{transform:translateY(0)}}
@keyframes kx-hopsq{0%,22%,100%{transform:scale(1)}36%{transform:scale(1.07,.9)}48%{transform:scale(.95,1.06)}74%{transform:scale(1.08,.9)}86%{transform:scale(.98,1.02)}}
@keyframes kx-hopsh{0%,38%,74%,100%{transform:scale(1);opacity:.24}57%{transform:scale(.72);opacity:.12}}

/* cheer: wings up and flapping, bouncing, sparkles */
.m-cheer .kx-h-jaw{transform:translateY(4px)}
.m-cheer .kx-h-mouth{opacity:1;transform:scale(.9)}
.m-cheer .kx-h-wl{transform:rotate(128deg);animation:kx-flapL .3s ease-in-out infinite alternate}
.m-cheer .kx-h-wr{transform:rotate(-128deg);animation:kx-flapR .3s ease-in-out infinite alternate}
@keyframes kx-flapL{from{transform:rotate(104deg)}to{transform:rotate(138deg)}}
@keyframes kx-flapR{from{transform:rotate(-104deg)}to{transform:rotate(-138deg)}}
.m-cheer .kx-h-all{animation:kx-bounce .6s infinite}
.m-cheer .kx-h-body{animation:kx-bsq .6s infinite}
.m-cheer .kx-h-shadow{animation:kx-bsh .6s infinite}
@keyframes kx-bounce{0%{transform:translateY(0);animation-timing-function:cubic-bezier(.2,.7,.4,1)}45%{transform:translateY(-8px);animation-timing-function:cubic-bezier(.6,0,.85,.45)}85%,100%{transform:translateY(0)}}
@keyframes kx-bsq{0%{transform:scale(1.08,.9)}20%{transform:scale(.96,1.05)}45%{transform:scale(1)}85%{transform:scale(1)}93%{transform:scale(1.08,.9)}100%{transform:scale(1.08,.9)}}
@keyframes kx-bsh{0%,85%,100%{transform:scale(1);opacity:.24}45%{transform:scale(.7);opacity:.12}}
.m-cheer .kx-h-sp{opacity:1;transform:scale(1);animation:kx-twinkle 1s ease-in-out infinite}
.m-cheer .kx-h-fx g:nth-child(2) .kx-h-sp{animation-delay:-.3s}
.m-cheer .kx-h-fx g:nth-child(3) .kx-h-sp{animation-delay:-.6s}
.m-cheer .kx-h-fx g:nth-child(4) .kx-h-sp{animation-delay:-.8s}
@keyframes kx-twinkle{0%,100%{transform:scale(.4) rotate(0);opacity:.2}50%{transform:scale(1.15) rotate(45deg);opacity:1}}

/* think: eyes up to the side, wing at the chin, tassel sway, thought bubbles */
.m-think .kx-h-pup{transform:translate(3px,-3.6px)}
.m-think .kx-h-brr{transform:translateY(-3.2px) rotate(-7deg)}
.m-think .kx-h-brl{transform:translateY(1.2px) rotate(7deg)}
.m-think .kx-h-wr{transform:rotate(70deg)}
.m-think .kx-h-head{transform:rotate(-5deg);animation:kx-ponder 2.8s ease-in-out infinite alternate}
@keyframes kx-ponder{from{transform:rotate(-6deg)}to{transform:rotate(-2deg) translateY(-.6px)}}
.m-think .kx-h-tassel{animation:kx-tassel 1.9s ease-in-out infinite}
.m-think .kx-h-dots circle{opacity:1;animation:kx-dot 2.4s ease-in-out infinite}
.m-think .kx-h-dots circle:nth-child(2){animation-delay:.25s}
.m-think .kx-h-dots circle:nth-child(3){animation-delay:.5s}
@keyframes kx-dot{0%{transform:scale(0);opacity:0}15%{transform:scale(1.15);opacity:1}25%,80%{transform:scale(1);opacity:1}100%{transform:scale(.6);opacity:0}}

/* sad: droopy lids, eyes down, smaller, a tear */
.m-sad .kx-h-pup{transform:translate(-.6px,3px)}
.m-sad .kx-h-eye:first-child .kx-h-lid{transform:rotate(-20deg) scaleY(.4)}
.m-sad .kx-h-eye:last-child .kx-h-lid{transform:rotate(20deg) scaleY(.4)}
.m-sad .kx-h-brl{transform:translateY(-1px) rotate(-20deg)}
.m-sad .kx-h-brr{transform:translateY(-1px) rotate(20deg)}
.m-sad .kx-h-head{transform:translateY(2.6px) rotate(4deg)}
.m-sad .kx-h-wl{transform:rotate(-7deg)} .m-sad .kx-h-wr{transform:rotate(7deg)}
.m-sad .kx-h-tl{transform:rotate(-28deg)} .m-sad .kx-h-tr{transform:rotate(28deg)}
.m-sad .kx-h-body{transform:scale(.96,.93);animation:kx-sigh 4s ease-in-out infinite}
@keyframes kx-sigh{0%,100%{transform:scale(.96,.93)}50%{transform:scale(.975,.95)}}
.m-sad .kx-h-tear{animation:kx-tear 3s ease-in infinite}
@keyframes kx-tear{0%,20%{opacity:0;transform:translateY(0) scale(.5)}30%{opacity:1;transform:translateY(0) scale(1)}70%{opacity:1;transform:translateY(9px)}85%,100%{opacity:0;transform:translateY(13px)}}

/* wow: eyes wide, feathers puff */
.m-wow .kx-h-eye{transform:scale(1.14)}
.m-wow .kx-h-pup{transform:scale(.76)}
.m-wow .kx-h-brl{transform:translateY(-4.5px) rotate(-6deg)}
.m-wow .kx-h-brr{transform:translateY(-4.5px) rotate(6deg)}
.m-wow .kx-h-jaw{transform:translateY(4.6px)}
.m-wow .kx-h-mouth{opacity:1;transform:scale(1)}
.m-wow .kx-h-tl{transform:scale(1.35) rotate(-12deg)} .m-wow .kx-h-tr{transform:scale(1.35) rotate(12deg)}
.m-wow .kx-h-wl{transform:rotate(34deg)} .m-wow .kx-h-wr{transform:rotate(-34deg)}
.m-wow .kx-h-body{transform:scale(1.05);animation:kx-puff .55s cubic-bezier(.3,1.7,.5,1) both}
@keyframes kx-puff{0%{transform:scale(1)}45%{transform:scale(1.11,1.09)}100%{transform:scale(1.05)}}
.m-wow .kx-h-wowl{opacity:1;animation:kx-wowl .9s ease-out infinite}
@keyframes kx-wowl{0%{transform:scale(.8);opacity:0}30%{opacity:1}100%{transform:scale(1.15);opacity:0}}

/* wave */
.m-wave .kx-h-wr{transform:rotate(-132deg);animation:kx-wave .36s ease-in-out infinite alternate}
@keyframes kx-wave{from{transform:rotate(-108deg)}to{transform:rotate(-150deg)}}
.m-wave .kx-h-head{transform:rotate(4deg)}
.m-wave .kx-h-cheek{opacity:.4}
.m-wave .kx-h-jaw{transform:translateY(2px)}
.m-wave .kx-h-mouth{opacity:1;transform:scale(.6)}
.m-wave .kx-h-brl,.m-wave .kx-h-brr{transform:translateY(-2px)}

/* ===== Particles + floating text ===== */
.kx-canvas{position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none;z-index:465;display:none}
.kx-float{position:fixed;z-index:470;pointer-events:none;white-space:nowrap;font-family:var(--display);font-size:28px;letter-spacing:.5px;line-height:1;
  color:var(--brass-light);text-shadow:0 2px 0 var(--brass-dark),0 3px 0 #6b4a10,0 0 2px #3a2408,0 8px 16px rgba(0,0,0,.45);
  transform:translate(-50%,-50%);animation:kx-float 1.25s cubic-bezier(.2,.8,.3,1) forwards}
.kx-float.xp{color:#fff3c4}
.kx-float.good{color:var(--good);text-shadow:0 2px 0 #3f7d48,0 3px 0 #23502b,0 8px 16px rgba(0,0,0,.45)}
.kx-float.bad{color:var(--bad);text-shadow:0 2px 0 #a8432f,0 3px 0 #6e2618,0 8px 16px rgba(0,0,0,.45)}
.kx-float.big{font-size:40px}
@keyframes kx-float{0%{opacity:0;transform:translate(-50%,-30%) scale(.4)}14%{opacity:1;transform:translate(-50%,-70%) scale(1.22)}26%{transform:translate(-50%,-80%) scale(1)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) translateY(-78px) scale(.92)}}

/* ===== Star rating ===== */
.kx-stars{display:inline-flex;align-items:flex-end;justify-content:center;gap:calc(var(--s) * .08);line-height:0;padding-top:calc(var(--s) * .2)}
.kx-star{position:relative;width:var(--s);height:var(--s);display:block}
.kx-star1{width:calc(var(--s) * 1.28);height:calc(var(--s) * 1.28);transform:translateY(calc(var(--s) * -.2))}
.kx-star svg{width:100%;height:100%;overflow:visible;display:block}
.kx-star .kx-star-gold{transform-box:fill-box;transform-origin:50% 55%;transform:scale(0);opacity:0}
.kx-star.on .kx-star-gold{transform:scale(1);opacity:1;filter:drop-shadow(0 0 6px rgba(255,214,102,.55))}
.kx-star.pop .kx-star-gold{animation:kx-starpop .62s cubic-bezier(.2,.9,.3,1) both}
.kx-star::after{content:'';position:absolute;inset:-25%;border-radius:50%;border:3px solid rgba(255,236,170,.9);opacity:0;pointer-events:none}
.kx-star.pop::after{animation:kx-ring .5s ease-out .08s}
@keyframes kx-starpop{0%{transform:scale(0) rotate(-50deg);opacity:0}40%{transform:scale(1.42) rotate(10deg);opacity:1}62%{transform:scale(.88) rotate(-4deg)}80%{transform:scale(1.07) rotate(1deg)}100%{transform:scale(1) rotate(0)}}
@keyframes kx-ring{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.3);opacity:0}}

/* ===== Shared overlay ===== */
.kx-ov{position:fixed;inset:0;z-index:360;display:flex;flex-direction:column;align-items:center;box-sizing:border-box;overflow:hidden;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 14px);
  color:var(--ivory);font-family:var(--body);-webkit-user-select:none;user-select:none;touch-action:manipulation;animation:kx-fadein .26s ease-out both}
.kx-ov.kx-out{animation:kx-fadeout .26s ease-in both;pointer-events:none}
@keyframes kx-fadein{from{opacity:0}to{opacity:1}}
@keyframes kx-fadeout{from{opacity:1}to{opacity:0}}
.kx-ov-bg{position:absolute;inset:0;z-index:-1;background:var(--felt-tex,none),radial-gradient(110% 70% at 50% 26%,#2f6e56 0%,#1b4434 44%,#0c2018 100%)}
.kx-ov-bg::after{content:'';position:absolute;inset:0;background:radial-gradient(140% 100% at 50% 40%,transparent 55%,rgba(0,0,0,.45) 100%)}
.kx-title{margin:0;font-family:var(--display);font-weight:400;text-align:center;line-height:1.02;letter-spacing:.6px;font-size:clamp(32px,10.5vw,48px);
  color:#ffe9a8;text-shadow:0 2px 0 #c8902a,0 4px 0 #8a5a12,0 7px 0 rgba(0,0,0,.22),0 12px 24px rgba(0,0,0,.4);text-wrap:balance}
.kx-word{display:inline-block;white-space:nowrap}
.kx-ch{display:inline-block;animation:kx-chpop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes kx-chpop{0%{opacity:0;transform:translateY(22px) scale(.3) rotate(-10deg)}60%{opacity:1}100%{opacity:1;transform:none}}
.kx-rays{position:absolute;left:50%;top:50%;width:var(--rs,620px);height:var(--rs,620px);margin:calc(var(--rs,620px) / -2) 0 0 calc(var(--rs,620px) / -2);border-radius:50%;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,rgba(255,227,154,.2) 0deg 8deg,rgba(255,227,154,0) 8deg 22.5deg);
  -webkit-mask:radial-gradient(closest-side,#000 8%,rgba(0,0,0,.55) 45%,transparent 100%);mask:radial-gradient(closest-side,#000 8%,rgba(0,0,0,.55) 45%,transparent 100%);
  animation:kx-spin 16s linear infinite,kx-raysin .6s cubic-bezier(.2,1.2,.4,1) both}
@keyframes kx-spin{to{rotate:360deg}}
@keyframes kx-raysin{from{scale:0;opacity:0}to{scale:1;opacity:1}}

.kx-btn{appearance:none;-webkit-appearance:none;border:0;cursor:pointer;position:relative;overflow:hidden;min-height:56px;padding:12px 18px;border-radius:18px;
  font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:.4px;color:var(--ivory);
  background:linear-gradient(180deg,#30705a,#235441);box-shadow:0 5px 0 #0e281e,inset 0 1.5px 0 rgba(255,255,255,.14),0 12px 20px -8px rgba(0,0,0,.55);
  transition:transform .1s,box-shadow .1s,filter .15s}
.kx-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #0e281e,inset 0 1.5px 0 rgba(255,255,255,.14)}
.kx-btn:focus-visible{outline:3px solid var(--brass-light);outline-offset:3px}
.kx-btn.primary{color:#3a2408;background:linear-gradient(180deg,#ffe08a,var(--brass) 55%,#d99b2b);box-shadow:0 5px 0 var(--brass-dark),inset 0 2px 0 rgba(255,255,255,.55),0 12px 22px -8px rgba(0,0,0,.6)}
.kx-btn.primary:active{box-shadow:0 1px 0 var(--brass-dark),inset 0 2px 0 rgba(255,255,255,.45)}
.kx-btn.primary::after{content:'';position:absolute;top:0;bottom:0;left:-60%;width:40%;transform:skewX(-20deg);pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:kx-sheen 3.2s ease-in-out 1.4s infinite}
@keyframes kx-sheen{0%{left:-60%}28%,100%{left:130%}}

/* ===== Chest reveal ===== */
.kx-chest-ov{z-index:370;cursor:pointer}
.kx-ch-head{position:relative;z-index:2;width:100%;max-width:520px;padding-top:6px}
.kx-ch-stage{position:absolute;left:50%;top:50%;width:min(64vw,260px);aspect-ratio:200/172;--dy:0px;
  transform:translate(-50%,-50%);transition:transform .6s cubic-bezier(.3,1.25,.45,1),width .6s cubic-bezier(.3,1.25,.45,1)}
.kx-chest-ov.open .kx-ch-stage{transform:translate(-50%,-50%) translateY(var(--dy)) scale(.8)}
.kx-chest{position:absolute;inset:0;transform-origin:50% 92%}
.kx-chest svg{width:100%;height:100%;overflow:visible;display:block;filter:drop-shadow(0 10px 14px rgba(0,0,0,.35))}
.kx-ch-shadow{position:absolute;left:12%;right:12%;bottom:-3%;height:12%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.5),transparent);transform-origin:50% 50%}
.kx-ch-glow{position:absolute;left:50%;top:48%;width:170%;aspect-ratio:1;transform:translate(-50%,-50%) scale(.6);border-radius:50%;opacity:.35;
  background:radial-gradient(closest-side,rgba(255,227,154,.55),rgba(255,207,63,.12) 55%,transparent);transition:transform .5s cubic-bezier(.2,1.3,.4,1),opacity .4s}
.kx-ch-rays{--rs:min(190vw,900px);opacity:0;animation:kx-spin 14s linear infinite}
.kx-chest-ov.open .kx-ch-rays{opacity:1;transition:opacity .3s;animation:kx-spin 14s linear infinite,kx-raysin .7s cubic-bezier(.2,1.3,.4,1) both}
.kx-chest-ov.open .kx-ch-glow{transform:translate(-50%,-50%) scale(1.1);opacity:1}
.kx-ch-open,.kx-ch-mouth{opacity:0}
.kx-chest .kx-ch-open{transform-box:fill-box;transform-origin:50% 100%}
.kx-chest .kx-ch-lid{transform-box:fill-box;transform-origin:50% 100%}
.kx-chest-ov.dropping .kx-chest{animation:kx-drop .72s both}
.kx-chest-ov.dropping .kx-ch-shadow{animation:kx-dropsh .72s both}
@keyframes kx-drop{0%{transform:translateY(-85vh) scale(.9,1.12);animation-timing-function:cubic-bezier(.55,0,.9,.5)}52%{transform:translateY(0) scale(1.16,.82);animation-timing-function:cubic-bezier(.2,.7,.4,1)}70%{transform:translateY(-22px) scale(.95,1.06);animation-timing-function:cubic-bezier(.6,0,.8,.5)}84%{transform:translateY(0) scale(1.06,.95)}100%{transform:none}}
@keyframes kx-dropsh{0%{transform:scale(.2);opacity:0}52%{transform:scale(1.15);opacity:1}70%{transform:scale(.85)}100%{transform:none}}
.kx-chest-ov.landed:not(.open):not(.opening) .kx-chest{animation:kx-wiggle 1.25s ease-in-out .15s infinite}
.kx-chest-ov.landed:not(.open):not(.opening) .kx-ch-lid{animation:kx-lidpeek 1.25s ease-in-out .15s infinite}
@keyframes kx-wiggle{0%,52%,100%{transform:none}58%{transform:rotate(-5deg) scale(1.03)}66%{transform:rotate(5deg) scale(1.04)}74%{transform:rotate(-4deg)}82%{transform:rotate(2.5deg)}90%{transform:rotate(-1deg)}}
@keyframes kx-lidpeek{0%,55%,92%,100%{transform:none}64%,82%{transform:translateY(-5px)}}
.kx-chest-ov.opening .kx-chest{transform:scale(1.12,.86);transition:transform .17s cubic-bezier(.4,0,.6,1)}
.kx-chest-ov.open .kx-chest{animation:kx-openpop .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes kx-openpop{0%{transform:scale(1.12,.86)}40%{transform:scale(.94,1.1)}100%{transform:none}}
.kx-chest-ov.open .kx-ch-lid{animation:kx-lidoff .36s cubic-bezier(.3,.6,.5,1) forwards}
@keyframes kx-lidoff{0%{transform:none;opacity:1}100%{transform:translateY(-70px) rotate(-14deg) scale(.9);opacity:0}}
.kx-chest-ov.open .kx-ch-open{animation:kx-lidopen .5s cubic-bezier(.2,1.5,.4,1) .05s both}
@keyframes kx-lidopen{0%{transform:scaleY(.15);opacity:0}30%{opacity:1}100%{transform:none;opacity:1}}
.kx-chest-ov.open .kx-ch-mouth{opacity:1;transition:opacity .15s}
.kx-chest.kx-burp{animation:kx-burp .3s cubic-bezier(.3,1.5,.5,1)!important}
@keyframes kx-burp{0%{transform:none}35%{transform:scale(1.08,.9)}100%{transform:none}}
.kx-ch-cards{position:relative;z-index:3;flex:1 1 auto;box-sizing:border-box;transition:padding .5s cubic-bezier(.3,1.2,.45,1);min-height:0;width:100%;max-width:520px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:12px;padding:10px 0 0}
.kx-card{position:relative;width:104px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 8px 10px;border-radius:18px;text-align:center;opacity:0;overflow:hidden;
  background:linear-gradient(180deg,#fffaf0,var(--paper) 60%,#efe1c0);color:var(--ink);
  box-shadow:0 0 0 2.5px var(--brass),0 0 0 4.5px #8a5a12,0 6px 0 #6b4a10,0 16px 28px -6px rgba(0,0,0,.6),0 0 40px rgba(255,214,102,.35);
  transition:transform .4s cubic-bezier(.5,0,.8,.4),opacity .3s}
.kx-card.in{opacity:1}
.kx-card.away{transform:translateY(-60px) scale(.7);opacity:0}
.kx-card::after{content:'';position:absolute;top:-20%;bottom:-20%;left:-80%;width:50%;transform:skewX(-18deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);pointer-events:none}
.kx-card.shine::after{animation:kx-cardshine .7s ease-out}
@keyframes kx-cardshine{from{left:-80%}to{left:140%}}
.kx-card-art{width:100%;aspect-ratio:1;border-radius:13px;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(90% 80% at 50% 30%,#2f6e56,#1b4434 70%,#14362a);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.12)}
.kx-card-art>*{max-width:84%;max-height:84%}
.kx-card-art img,.kx-card-art svg{width:84%;height:84%;object-fit:contain;display:block}
.kx-art-in{width:84%;height:84%;display:grid;place-items:center}
.kx-art-in>svg{width:100%;height:100%}
.kx-card-label{font-family:var(--display);font-weight:400;font-size:16px;line-height:1.05;margin-top:4px;color:var(--ink)}
.kx-card-sub{font-size:12px;line-height:1.15;color:#6b5a44;font-weight:700}
.kx-ch-cards.one .kx-card{width:min(176px,48vw)}
.kx-ch-cards.one .kx-card-label{font-size:21px}
.kx-ch-cards.one .kx-card-sub{font-size:14px}

.kx-ch-cards.four{max-width:230px}
.kx-ch-cards.many .kx-card{width:92px;padding:6px 6px 8px}
.kx-ch-foot{position:relative;z-index:4;width:100%;max-width:420px;min-height:60px;display:grid;place-items:center;margin-top:auto}
.kx-ch-foot>*{grid-area:1/1}
.kx-ch-hint{position:absolute;left:0;right:0;top:calc(100% + 26px);text-align:center;white-space:nowrap;font-family:var(--display);font-size:20px;color:var(--brass-light);text-shadow:0 2px 0 rgba(0,0,0,.4);opacity:0;transition:opacity .3s}
.kx-chest-ov.landed:not(.open):not(.opening) .kx-ch-hint{opacity:1;animation:kx-hint 1.25s ease-in-out .15s infinite}
@keyframes kx-hint{0%,100%{transform:none}50%{transform:translateY(-4px) scale(1.04)}}
.kx-ch-foot .kx-btn{width:100%;opacity:0;transform:translateY(20px) scale(.9);pointer-events:none;transition:opacity .25s,transform .45s cubic-bezier(.2,1.5,.4,1)}
.kx-chest-ov.done .kx-ch-foot .kx-btn{opacity:1;transform:none;pointer-events:auto}
.kx-chest-ov.done{cursor:default}
@media (max-height:700px){.kx-card{width:94px}.kx-ch-cards.many .kx-card{width:80px}.kx-card-label{font-size:14px}.kx-ch-cards.one .kx-card{width:min(150px,44vw)}}

/* ===== Results screen ===== */
.kx-res{padding-left:0;padding-right:0}
.kx-res-body{position:relative;flex:1 1 auto;min-height:0;width:100%;max-width:520px;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:clamp(6px,1.4vh,14px);padding:4px 18px max(14px,4vh);scrollbar-width:none}
.kx-res-body::-webkit-scrollbar{display:none}
.kx-res-hero{position:relative;flex:none;display:grid;place-items:center;padding-top:4px;animation:kx-heroin .7s cubic-bezier(.2,1.4,.4,1) .06s both}
@keyframes kx-heroin{0%{opacity:0;transform:translateY(-40px) scale(.5)}100%{opacity:1;transform:none}}

.kx-meh .kx-res-glow{background:radial-gradient(closest-side,rgba(156,207,255,.16),transparent)}

.kx-res .kx-title{position:relative;z-index:1}
.kx-meh .kx-title{color:var(--ivory);text-shadow:0 2px 0 #8d8270,0 4px 0 #4a4234,0 7px 0 rgba(0,0,0,.2),0 12px 24px rgba(0,0,0,.4)}
.kx-res-sub{position:relative;text-align:center;font-size:17px;line-height:1.35;color:var(--muted,rgba(247,239,221,.75));max-width:360px;animation:kx-rise .45s cubic-bezier(.2,1.2,.4,1) .45s both;margin-top:-2px}
@keyframes kx-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.kx-res-stars{flex:none;margin:-2px 0 2px}
.kx-res-stats{width:100%;display:flex;gap:8px;justify-content:center}
.kx-stat{flex:1 1 0;min-width:0;max-width:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 6px 9px;border-radius:16px;
  background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03));box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 0 0 1px rgba(247,239,221,.08),0 4px 0 rgba(0,0,0,.22);
  animation:kx-statin .5s cubic-bezier(.2,1.5,.4,1) both}
@keyframes kx-statin{from{opacity:0;transform:translateY(18px) scale(.8)}to{opacity:1;transform:none}}
.kx-stat-v{display:block;font-family:var(--display);font-weight:400;font-size:clamp(22px,6.6vw,28px);line-height:1.05;color:var(--paper);font-variant-numeric:tabular-nums;white-space:nowrap}
.kx-stat-l{display:block;font-size:12.5px;font-weight:700;letter-spacing:.3px;color:var(--muted,rgba(247,239,221,.7));text-align:center;line-height:1.15;margin-top:2px}
.kx-res-stats.many .kx-stat-v{font-size:clamp(19px,5.6vw,24px)}
.kx-popk{animation:kx-popk .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes kx-popk{0%{scale:1}35%{scale:1.22}100%{scale:1}}
.kx-xp{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:18px;
  background:linear-gradient(180deg,rgba(0,0,0,.22),rgba(0,0,0,.14));box-shadow:inset 0 0 0 1px rgba(247,239,221,.08),inset 0 2px 6px rgba(0,0,0,.25);
  animation:kx-statin .5s cubic-bezier(.2,1.4,.4,1) both}
.kx-xp-lvl{flex:none;width:52px;height:52px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;color:#3a2408;
  background:radial-gradient(circle at 35% 30%,#fff3c4,var(--brass) 55%,#c68a26);box-shadow:0 0 0 2.5px #8a5a12,0 4px 0 #6b4a10,inset 0 -3px 0 rgba(0,0,0,.15)}
.kx-xp-lvl small{font-size:9.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;opacity:.8}
.kx-xp-lvl b{font-family:var(--display);font-weight:400;font-size:24px}
.kx-xp-main{flex:1;min-width:0}
.kx-xp-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;gap:8px}
.kx-xp-gain{font-family:var(--display);font-size:19px;color:var(--brass-light);text-shadow:0 2px 0 rgba(0,0,0,.35);display:inline-block}
.kx-xp-cnt{font-size:13px;font-weight:700;color:var(--muted,rgba(247,239,221,.7));font-variant-numeric:tabular-nums}
.kx-xp-bar{position:relative;height:18px;border-radius:10px;background:rgba(0,0,0,.4);box-shadow:inset 0 2px 3px rgba(0,0,0,.4),0 1px 0 rgba(255,255,255,.08);overflow:hidden}
.kx-xp-fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:10px;min-width:0;
  background:linear-gradient(180deg,#fff0b0,var(--brass) 50%,#d08f26);box-shadow:inset 0 -2px 0 rgba(0,0,0,.15),0 0 12px rgba(255,214,102,.6)}
.kx-xp-fill::after{content:'';position:absolute;right:0;top:0;bottom:0;width:14px;border-radius:10px;background:radial-gradient(closest-side,#fff,rgba(255,255,255,0));opacity:.85}
.kx-xp-fill.noanim{transition:none}
.kx-xp-gloss{position:absolute;left:4px;right:4px;top:3px;height:4px;border-radius:3px;background:rgba(255,255,255,.28);pointer-events:none}
.kx-xp-bar.flash{animation:kx-flash .7s ease-out}
.kx-xp-bar.flash .kx-xp-fill{background:linear-gradient(180deg,#fff,#fff3c4)}
@keyframes kx-flash{0%{box-shadow:0 0 0 0 rgba(255,236,170,.9)}30%{box-shadow:0 0 0 6px rgba(255,236,170,.6),0 0 30px rgba(255,214,102,.9)}100%{box-shadow:0 0 0 12px rgba(255,236,170,0)}}
.kx-res-btns{flex:none;width:100%;max-width:520px;display:flex;gap:10px;padding:10px 16px 0}
.kx-res-btns .kx-btn{flex:1 1 0;min-width:0;animation:kx-btnin .5s cubic-bezier(.2,1.5,.4,1) both}
.kx-res-btns .kx-btn.primary{flex:1.5 1 0}
@keyframes kx-btnin{from{opacity:0;transform:translateY(30px) scale(.9)}to{opacity:1;transform:none}}
.kx-lvlup{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:12vh;pointer-events:none;
  background:radial-gradient(70% 45% at 50% 44%,rgba(6,18,13,.72),rgba(6,18,13,.35) 70%,rgba(6,18,13,0));animation:kx-fadein .25s ease-out both}
.kx-lvlup>*{animation:kx-lvlin .6s cubic-bezier(.2,1.5,.4,1) both}
.kx-lvlup>.kx-lvlup-num{animation-delay:.15s}
.kx-lvlup.out{animation:kx-fadeout .4s ease-in both}
.kx-lvlup.out>*{animation:kx-lvlout .4s cubic-bezier(.5,0,.8,.4) both}
@keyframes kx-lvlin{0%{opacity:0;transform:scale(.2) rotate(-10deg)}60%{opacity:1;transform:scale(1.12) rotate(2deg)}100%{opacity:1;transform:none}}
@keyframes kx-lvlout{to{opacity:0;transform:translateY(-40px) scale(.8)}}
.kx-lvlup-rays{--rs:560px;top:44%;animation:kx-spin 10s linear infinite,kx-raysin .6s cubic-bezier(.2,1.2,.4,1) both!important}
.kx-lvlup-rib{position:relative;padding:10px 34px 12px;font-family:var(--display);font-size:clamp(34px,11vw,48px);line-height:1;color:#3a2408;letter-spacing:.6px;
  background:linear-gradient(180deg,#fff0b0,var(--brass) 52%,#d08f26);border-radius:10px;
  box-shadow:0 0 0 3px #8a5a12,0 6px 0 #6b4a10,0 18px 30px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.6);transform:rotate(-3deg)}
.kx-lvlup-rib span{display:block;text-shadow:0 2px 0 rgba(255,255,255,.5)}
.kx-lvlup-rib::before,.kx-lvlup-rib::after{content:'';position:absolute;top:14px;width:30px;height:100%;z-index:-1;background:#b97d20;box-shadow:0 0 0 3px #8a5a12}
.kx-lvlup-rib::before{left:-22px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,30% 50%)}
.kx-lvlup-rib::after{right:-22px;clip-path:polygon(0 0,100% 0,70% 50%,100% 100%,0 100%)}
.kx-lvlup-num{margin-top:12px;padding:5px 16px;border-radius:999px;background:var(--ink);color:var(--brass-light);font-family:var(--display);font-size:20px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
@media (max-height:700px){.kx-res-body{gap:6px}.kx-res-sub{font-size:15px}.kx-xp{padding:8px 10px}.kx-xp-lvl{width:46px;height:46px}.kx-btn{min-height:52px;font-size:19px}.kx-stat{padding:8px 4px 7px}}

/* ===== Juice ===== */
.kx-shake{animation:kx-shake .44s cubic-bezier(.36,.07,.19,.97)}
@keyframes kx-shake{10%,90%{translate:-1px 0}20%,80%{translate:3px 0}30%,50%,70%{translate:-6px 0}40%,60%{translate:6px 0}}
.kx-pop{animation:kx-pop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes kx-pop{0%{scale:1}30%{scale:1.18}60%{scale:.96}100%{scale:1}}
.kx-pulse{animation:kx-pulse .6s ease-in-out 2}
@keyframes kx-pulse{0%,100%{scale:1;filter:none}50%{scale:1.06;filter:brightness(1.18) drop-shadow(0 0 10px rgba(255,214,102,.7))}}

/* ===== Screen wipe ===== */
.kx-wipe{position:fixed;inset:0;z-index:480;pointer-events:none;display:grid;place-items:center;clip-path:circle(0% at 50% 50%);
  background:var(--felt-tex,none),radial-gradient(80% 60% at 50% 50%,#2f6e56,#1b4434 55%,#0c2018)}
.kx-wipe-medal{width:min(42vw,170px);aspect-ratio:1;filter:drop-shadow(0 12px 20px rgba(0,0,0,.5))}
.kx-wipe-medal svg{width:100%;height:100%;display:block}

/* ===== Reduced motion (OS setting or the app's animations switch) ===== */
.kx-rm .kx-hoot svg *,.kx-rm .kx-hoot{animation:none!important}
.kx-rm .kx-rays{animation:none!important;opacity:.8}
.kx-rm .kx-ov,.kx-rm .kx-ov *{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.01ms!important}
.kx-rm .kx-ov.kx-out{animation:kx-fadeout .12s both!important}
.kx-rm .kx-float{animation:kx-fadeonly 1.1s ease-out forwards}
@keyframes kx-fadeonly{0%{opacity:0}15%,70%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.kx-hoot svg *,.kx-rays{animation:none!important}}

/* 40-review.css */
/* ---------- Game Review: one screen, summary sheet, stepper, end card ---------- */
.rv .fs-right .fs-back{width:44px}
/* Hoot's bubble keeps one fixed height while stepping so the board never jumps; long text scrolls inside it */
.rv.rv-m-step .rv-say{max-height:100%;min-height:0;align-items:flex-end}
.rv.rv-m-step .rv-say .txt{max-height:100%;box-sizing:border-box;overscroll-behavior:contain}
.rv .rv-say .txt{font-size:15.5px;line-height:1.4;padding:9px 12px}
.rv .rv-say .who{align-self:flex-end}
.rv .rv-say .txt.more{-webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 26px),rgba(0,0,0,.25));mask-image:linear-gradient(180deg,#000 calc(100% - 26px),rgba(0,0,0,.25))}
.rv-mh{display:flex;align-items:center;gap:7px;margin-bottom:4px;min-height:24px}
.rv-mh b{font-family:var(--display);font-weight:400;font-size:18px;letter-spacing:.3px;color:var(--ink)!important;white-space:nowrap}
.rv-cl{font-weight:700;font-size:13px;color:#7a6a55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rv-ev{margin-left:auto;flex:none;font:700 12.5px/1 system-ui,sans-serif;font-variant-numeric:tabular-nums;padding:5px 8px;border-radius:8px;background:#fff;color:#2b2730;box-shadow:inset 0 0 0 1.5px #d8c7a2}
.rv-ev.neg{background:#2b2730;color:#f3efe4;box-shadow:none}
.rv-body{color:var(--ink)}
/* summary + end card hide the strip so the sheet gets the room; the board waits, frosted, behind the sheet */
.rv .fs-stage>.board-wrap{transition:filter .35s,transform .35s,opacity .35s}
.rv.rv-m-summary .fs-stage>.board-wrap,.rv.rv-m-end .fs-stage>.board-wrap{filter:blur(4px) saturate(.6) brightness(.6);transform:scale(.94);opacity:0}
/* while stepping the board takes the full width; Hoot's bubble gets whatever height is left above it */
.rv.rv-m-step .fs-above{flex:1 1 0;min-height:96px;justify-content:flex-end}
.rv.rv-m-step .fs-stage{flex:0 1 auto;height:calc(min(100vw,560px) - 6px);min-height:200px}
.rv.rv-m-summary .fs-below,.rv.rv-m-end .fs-below{display:none}

/* ---------- analysis in progress ---------- */
.rv-scan{position:absolute;inset:0;z-index:40;pointer-events:none;border-radius:4px;overflow:hidden}
.rv-scan::after{content:'';position:absolute;left:0;right:0;height:28%;top:-30%;
  background:linear-gradient(180deg,transparent,rgba(255,227,154,.28) 70%,rgba(255,227,154,.55) 96%,transparent);animation:rvScan 1.8s cubic-bezier(.45,0,.55,1) infinite}
@keyframes rvScan{to{top:102%}}
.rv-busy .board-wrap .pieces{filter:saturate(.85)}
.rv-prog{background:rgba(0,0,0,.22);border-radius:16px;padding:10px 14px 9px;display:flex;flex-direction:column;gap:7px;box-shadow:inset 0 0 0 1px rgba(247,239,221,.06)}
.rv-prog-top{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:15px}
.rv-prog-top b{font-variant-numeric:tabular-nums}
.rv-pct{font-family:var(--display);font-weight:400;font-size:20px;color:var(--brass-light)}
.rv-prog-bar{height:10px;border-radius:6px;background:rgba(0,0,0,.35);overflow:hidden}
.rv-prog-bar>div{height:100%;width:0;border-radius:6px;transition:width .4s cubic-bezier(.2,.9,.3,1);
  background:linear-gradient(90deg,var(--brass),var(--brass-light),var(--brass));background-size:200% 100%;animation:rvShine 1.4s linear infinite}
@keyframes rvShine{to{background-position:-200% 0}}
.rv-prog small{color:var(--muted);font-size:12.5px;font-weight:700}

/* ---------- sheets over the board ---------- */
.rv-sheet{position:absolute;inset:0;margin:0 0 auto;height:fit-content;max-height:100%;box-sizing:border-box;z-index:60;display:flex;flex-direction:column;gap:9px;padding:12px;border-radius:22px;overflow:auto;overscroll-behavior:contain;
  background:linear-gradient(180deg,rgba(36,84,65,.9),rgba(22,56,43,.94));box-shadow:inset 0 0 0 1px rgba(247,239,221,.09),0 18px 40px -12px rgba(0,0,0,.6);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);animation:rvSheetIn .38s cubic-bezier(.2,1.1,.3,1);scrollbar-width:none}
.rv-sheet::-webkit-scrollbar{display:none}
.rv-sheet.out{animation:rvSheetOut .3s ease-in forwards;pointer-events:none}
@keyframes rvSheetIn{from{opacity:0;transform:translateY(26px) scale(.97)}}
@keyframes rvSheetOut{to{opacity:0;transform:translateY(40px) scale(.96)}}
.rv-lbl{font-size:11.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}

/* accuracy cards: white player's card is ivory, black player's is dark */
.rv-accs{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:none}
.rv-acc{position:relative;border-radius:18px;padding:10px 10px 8px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:7px;row-gap:2px;align-items:center;min-width:0}
.rv-acc.w{background:linear-gradient(180deg,#fffaf0,#f1e6cc);color:var(--ink);box-shadow:0 3px 0 #cdb98f}
.rv-acc.b{background:linear-gradient(180deg,#34303a,#24212a);color:var(--ivory);box-shadow:0 3px 0 #111}
.rv-acc.mine{outline:3px solid var(--brass);outline-offset:-1px}
.rv-acc.mine::after{content:'YOU';position:absolute;top:-7px;right:10px;font:800 10px/1 system-ui,sans-serif;letter-spacing:1px;padding:3px 6px;border-radius:6px;background:var(--brass);color:#3a2408}
.rv-pc{width:30px;height:30px;filter:drop-shadow(0 2px 1px rgba(0,0,0,.3))}
.rv-accn{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.rv-accn span{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv-accn small{font-size:11.5px;font-weight:700;opacity:.65}
.rv-accv{grid-column:1/3;display:flex;align-items:baseline;justify-content:center;gap:1px}
.rv-accv .accv{font-family:var(--display);font-weight:400;font-size:36px;line-height:1.05;font-variant-numeric:tabular-nums}
.rv-accv i{font-style:normal;font-family:var(--display);font-size:18px;opacity:.6}

.rv-open{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:14px;background:rgba(0,0,0,.2);flex:none}
.rv-open .icn{color:var(--brass-light);flex:none}
.rv-open span{font-family:var(--display);font-size:17px;letter-spacing:.3px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv-open small{color:var(--muted);font-weight:700;font-size:12.5px;flex:none}

.rv-counts{display:grid;grid-template-columns:1fr 1fr;gap:5px;flex:none}
.rv-cnt{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:12px;background:rgba(0,0,0,.18);min-width:0}
.rv-cnt .rv-cn{flex:1;min-width:0;font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv-cnt b{flex:none;min-width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.rv-cnt b.w{background:#f7efdd;color:var(--ink)}
.rv-cnt b.b{background:#2b2730;color:var(--ivory);box-shadow:inset 0 0 0 1px rgba(247,239,221,.15)}
.rv-cnt b.z{opacity:.32}
.rv-keys{display:flex;flex-direction:column;gap:6px;flex:none}
.rv-chips{display:flex;flex-wrap:wrap;gap:6px}
.rv-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px 4px 5px;border-radius:999px;background:var(--card2,rgba(255,255,255,.08));box-shadow:0 3px 0 rgba(0,0,0,.28);font-size:14px;transition:transform .1s}
.rv-chip:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.rv-chip b{font-weight:800}

/* ---------- below the board: thin eval graph + one-line move strip ---------- */
.rv-graph{position:relative;height:30px;border-radius:9px;background:#2b2730;overflow:hidden;cursor:pointer;touch-action:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.4);flex:none}
.rv-graph svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.rv-graph.rv-flow{height:52px;border-radius:12px}
.rv-gm{position:absolute;width:7px;height:7px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 1.5px #1c1a20;pointer-events:none}
.rv-gcur{position:absolute;top:0;bottom:0;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--brass);box-shadow:0 0 8px var(--brass);transition:left .25s cubic-bezier(.2,.9,.3,1);pointer-events:none}
.rv-strip{display:flex;gap:4px;overflow-x:auto;overflow-y:hidden;flex:none;scrollbar-width:none;padding:2px 0 3px;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 18px,#000 calc(100% - 18px),transparent);mask-image:linear-gradient(90deg,transparent,#000 18px,#000 calc(100% - 18px),transparent)}
.rv-strip::-webkit-scrollbar{display:none}
.rv-strip .m{flex:none;display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 10px;border-radius:10px;background:rgba(0,0,0,.2);font-weight:700;font-size:14px;color:var(--text);white-space:nowrap;transition:background .15s,color .15s}
.rv-strip .m:first-child{margin-left:14px} .rv-strip .m:last-child{margin-right:14px}
.rv-strip .m small{color:var(--muted);font-size:12px;font-weight:700;margin-right:-1px}
.rv-strip .m.cur{background:var(--ivory);color:var(--ink);box-shadow:0 2px 0 #cdb98f}
.rv-strip .m.cur small{color:#7a6a55}
.rv-dot{width:8px;height:8px;border-radius:50%;flex:none;box-shadow:0 0 0 1.5px rgba(0,0,0,.25)}

/* ---------- action buttons ---------- */
.rv .fs-actions{gap:7px}
.rv .fs-btn span{white-space:nowrap}
.rv .fs-btn.primary{flex:1.7}
.rv .fs-btn.primary.wide{flex:3}
.rv .fs-btn.on{color:var(--brass-light);box-shadow:0 4px 0 rgba(0,0,0,.28),inset 0 0 0 2px var(--brass)}
.rv .fs-btn.rv-retry{color:#ffb27a}
.rv-pi{display:grid;place-items:center;height:22px}
.rv .fs-btn.primary .icn{color:var(--ink)}

/* ---------- end card ---------- */
.rv-end-top{display:flex;align-items:center;gap:12px;flex:none}
.rv-medal{width:58px;height:58px;border-radius:50%;flex:none;display:grid;place-items:center;color:#3a2408;
  background:radial-gradient(circle at 35% 30%,#fff1c2,var(--brass) 55%,#c88c26);box-shadow:0 4px 0 var(--brass-dark),0 0 26px rgba(255,210,110,.35);animation:rvPop .5s cubic-bezier(.3,1.6,.5,1)}
.rv-medal .icn{color:#3a2408}
@keyframes rvPop{from{transform:scale(.3) rotate(-25deg);opacity:0}}
.rv-end-t{font-family:var(--display);font-size:24px;letter-spacing:.3px;line-height:1.1}
.rv-end-acc{display:flex;align-items:baseline;gap:2px}
.rv-end-acc b{font-family:var(--display);font-weight:400;font-size:30px;color:var(--brass-light);font-variant-numeric:tabular-nums}
.rv-end-acc i{font-style:normal;font-family:var(--display);font-size:16px;color:var(--brass-light);opacity:.7}
.rv-end-acc small{margin-left:6px;color:var(--muted);font-weight:700;font-size:13px}
.rv-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:none}
.rv-stat{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 7px;border-radius:14px;background:rgba(0,0,0,.2);min-width:0}
.rv-stat b{font-family:var(--display);font-weight:400;font-size:22px;line-height:1}
.rv-stat small{font-size:11px;font-weight:700;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv-tips{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rv-tips li{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border-radius:13px;background:rgba(0,0,0,.18);font-size:14px;line-height:1.38}
.rv-tips li .icn{color:var(--brass-light);flex:none;margin-top:2px}

/* retry modal: board fits small phones */
.rv-retrybox .board-wrap{width:min(calc(100% - 20px),46vh,46dvh);margin:10px auto}

@media (max-height:700px){
  .rv .rv-say .txt{font-size:14.5px;padding:8px 11px}
  .rv-accv .accv{font-size:30px}
  .rv-acc{padding:8px 8px 6px}
  .rv-sheet{gap:7px;padding:10px}
  .rv-cnt{padding:4px 5px}
  .rv-open{padding:6px 10px}
  .rv-graph{height:24px} .rv-graph.rv-flow{height:40px}
  .rv-strip .m{height:30px}
  .rv-tips li{padding:7px 10px;font-size:13.5px}
}
@media (prefers-reduced-motion:reduce){.rv-scan::after,.rv-prog-bar>div{animation:none}.rv-sheet{animation:none}}

/* 50-me.css */
/* =====================================================================
   Me tab: player card, section tabs, trophy cabinet, Style, Stats, Settings
   ===================================================================== */
/* ---------- player card ---------- */

.me-name{min-height:34px;display:flex;align-items:center}
