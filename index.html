<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141a2e">
<meta name="description" content="Knight Club: play chess against bots, solve puzzles, learn to play, and challenge friends peer-to-peer.">
<title>Knight Club Chess</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Knight Club">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>:root{
  --bg:#141a2e; --bg2:#1c2440; --card:#232d4f; --card2:#2b3760; --line:#34416e;
  --text:#f3f1ea; --muted:#a9b0c9; --accent:#ffb547; --accent2:#ff8a5c; --good:#4fd18b; --bad:#ff6b6b; --blue:#6fb3ff;
  --light:#f0e2c6; --dark:#b5875a; --r:16px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Nunito',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:16px;line-height:1.4}
body{min-height:100vh;padding-bottom:calc(76px + var(--safe-b))}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;cursor:pointer;background:none}
input{font-family:inherit;font-size:16px}
h1,h2,h3{margin:0;line-height:1.15}
.app{max-width:560px;margin:0 auto;padding:12px 14px 20px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 12px}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:22px;letter-spacing:.2px}
.logo img{width:30px;height:30px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);padding:6px 10px;border-radius:999px;font-weight:800;font-size:14px}
.chip small{color:var(--muted);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack>*+*{margin-top:12px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:14px;font-weight:800;background:var(--card2);border:1px solid var(--line);transition:transform .08s,filter .15s;min-height:46px}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,#ffc56b,#ff9f43);color:#3a2205;border:0;box-shadow:0 4px 0 #c96f1a}
.btn.primary:active{box-shadow:0 1px 0 #c96f1a;transform:translateY(3px)}
.btn.good{background:var(--good);color:#06301a;border:0}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.sm{padding:8px 10px;min-height:38px;font-size:14px;border-radius:12px}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px 6px;border-radius:10px;font-weight:800;color:var(--muted);font-size:14px}
.seg button.on{background:var(--card2);color:var(--text)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(20,26,46,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + var(--safe-b));z-index:20}
.tabs .inner{display:flex;max-width:560px;width:100%}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);font-size:12px;font-weight:800;border-radius:12px}
.tabs button .ic{font-size:22px;line-height:1}
.tabs button.on{color:var(--accent);background:rgba(255,181,71,.08)}
/* board */
.board-wrap{position:relative;width:100%;aspect-ratio:1;border-radius:10px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35),0 0 0 3px #3b2a1b;touch-action:none;user-select:none;-webkit-user-select:none}
.board{position:absolute;inset:0}
.sq{position:absolute;width:12.5%;height:12.5%}
.sq.l{background:var(--light)} .sq.d{background:var(--dark)}
.sq .co{position:absolute;font-size:10px;font-weight:900;opacity:.75;pointer-events:none}
.sq .co.f{right:3px;bottom:1px} .sq .co.r{left:3px;top:1px}
.sq.l .co{color:var(--dark)} .sq.d .co{color:var(--light)}
.sq.last::after{content:'';position:absolute;inset:0;background:rgba(255,213,0,.38)}
.sq.sel::after{content:'';position:absolute;inset:0;background:rgba(80,200,120,.5)}
.sq.hint::after{content:'';position:absolute;inset:0;background:rgba(111,179,255,.55);animation:pulse 1s infinite alternate}
.sq.mark::after{content:'';position:absolute;inset:0;background:rgba(111,179,255,.4)}
.sq.check::before{content:'';position:absolute;inset:0;background:radial-gradient(circle,rgba(255,40,40,.95) 0%,rgba(255,40,40,.5) 40%,rgba(255,40,40,0) 72%)}
.sq .dot{position:absolute;left:50%;top:50%;width:30%;height:30%;margin:-15% 0 0 -15%;border-radius:50%;background:rgba(20,30,20,.28);z-index:3;pointer-events:none}
.sq .ring{position:absolute;inset:4%;border-radius:50%;border:5px solid rgba(20,30,20,.28);z-index:3;pointer-events:none}
.sq .star{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(7vw,34px);z-index:4;pointer-events:none;animation:bob 1.2s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(-2px) scale(.95)}to{transform:translateY(2px) scale(1.05)}}
@keyframes pulse{from{opacity:.5}to{opacity:1}}
.pieces{position:absolute;inset:0;pointer-events:none}
.piece{position:absolute;width:12.5%;height:12.5%;background-size:100%;background-repeat:no-repeat;z-index:5;transition:left .18s ease,top .18s ease;will-change:left,top}
.piece.drag{transition:none;z-index:50;transform:scale(1.25);filter:drop-shadow(0 6px 6px rgba(0,0,0,.35))}
.piece.noanim{transition:none}
.fx{position:absolute;inset:0;pointer-events:none;z-index:60;display:flex;align-items:center;justify-content:center}
.fx .burst{font-size:64px;animation:pop .7s ease-out forwards}
@keyframes pop{0%{transform:scale(.2);opacity:0}40%{transform:scale(1.2);opacity:1}100%{transform:scale(1);opacity:0}}
/* players */
.pbar{display:flex;align-items:center;gap:10px;padding:8px 4px}
.avatar{width:38px;height:38px;border-radius:12px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.pname{font-weight:900;font-size:15px}
.prating{color:var(--muted);font-weight:700;font-size:13px}
.caps{display:flex;align-items:center;min-height:18px;flex-wrap:wrap}
.caps img{width:16px;height:16px;margin-right:-4px}
.caps b{margin-left:8px;font-size:12px;color:var(--muted)}
.thinking{font-size:12px;color:var(--accent);font-weight:800}
.turnmark{width:10px;height:10px;border-radius:50%;background:var(--good);box-shadow:0 0 8px var(--good)}
.moves{display:flex;gap:4px;overflow-x:auto;padding:8px 2px;scrollbar-width:none;font-size:14px;white-space:nowrap}
.moves::-webkit-scrollbar{display:none}
.moves .n{color:var(--muted);font-weight:700;padding:3px 0 3px 4px}
.moves .m{padding:3px 7px;border-radius:8px;font-weight:800}
.moves .m.cur{background:var(--card2);color:var(--accent)}
.controls{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.controls .btn{padding:8px 2px;flex-direction:column;gap:0;font-size:11px;min-height:54px}
.controls .btn .ic{font-size:20px}
.nav{display:flex;gap:6px;justify-content:center;margin:2px 0}
.nav .btn{flex:1;min-height:36px;padding:4px}
/* bot list */
.bots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bot{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px}
.bot.on{border-color:var(--accent);background:#2e3150}
.bot .av{font-size:30px}
.bot .nm{font-weight:900}
.bot .rt{font-weight:800;color:var(--accent);font-size:14px}
.bot .bl{font-size:12px;color:var(--muted)}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(5,8,18,.65);display:flex;align-items:flex-end;justify-content:center;z-index:100;padding:12px;animation:fade .15s}
@media(min-width:600px){.modal-bg{align-items:center}}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:22px;padding:20px;width:100%;max-width:440px;animation:up .2s ease-out;max-height:90vh;overflow:auto}
@keyframes fade{from{opacity:0}} @keyframes up{from{transform:translateY(30px);opacity:0}}
.modal h2{font-size:24px;margin-bottom:6px}
.big-emoji{font-size:54px;text-align:center}
.promo{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.promo button{background:var(--light);border-radius:14px;aspect-ratio:1;background-size:80%;background-position:center;background-repeat:no-repeat}
.delta{font-weight:900;font-size:20px}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)}
/* learn */
.lessons{display:grid;gap:10px}
.lgroup h3{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin:14px 2px 8px}
.lesson{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;text-align:left;width:100%}
.lesson .ic{width:44px;height:44px;border-radius:12px;background:var(--light);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none;background-size:80%;background-position:center;background-repeat:no-repeat}
.lesson .t{font-weight:900}
.lesson .d{font-size:13px;color:var(--muted)}
.lesson .ck{margin-left:auto;font-size:20px}
.bubble{display:flex;gap:10px;align-items:flex-start}
.bubble .who{font-size:40px;line-height:1}
.bubble .txt{background:#fff8ea;color:#2d2416;border-radius:18px;border-top-left-radius:4px;padding:12px 14px;font-size:17px;font-weight:700;flex:1}
.bubble .txt b{color:#c2410c}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)} .dots i.on{background:var(--accent)} .dots i.done{background:var(--good)}
.taskmsg{text-align:center;font-weight:900;min-height:24px}
.taskmsg.good{color:var(--good)} .taskmsg.bad{color:var(--bad)}
/* puzzles */
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.cats::-webkit-scrollbar{display:none}
.cats button{white-space:nowrap;padding:8px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:800;font-size:13px;color:var(--muted)}
.cats button.on{background:var(--accent);color:#3a2205;border-color:var(--accent)}
.banner{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:800}
.banner.good{background:rgba(79,209,139,.15);border-color:var(--good)}
.banner.bad{background:rgba(255,107,107,.13);border-color:var(--bad)}
.tomove{width:18px;height:18px;border-radius:50%;border:2px solid #888;flex:none}
/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat .v{font-size:30px;font-weight:900}
.stat .l{font-size:13px;color:var(--muted);font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td{padding:7px 4px;border-bottom:1px solid var(--line)}
.tbl td:last-child{text-align:right;font-weight:800}
.spark{width:100%;height:70px;display:block}
.code{font-size:38px;font-weight:900;letter-spacing:8px;text-align:center;color:var(--accent);background:var(--bg2);border-radius:14px;padding:10px;border:2px dashed var(--line)}
.input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--text);font-weight:800}
.code-input{text-transform:uppercase;letter-spacing:6px;text-align:center;font-size:26px}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-weight:800;z-index:200;animation:up .2s;box-shadow:0 8px 20px rgba(0,0,0,.3);max-width:92vw;text-align:center}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:800;background:var(--card2);color:var(--muted)}
.pill.live{background:rgba(79,209,139,.2);color:var(--good)}
.hidden{display:none!important}
.center{text-align:center}
a{color:var(--blue)}
/* ---- original icon system ---- */
.icn{display:inline-flex;align-items:center;justify-content:center;line-height:0;flex:none}
.icn svg{display:block}
.btn .icn{margin:0 -1px}
.controls .btn .icn{margin-bottom:3px}
.tabs button .icn{margin-bottom:1px}
.seg button{display:inline-flex;align-items:center;justify-content:center;gap:5px}
.chip .icn{color:var(--blue)}
.rt .icn{color:var(--accent);vertical-align:-2px}
.av-img{display:block;border-radius:50%}
.avatar{background:none;padding:0}
.avatar .av-img{border-radius:12px}
.bot .av .av-img{border-radius:14px}
.sq .star .icn{color:#ffc93c;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.sq .star .icn svg{width:min(8vw,40px);height:min(8vw,40px)}
.burst-ic{filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.burst-ic.star,.burst-ic.trophy,.burst-ic.crown{color:#ffc93c}
.badge{width:76px;height:76px;margin:0 auto 6px;border-radius:24px;display:flex;align-items:center;justify-content:center}
.badge.gold{background:linear-gradient(160deg,#ffd77a,#ff9f43);color:#4a2a05}
.badge.blue{background:linear-gradient(160deg,#9ccbff,#4f8fe8);color:#0c2547}
.badge.red{background:linear-gradient(160deg,#ffa3a3,#e86a6a);color:#4a0c0c}
.badge.green{background:linear-gradient(160deg,#8ff0bd,#3cbf7c);color:#063019}
.lesson .ic.dark{background:var(--card2);color:var(--accent)}
.lesson .ck{color:var(--muted)} .lesson .ck.done{color:var(--good)}
.bubble .who{flex:none}
.hoot{display:block}
.banner .icn{color:var(--accent)} .banner.good .icn{color:var(--good)}
.tbl td.res{font-weight:800;font-size:13px} .tbl td.res.w{color:var(--good)} .tbl td.res.l{color:var(--bad)} .tbl td.res.d{color:var(--blue)}
.stat .l .icn{vertical-align:-2px}
/* clocks */
.clock{font-variant-numeric:tabular-nums;font-weight:900;font-size:20px;padding:6px 10px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);color:var(--muted);min-width:78px;text-align:center}
.clock.on{background:#f3efe4;color:#1b1f2e;border-color:#f3efe4}
.clock.low.on{background:var(--bad);color:#fff;border-color:var(--bad)}
.tcs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tcs button{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:7px 4px;display:flex;flex-direction:column;align-items:center;line-height:1.15}
.tcs button b{font-size:15px} .tcs button small{font-size:11px;color:var(--muted);font-weight:700}
.tcs button.on{border-color:var(--accent);background:#2e3150} .tcs button.on b{color:var(--accent)}
/* puzzles 2.0 */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode-card{background:linear-gradient(160deg,#2b3760,#232d4f);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left}
.mode-card .icn{color:var(--accent);margin-bottom:4px} .mode-card b{font-size:17px} .mode-card small{color:var(--muted);font-weight:700}
.strikes{display:flex;gap:4px} .strikes .icn{color:var(--line)} .strikes .icn.hit{color:var(--bad)}
.rushlog{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.rl{font-size:12px;font-weight:800;padding:3px 7px;border-radius:8px} .rl.ok{background:rgba(79,209,139,.18);color:var(--good)} .rl.bad{background:rgba(255,107,107,.15);color:var(--bad)}
/* rewards */
.levelcard .lvlnum{width:52px;height:52px;border-radius:16px;background:linear-gradient(160deg,#ffd77a,#ff9f43);color:#3a2205;font-size:26px;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none}
.xpbar{height:10px;border-radius:6px;background:var(--bg2);overflow:hidden;margin-top:10px}
.xpbar div{height:100%;background:linear-gradient(90deg,#6fb3ff,#4fd18b);border-radius:6px;transition:width .6s}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;margin-top:10px}
.ach{aspect-ratio:1;border-radius:14px;background:var(--bg2);border:1px solid var(--line);color:#4a5580;display:flex;align-items:center;justify-content:center}
.ach.got.t1{background:linear-gradient(160deg,#e9b98c,#a8683a);color:#3a1d07;border:0}
.ach.got.t2{background:linear-gradient(160deg,#eef2f7,#9aa6b8);color:#26303f;border:0}
.ach.got.t3{background:linear-gradient(160deg,#ffe28a,#e0a020);color:#3e2a00;border:0}
.achbig{width:84px;height:84px;margin:0 auto 8px;border-radius:26px;display:flex;align-items:center;justify-content:center;background:var(--bg2);color:#4a5580}
.achbig.got.t1{background:linear-gradient(160deg,#e9b98c,#a8683a);color:#3a1d07}.achbig.got.t2{background:linear-gradient(160deg,#eef2f7,#9aa6b8);color:#26303f}.achbig.got.t3{background:linear-gradient(160deg,#ffe28a,#e0a020);color:#3e2a00}
.rtoasts{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;width:min(92vw,400px);pointer-events:none}
.rtoast{display:flex;gap:10px;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 10px 24px rgba(0,0,0,.35);animation:up .25s ease-out;transition:opacity .4s,transform .4s}
.rtoast.out{opacity:0;transform:translateY(-10px)}
.rtoast b{display:block;font-size:14px} .rtoast small{color:var(--muted);font-weight:700;font-size:12px}
.rti{width:36px;height:36px;border-radius:12px;background:var(--bg2);display:flex;align-items:center;justify-content:center;color:var(--accent);flex:none}
.rtoast.gold .rti{background:linear-gradient(160deg,#ffe28a,#e0a020);color:#3e2a00}
.rtoast.silver .rti{background:linear-gradient(160deg,#eef2f7,#9aa6b8);color:#26303f}
.rtoast.bronze .rti{background:linear-gradient(160deg,#e9b98c,#a8683a);color:#3a1d07}
.rti .av-img{border-radius:8px}
.sect{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin:6px 2px 0}
.preview{max-width:300px;margin:0 auto;width:100%}
.stylegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stylecell{position:relative;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.stylecell.on{border-color:var(--accent)} .stylecell.locked{opacity:.55}
.stylecell b{font-size:12px} .stylecell small{font-size:10.5px;color:var(--muted);font-weight:700;line-height:1.15}
.stylecell .lock{position:absolute;top:6px;right:6px;color:var(--muted)}
.swatch{display:grid;grid-template-columns:1fr 1fr;width:46px;height:46px;border-radius:8px;overflow:hidden}
.swatch i{display:block}
.pset{display:flex;height:46px;align-items:center;background:var(--bg2);border-radius:10px;padding:0 4px}
.pset img{width:30px;height:30px}
.no-coords .sq .co{display:none}
.no-anim .piece{transition:none!important}
/* lobby */
.lesson.hero{background:linear-gradient(160deg,#33406f,#26305a);border-color:#4a5a92}
.lesson .ic.gold{background:linear-gradient(160deg,#ffd77a,#ff9f43);color:#3a2205}
details.card summary{cursor:pointer;list-style:none} details.card summary::-webkit-details-marker{display:none}
.chatbar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chatbar::-webkit-scrollbar{display:none}
.chatbar button{white-space:nowrap;padding:7px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:800;font-size:13px}
.chatlog{display:flex;flex-direction:column;gap:4px;min-height:0}

.accbox{text-align:center;padding:8px 14px;border-radius:14px;background:var(--bg2)} .accbox.mine{outline:2px solid var(--accent)}
.accv{font-size:28px;font-weight:900}
.ctbl td{padding:4px} .ctbl td:first-child{text-align:left;font-weight:800;width:30px} .ctbl td:nth-child(2){font-weight:700} .ctbl td:last-child{width:30px}

.revhead{display:flex;align-items:center;gap:8px;min-height:30px}
.revmoves .m{display:inline-flex;align-items:center;gap:3px}
.bubble .txt{font-size:16px}
.tbl tr.tap{cursor:pointer}
/* analysis */
.mode-card.slim{flex:1;flex-direction:row;align-items:center;gap:8px;padding:10px 12px}
.mode-card.slim .icn{margin:0}

.evalbar .fill{position:absolute;top:0;left:0;right:0;background:#2b2730;height:50%;transition:height .4s}
.evalbar span{position:absolute;left:0;right:0;bottom:4px;font-size:8px;font-weight:900;text-align:center;color:#2b2730;writing-mode:vertical-rl;transform:rotate(180deg)}

</head>
<body>
<div id="app" class="app"></div>
<script>// Chess rules engine + search. Written as one self-contained factory so it can run
// in the page, in a Web Worker (via Function.toString), and in Node for testing.
function ChessEngineFactory() {
  'use strict';
  const P = 1, N = 2, B = 3, R = 4, Q = 5, K = 6, BLACK = 8;
  const WHITE_SIDE = 0, BLACK_SIDE = 1;
  const F_CAP = 1, F_EP = 2, F_CASTLE = 4, F_DOUBLE = 8;
  const N_OFF = [33, 31, 18, 14, -33, -31, -18, -14];
  const K_OFF = [1, -1, 16, -16, 17, 15, -17, -15];
  const B_OFF = [17, 15, -17, -15];
  const R_OFF = [1, -1, 16, -16];
  const PIECE_CHARS = ' PNBRQK  pnbrqk';

  // ---------- zobrist ----------
  let seed = 0x2545F491;
  function rnd() { seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5; return seed >>> 0; }
  const Z1 = new Uint32Array(16 * 128), Z2 = new Uint32Array(16 * 128);
  for (let i = 0; i < Z1.length; i++) { Z1[i] = rnd(); Z2[i] = rnd(); }
  const ZC1 = new Uint32Array(16), ZC2 = new Uint32Array(16);
  for (let i = 0; i < 16; i++) { ZC1[i] = rnd(); ZC2[i] = rnd(); }
  const ZE1 = new Uint32Array(8), ZE2 = new Uint32Array(8);
  for (let i = 0; i < 8; i++) { ZE1[i] = rnd(); ZE2[i] = rnd(); }
  const ZS1 = rnd(), ZS2 = rnd();

  const CASTLE_MASK = new Uint8Array(128).fill(15);
  CASTLE_MASK[4] = 15 & ~3; CASTLE_MASK[7] = 15 & ~1; CASTLE_MASK[0] = 15 & ~2;
  CASTLE_MASK[116] = 15 & ~12; CASTLE_MASK[119] = 15 & ~4; CASTLE_MASK[112] = 15 & ~8;

  const sqName = s => 'abcdefgh'[s & 7] + ((s >> 4) + 1);
  const sqFromName = n => (n.charCodeAt(0) - 97) + (n.charCodeAt(1) - 49) * 16;
  const mFrom = m => m & 127, mTo = m => (m >> 7) & 127, mPromo = m => (m >> 14) & 15, mFlags = m => (m >> 18) & 15;
  const mk = (from, to, promo, flags) => from | (to << 7) | (promo << 14) | (flags << 18);
  const colorOf = p => (p & BLACK) ? 1 : 0;

  class Position {
    constructor(fen) {
      this.board = new Int8Array(128);
      this.load(fen || 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1');
    }
    load(fen) {
      const parts = fen.trim().split(/\s+/);
      this.board.fill(0);
      let rank = 7, file = 0;
      for (const c of parts[0]) {
        if (c === '/') { rank--; file = 0; continue; }
        if (c >= '1' && c <= '8') { file += +c; continue; }
        const idx = PIECE_CHARS.indexOf(c);
        if (idx < 0) throw new Error('bad fen');
        this.board[rank * 16 + file] = idx;
        file++;
      }
      this.turn = parts[1] === 'b' ? 1 : 0;
      this.castle = 0;
      const c = parts[2] || '-';
      if (c.includes('K')) this.castle |= 1; if (c.includes('Q')) this.castle |= 2;
      if (c.includes('k')) this.castle |= 4; if (c.includes('q')) this.castle |= 8;
      this.ep = (parts[3] && parts[3] !== '-') ? sqFromName(parts[3]) : -1;
      this.half = parts[4] ? +parts[4] : 0;
      this.full = parts[5] ? +parts[5] : 1;
      this.kings = [-1, -1];
      for (let s = 0; s < 128; s++) {
        if (s & 0x88) { s += 7; continue; }
        if (this.board[s] === K) this.kings[0] = s;
        if (this.board[s] === (K | BLACK)) this.kings[1] = s;
      }
      // sanitize castling rights against actual piece placement
      const b = this.board;
      if (!(b[4] === K && b[7] === R)) this.castle &= ~1;
      if (!(b[4] === K && b[0] === R)) this.castle &= ~2;
      if (!(b[116] === (K | BLACK) && b[119] === (R | BLACK))) this.castle &= ~4;
      if (!(b[116] === (K | BLACK) && b[112] === (R | BLACK))) this.castle &= ~8;
      if (this.ep >= 0 && !this.epCapturable(this.ep, this.turn)) this.ep = -1;
      this.stack = [];
      this.computeHash();
      this.hist1 = [this.h1]; this.hist2 = [this.h2];
    }
    epCapturable(epSq, side) {
      // is there a pawn of `side` that could capture onto epSq?
      const pawn = side === 0 ? P : (P | BLACK);
      const from1 = side === 0 ? epSq - 15 : epSq + 15, from2 = side === 0 ? epSq - 17 : epSq + 17;
      return (!(from1 & 0x88) && this.board[from1] === pawn) || (!(from2 & 0x88) && this.board[from2] === pawn);
    }
    computeHash() {
      let h1 = 0, h2 = 0;
      for (let s = 0; s < 128; s++) {
        if (s & 0x88) { s += 7; continue; }
        const p = this.board[s];
        if (p) { h1 ^= Z1[p * 128 + s]; h2 ^= Z2[p * 128 + s]; }
      }
      h1 ^= ZC1[this.castle]; h2 ^= ZC2[this.castle];
      if (this.ep >= 0) { h1 ^= ZE1[this.ep & 7]; h2 ^= ZE2[this.ep & 7]; }
      if (this.turn) { h1 ^= ZS1; h2 ^= ZS2; }
      this.h1 = h1 >>> 0; this.h2 = h2 >>> 0;
    }
    fen() {
      let out = '';
      for (let r = 7; r >= 0; r--) {
        let empty = 0;
        for (let f = 0; f < 8; f++) {
          const p = this.board[r * 16 + f];
          if (!p) { empty++; continue; }
          if (empty) { out += empty; empty = 0; }
          out += PIECE_CHARS[p];
        }
        if (empty) out += empty;
        if (r) out += '/';
      }
      let c = '';
      if (this.castle & 1) c += 'K'; if (this.castle & 2) c += 'Q';
      if (this.castle & 4) c += 'k'; if (this.castle & 8) c += 'q';
      return `${out} ${this.turn ? 'b' : 'w'} ${c || '-'} ${this.ep >= 0 ? sqName(this.ep) : '-'} ${this.half} ${this.full}`;
    }
    clone() { const p = new Position(this.fen()); return p; }

    attacked(sq, by) {
      const b = this.board;
      if (by === 0) {
        let s = sq - 15; if (!(s & 0x88) && b[s] === P) return true;
        s = sq - 17; if (!(s & 0x88) && b[s] === P) return true;
      } else {
        let s = sq + 15; if (!(s & 0x88) && b[s] === (P | BLACK)) return true;
        s = sq + 17; if (!(s & 0x88) && b[s] === (P | BLACK)) return true;
      }
      const cb = by ? BLACK : 0;
      for (let i = 0; i < 8; i++) { const s = sq + N_OFF[i]; if (!(s & 0x88) && b[s] === (N | cb)) return true; }
      for (let i = 0; i < 8; i++) { const s = sq + K_OFF[i]; if (!(s & 0x88) && b[s] === (K | cb)) return true; }
      for (let i = 0; i < 4; i++) {
        const d = B_OFF[i]; let s = sq + d;
        while (!(s & 0x88)) {
          const p = b[s];
          if (p) { if (p === (B | cb) || p === (Q | cb)) return true; break; }
          s += d;
        }
      }
      for (let i = 0; i < 4; i++) {
        const d = R_OFF[i]; let s = sq + d;
        while (!(s & 0x88)) {
          const p = b[s];
          if (p) { if (p === (R | cb) || p === (Q | cb)) return true; break; }
          s += d;
        }
      }
      return false;
    }
    inCheck(side = this.turn) { return this.attacked(this.kings[side], side ^ 1); }

    // pseudo-legal move generation. capturesOnly for quiescence.
    genMoves(capturesOnly = false) {
      const moves = [];
      const b = this.board, us = this.turn, them = us ^ 1, cb = us ? BLACK : 0;
      const dir = us ? -16 : 16, startRank = us ? 6 : 1, promoRank = us ? 0 : 7;
      for (let sq = 0; sq < 128; sq++) {
        if (sq & 0x88) { sq += 7; continue; }
        const p = b[sq];
        if (!p || colorOf(p) !== us) continue;
        const t = p & 7;
        if (t === P) {
          const one = sq + dir;
          if (!(one & 0x88) && b[one] === 0) {
            if ((one >> 4) === promoRank) {
              moves.push(mk(sq, one, Q, 0));
              if (!capturesOnly) { moves.push(mk(sq, one, R, 0)); moves.push(mk(sq, one, B, 0)); moves.push(mk(sq, one, N, 0)); }
            } else if (!capturesOnly) {
              moves.push(mk(sq, one, 0, 0));
              const two = one + dir;
              if ((sq >> 4) === startRank && b[two] === 0) moves.push(mk(sq, two, 0, F_DOUBLE));
            }
          }
          for (let k = 0; k < 2; k++) {
            const to = sq + dir + (k ? 1 : -1);
            if (to & 0x88) continue;
            const tp = b[to];
            if (tp && colorOf(tp) === them) {
              if ((to >> 4) === promoRank) {
                moves.push(mk(sq, to, Q, F_CAP));
                if (!capturesOnly) { moves.push(mk(sq, to, R, F_CAP)); moves.push(mk(sq, to, B, F_CAP)); moves.push(mk(sq, to, N, F_CAP)); }
              } else moves.push(mk(sq, to, 0, F_CAP));
            } else if (to === this.ep) moves.push(mk(sq, to, 0, F_CAP | F_EP));
          }
        } else if (t === N || t === K) {
          const offs = t === N ? N_OFF : K_OFF;
          for (let i = 0; i < 8; i++) {
            const to = sq + offs[i];
            if (to & 0x88) continue;
            const tp = b[to];
            if (!tp) { if (!capturesOnly) moves.push(mk(sq, to, 0, 0)); }
            else if (colorOf(tp) === them) moves.push(mk(sq, to, 0, F_CAP));
          }
          if (t === K && !capturesOnly) {
            if (us === 0 && sq === 4) {
              if ((this.castle & 1) && !b[5] && !b[6] && !this.attacked(4, 1) && !this.attacked(5, 1) && !this.attacked(6, 1)) moves.push(mk(4, 6, 0, F_CASTLE));
              if ((this.castle & 2) && !b[3] && !b[2] && !b[1] && !this.attacked(4, 1) && !this.attacked(3, 1) && !this.attacked(2, 1)) moves.push(mk(4, 2, 0, F_CASTLE));
            } else if (us === 1 && sq === 116) {
              if ((this.castle & 4) && !b[117] && !b[118] && !this.attacked(116, 0) && !this.attacked(117, 0) && !this.attacked(118, 0)) moves.push(mk(116, 118, 0, F_CASTLE));
              if ((this.castle & 8) && !b[115] && !b[114] && !b[113] && !this.attacked(116, 0) && !this.attacked(115, 0) && !this.attacked(114, 0)) moves.push(mk(116, 114, 0, F_CASTLE));
            }
          }
        } else {
          const offs = t === B ? B_OFF : t === R ? R_OFF : K_OFF;
          for (let i = 0; i < offs.length; i++) {
            const d = offs[i]; let to = sq + d;
            while (!(to & 0x88)) {
              const tp = b[to];
              if (!tp) { if (!capturesOnly) moves.push(mk(sq, to, 0, 0)); }
              else { if (colorOf(tp) === them) moves.push(mk(sq, to, 0, F_CAP)); break; }
              to += d;
            }
          }
        }
      }
      return moves;
    }

    make(m) {
      const b = this.board, from = mFrom(m), to = mTo(m), promo = mPromo(m), flags = mFlags(m);
      const us = this.turn, piece = b[from], dir = us ? -16 : 16;
      const capSq = (flags & F_EP) ? to - dir : to;
      const captured = b[capSq];
      this.stack.push({ m, captured, castle: this.castle, ep: this.ep, half: this.half, h1: this.h1, h2: this.h2 });
      let h1 = this.h1, h2 = this.h2;
      // remove moving piece
      h1 ^= Z1[piece * 128 + from]; h2 ^= Z2[piece * 128 + from];
      if (captured) { h1 ^= Z1[captured * 128 + capSq]; h2 ^= Z2[captured * 128 + capSq]; b[capSq] = 0; }
      const placed = promo ? (promo | (us ? BLACK : 0)) : piece;
      b[from] = 0; b[to] = placed;
      h1 ^= Z1[placed * 128 + to]; h2 ^= Z2[placed * 128 + to];
      if (flags & F_CASTLE) {
        let rf, rt;
        if (to === 6) { rf = 7; rt = 5; } else if (to === 2) { rf = 0; rt = 3; }
        else if (to === 118) { rf = 119; rt = 117; } else { rf = 112; rt = 115; }
        const rook = b[rf]; b[rf] = 0; b[rt] = rook;
        h1 ^= Z1[rook * 128 + rf] ^ Z1[rook * 128 + rt]; h2 ^= Z2[rook * 128 + rf] ^ Z2[rook * 128 + rt];
      }
      if ((piece & 7) === K) this.kings[us] = to;
      // castling rights
      h1 ^= ZC1[this.castle]; h2 ^= ZC2[this.castle];
      this.castle &= CASTLE_MASK[from] & CASTLE_MASK[to];
      h1 ^= ZC1[this.castle]; h2 ^= ZC2[this.castle];
      // en passant
      if (this.ep >= 0) { h1 ^= ZE1[this.ep & 7]; h2 ^= ZE2[this.ep & 7]; }
      this.ep = -1;
      if (flags & F_DOUBLE) {
        const epSq = from + dir;
        if (this.epCapturable(epSq, us ^ 1)) { this.ep = epSq; h1 ^= ZE1[epSq & 7]; h2 ^= ZE2[epSq & 7]; }
      }
      this.half = ((piece & 7) === P || captured) ? 0 : this.half + 1;
      if (us === 1) this.full++;
      this.turn = us ^ 1;
      h1 ^= ZS1; h2 ^= ZS2;
      this.h1 = h1 >>> 0; this.h2 = h2 >>> 0;
      this.hist1.push(this.h1); this.hist2.push(this.h2);
    }
    unmake() {
      const u = this.stack.pop();
      const m = u.m, b = this.board, from = mFrom(m), to = mTo(m), promo = mPromo(m), flags = mFlags(m);
      this.turn ^= 1;
      const us = this.turn, dir = us ? -16 : 16;
      let piece = b[to];
      if (promo) piece = P | (us ? BLACK : 0);
      b[from] = piece; b[to] = 0;
      if (u.captured) { const capSq = (flags & F_EP) ? to - dir : to; b[capSq] = u.captured; }
      if (flags & F_CASTLE) {
        let rf, rt;
        if (to === 6) { rf = 7; rt = 5; } else if (to === 2) { rf = 0; rt = 3; }
        else if (to === 118) { rf = 119; rt = 117; } else { rf = 112; rt = 115; }
        b[rf] = b[rt]; b[rt] = 0;
      }
      if ((piece & 7) === K) this.kings[us] = from;
      if (us === 1) this.full--;
      this.castle = u.castle; this.ep = u.ep; this.half = u.half; this.h1 = u.h1; this.h2 = u.h2;
      this.hist1.pop(); this.hist2.pop();
    }
    makeNull() {
      this.stack.push({ m: 0, captured: 0, castle: this.castle, ep: this.ep, half: this.half, h1: this.h1, h2: this.h2, nul: true });
      let h1 = this.h1, h2 = this.h2;
      if (this.ep >= 0) { h1 ^= ZE1[this.ep & 7]; h2 ^= ZE2[this.ep & 7]; }
      this.ep = -1; this.turn ^= 1; h1 ^= ZS1; h2 ^= ZS2;
      this.h1 = h1 >>> 0; this.h2 = h2 >>> 0; this.half++;
      this.hist1.push(this.h1); this.hist2.push(this.h2);
    }
    unmakeNull() {
      const u = this.stack.pop();
      this.turn ^= 1; this.ep = u.ep; this.half = u.half; this.h1 = u.h1; this.h2 = u.h2;
      this.hist1.pop(); this.hist2.pop();
    }
    // make a move and report whether it was legal (if not, it is undone)
    tryMake(m) {
      this.make(m);
      if (this.attacked(this.kings[this.turn ^ 1], this.turn)) { this.unmake(); return false; }
      return true;
    }
    legalMoves() {
      const out = [];
      for (const m of this.genMoves()) if (this.tryMake(m)) { this.unmake(); out.push(m); }
      return out;
    }
    hasLegalMove() {
      for (const m of this.genMoves()) if (this.tryMake(m)) { this.unmake(); return true; }
      return false;
    }
    repetitionCount() {
      // how many times the current position has occurred (including now)
      const n = this.hist1.length - 1, h1 = this.h1, h2 = this.h2;
      let count = 1;
      for (let i = n - 2; i >= 0 && i >= n - this.half; i -= 2)
        if (this.hist1[i] === h1 && this.hist2[i] === h2) count++;
      return count;
    }
    insufficientMaterial() {
      let minors = 0, bishopColors = [0, 0], knights = 0;
      for (let s = 0; s < 128; s++) {
        if (s & 0x88) { s += 7; continue; }
        const t = this.board[s] & 7;
        if (!t || t === K) continue;
        if (t === P || t === R || t === Q) return false;
        minors++;
        if (t === N) knights++; else bishopColors[((s >> 4) + (s & 7)) & 1]++;
      }
      if (minors <= 1) return true;
      if (knights === 0 && (bishopColors[0] === 0 || bishopColors[1] === 0)) return true;
      return false;
    }
    // game status: {over, result:'1-0'|'0-1'|'1/2-1/2', reason}
    status() {
      const hasMove = this.hasLegalMove();
      if (!hasMove) {
        if (this.inCheck()) return { over: true, result: this.turn ? '1-0' : '0-1', reason: 'checkmate' };
        return { over: true, result: '1/2-1/2', reason: 'stalemate' };
      }
      if (this.insufficientMaterial()) return { over: true, result: '1/2-1/2', reason: 'insufficient material' };
      if (this.half >= 100) return { over: true, result: '1/2-1/2', reason: '50-move rule' };
      if (this.repetitionCount() >= 3) return { over: true, result: '1/2-1/2', reason: 'threefold repetition' };
      return { over: false };
    }
    pieceAt(name) { return this.board[sqFromName(name)]; }

    // ---------- notation ----------
    uci(m) { return sqName(mFrom(m)) + sqName(mTo(m)) + (mPromo(m) ? 'nbrq'[mPromo(m) - 2] : ''); }
    moveFromUci(str, legal) {
      legal = legal || this.legalMoves();

// pick a bot move. rng: () => [0,1). salt: per-game number. Returns uci string.
function botChooseMove(E, searcher, pos, level, rng, salt, plyIndex, bookLine) {
  const legal = pos.legalMoves();
  if (!legal.length) return null;
  if (bookLine && plyIndex < level.book && plyIndex < bookLine.length) {
    const m = pos.moveFromSan(bookLine[plyIndex]);
    if (m) return { uci: pos.uci(m), book: true };
  }
  if (level.blunder && rng() < level.blunder) {
    const m = legal[Math.floor(rng() * legal.length)];
    return { uci: pos.uci(m), blunder: true };
  }
  const r = searcher.search(pos, { maxDepth: level.depth, maxNodes: level.nodes, noise: level.noise, salt });
  return { uci: pos.uci(r.move || legal[0]), score: r.score, depth: r.depth };
}

function glicko2(pl, games) {

  if (delta * delta > phi * phi + v) B = Math.log(delta * delta - phi * phi - v);
  else { let k = 1; while (f(a - k * tau) < 0) k++; B = a - k * tau; }
  let fA = f(A), fB = f(B);
  for (let i = 0; i < 60 && Math.abs(B - A) > eps; i++) {
    const C = A + (A - B) * fA / (fB - fA), fC = f(C);
    if (fC * fB <= 0) { A = B; fA = fB; } else fA /= 2;
    B = C; fB = fC;
  }

  const phiStar = Math.sqrt(phi * phi + sig2 * sig2);
  const phiNew = 1 / Math.sqrt(1 / (phiStar * phiStar) + 1 / v);
  const muNew = mu + phiNew * phiNew * dSum;
  return { r: Math.max(100, Math.round((muNew * S + 1500) * 10) / 10), rd: Math.max(45, Math.min(350, phiNew * S)), vol: sig2 };
}

// ======================= CLOCKS =======================
// A clock is a plain object so it can be saved and sent: {base, inc, w, b, running:'w'|'b'|null, since}
// Times are in ms. Clocks start once both sides have made their first move (like most chess sites).
const TIME_CONTROLS = [[0, 0, 'Untimed'], [60, 0, 'Bullet'], [180, 0, 'Blitz'], [180, 2, 'Blitz'], [300, 0, 'Blitz'], [600, 0, 'Rapid'], [600, 5, 'Rapid'], [900, 10, 'Rapid'], [1800, 0, 'Classical']];

const tcKey = (base, inc) => base + '+' + inc;

const clk = {
  rem(c, color) { let t = c[color]; if (c.running === color) t -= Date.now() - c.since; return Math.max(0, t); },
  // call right after `mover` has moved; plies = number of moves played so far
  press(c, mover, plies) {
    if (!c) return;
    if (c.running === mover) c[mover] = clk.rem(c, mover) + c.inc;
    c.running = null;
    if (plies >= 2) { c.running = mover === 'w' ? 'b' : 'w'; c.since = Date.now(); }
  },
  stop(c) { if (c && c.running) { c[c.running] = clk.rem(c, c.running); c.running = null; } },
  flagged(c) { return c && c.running && clk.rem(c, c.running) <= 0 ? c.running : null; },
  fmt(ms) {
    if (ms >= 3600000) { const hh = Math.floor(ms / 3600000); return hh + ':' + String(Math.floor(ms / 60000) % 60).padStart(2, '0') + ':' + String(Math.floor(ms / 1000) % 60).padStart(2, '0'); }

    if (ms < 10000) return '0:0' + sec + '.' + Math.floor(ms / 100) % 10;
    return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
  },
  // for sending over the network: freeze elapsed time into the message
  wire(c) { if (!c) return null; const o = Object.assign({}, c); if (c.running) o.elapsed = Date.now() - c.since; delete o.since; return o; },
  unwire(o) { if (!o) return null; const c = Object.assign({}, o); c.since = Date.now() - (o.elapsed || 0); delete c.elapsed; return c; },

// can `color` still deliver checkmate with its remaining material? (FIDE: flag vs lone king/minor = draw)
function canStillMate(pos, color) {

  for (let s = 0; s < 128; s++) { if (s & 0x88) { s += 7; continue; } const p = pos.board[s]; if (!p || (p & 8) !== side) continue; const t = p & 7; if (t === 1 || t === 4 || t === 5) return true; if (t === 2 || t === 3) minors++; }

}
